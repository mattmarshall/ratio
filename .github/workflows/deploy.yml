name: deploy

# Builds the demo image and deploys it to the ratio account (320473299741) as
# a Lambda behind an HTTP API.
#
# Why Lambda: the demo is used a few times a week, and everything else that
# serves HTTP on AWS bills while idle. Lambda plus an HTTP API costs nothing at
# rest — $1 per million requests and no hourly charge — and the Lambda Web
# Adapter runs `ratio watch` unmodified, so what is demoed is what ships rather
# than a Lambda-shaped port of it.
#
# The API is there because a public Function URL, which would have been simpler
# still, is refused in this account. See the comment in deploy/app.yaml.
#
# Why no long-lived key: the runner assumes `ratio-demo-deploy` via GitHub's
# OIDC provider. The trust policy is scoped to this repo's main branch, so a
# pull request from a fork cannot deploy.
#
# One-time setup, run by a human with admin on the account:
#
#   aws cloudformation deploy \
#     --template-file deploy/bootstrap.yaml \
#     --stack-name ratio-demo-bootstrap \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides GitHubRepo=mattmarshall/ratio
#
# ⚠ `BudgetEmail` used to be listed here and is not a parameter of that
# template — the budget lives in `mattmarshall/cloud-org`, at the payer. Passing
# it fails the command outright with "Parameter values specified for a template
# which does not require them", which is a confusing first thing to meet when
# setting this account up for the first time.

on:
  push:
    branches: [main]
    paths:
      # ⛔ `console/**` IS DELIBERATELY NOT HERE. The console is deployed by
      # Vercel, and a stylesheet change must not rebuild an image, push it to
      # ECR and roll a Lambda. That coupling is what this migration removed:
      # `//web:console_html` was embedded in the binary, so every console edit
      # WAS a backend deploy. Adding it back here would restore the cost
      # without restoring the reason.
      - 'crates/**'
      - 'proto/**'
      - 'deploy/**'
      - 'lean/**'
      - 'MODULE.bazel*'
      - 'Cargo.*'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# A deploy must not race another deploy. Not cancel-in-progress: a half-applied
# CloudFormation change set is worse than a queued one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required to request the OIDC token

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: "320473299741"
  ECR_REPO: ratio-demo
  STACK: ratio-demo-app

jobs:
  deploy:
    # Pinned, not `ubuntu-latest`. The binary links against this runner's glibc
    # and deploy/Dockerfile runs it on ubuntu:24.04; the two are a matched pair.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-deploy-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'Cargo.lock', '.bazelrc') }}
          restore-keys: bazel-deploy-${{ runner.os }}-

      # Bazel only, never cargo — the same build the tests run against.
      - name: Build ratio
        run: bazel build --lockfile_mode=error //crates/ratio

      # Refuse to ship an image whose contents were never checked. The deploy
      # workflow runs on the same push as build.yml but not after it, so
      # without this a red test suite and a green deploy can happen at once.
      #
      # ⛔ THE NINETEEN PDFs, AND NOTHING ELSE — see the note above `PDF_FREE` in
      # build.yml for why they cannot be built here. Same pattern, same reason:
      # tectonic reaches relay.fullyjustified.net at action time, and a release
      # path must not run through somebody else's CDN.
      - name: Test
        run: |
          bazel test --lockfile_mode=error --test_output=errors -- \
            //... -//marketing:positioning -//paper:ratio -//competitive/specs:all

      - name: Seed the demo book
        run: |
          cp "$(bazel info bazel-bin)/crates/ratio/ratio" deploy/ratio
          chmod +x deploy/ratio
          ./deploy/seed-demo-book.sh deploy/ratio deploy/demo-book
          ./deploy/seed-demo-funds.sh deploy/ratio deploy/demo-funds

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::320473299741:role/ratio-demo-deploy
          aws-region: us-east-1
          role-session-name: gha-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push
        id: image
        working-directory: deploy
        run: |
          set -euo pipefail
          REG="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker build --platform linux/amd64 -t "$REG/$ECR_REPO:${GITHUB_SHA}" .
          docker push "$REG/$ECR_REPO:${GITHUB_SHA}"
          # Deploy by digest, not by tag. A tag can be moved; a digest names
          # exactly the bytes this run built, so the function and the commit
          # cannot drift apart.
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$REG/$ECR_REPO:${GITHUB_SHA}")"
          echo "uri=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Deploying $DIGEST"

      - name: Deploy
        # The Google OAuth credentials come from repository secrets and are read
        # here as env vars rather than interpolated into the command line, so the
        # secret never lands in a process argument. Both are empty until the
        # secrets are set, and app.yaml treats empty as "Google off" — so this
        # deploys the same with or without them.
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          # Who the seeded funds are granted to, comma-separated. A repository
          # VARIABLE (not a secret — an email is not one) so the Google account
          # you sign in with can be granted without committing it. Unset falls
          # back to the app.yaml default, keeping the email/password demo user.
          DEMO_MEMBERS: ${{ vars.DEMO_MEMBERS }}
          # Where the console is served from. A repository VARIABLE, like
          # DEMO_MEMBERS and for the same reason — a hostname is not a secret.
          # Unset means "no console yet": `/` then says what this process serves
          # instead of redirecting, and Cognito registers only the localhost
          # callback. See the ⛔ on CallbackURLs in deploy/app.yaml.
          CONSOLE_ORIGIN: ${{ vars.CONSOLE_ORIGIN }}
          # Ratio WorkOS Production client id. A VARIABLE — it is a public
          # identifier, not a secret. Unset uses the app.yaml default.
          # Do not point this at another product.
          WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
          # The verified SES identity the report email sends from. A repository
          # VARIABLE like the others — an address is not a secret. Unset means
          # no email, which is the correct state until SES verifies.
          SCALE_SENDER: ${{ vars.SCALE_SENDER }}
        run: |
          # ⛔ CAPABILITY_NAMED_IAM, BECAUSE THE STACK CREATES TWO NAMED ROLES.
          # The scale runner's task role and task execution role are named
          # (`ratio-demo-scale-task`, `ratio-demo-scale-exec`) so that the deploy
          # role in bootstrap.yaml can scope iam:CreateRole to those two exact
          # ARNs — an unnamed role gets a generated ARN no policy can name in
          # advance. Naming them is what buys the tight scope; this flag is the
          # price of naming them.
          aws cloudformation deploy \
            --template-file deploy/app.yaml \
            --stack-name "$STACK" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ImageUri='${{ steps.image.outputs.uri }}' \
              ExecutionRoleArn="arn:aws:iam::${ACCOUNT_ID}:role/ratio-demo-execution" \
              BuildSha="${GITHUB_SHA}" \
              GoogleClientId="${GOOGLE_CLIENT_ID}" \
              GoogleClientSecret="${GOOGLE_CLIENT_SECRET}" \
              ConsoleOrigin="${CONSOLE_ORIGIN}" \
              DemoMember="${DEMO_MEMBERS:-demo@ratio.fastverk.dev}" \
              ScaleSender="${SCALE_SENDER}" \
              WorkOsClientId="${WORKOS_CLIENT_ID:-client_01M1JJZTFXFDZJ0XJM1NPNSEJB}"

      - name: Smoke test the deployed demo
        env:
          # ⛔ ASSERTED, NOT JUST PASSED. The step above hands this to
          # CloudFormation; the step below reads it back out of the running
          # process to prove it arrived. See the /authconfig.json check.
          CONSOLE_ORIGIN: ${{ vars.CONSOLE_ORIGIN }}
          # The verified SES identity the report email sends from. A repository
          # VARIABLE like the others — an address is not a secret. Unset means
          # no email, which is the correct state until SES verifies.
          SCALE_SENDER: ${{ vars.SCALE_SENDER }}
        run: |
          set -euo pipefail
          URL="$(aws cloudformation describe-stacks --stack-name "$STACK" \
                  --query 'Stacks[0].Outputs[?OutputKey==`DemoUrl`].OutputValue' --output text)"
          echo "URL: $URL"
          # An empty URL makes every curl below return 000, which reads as "the
          # demo is down" when it actually means this query named an output
          # that no longer exists. It did, once — the output was renamed.
          case "$URL" in
            https://*) ;;
            *) echo "::error::no DemoUrl output on $STACK (got '$URL')"; exit 1 ;;
          esac

          # ⛔ WAIT FOR THE NEW IMAGE, NOT FOR A 200.
          #
          # `cloudformation deploy` returns when the stack is updated, but Lambda
          # keeps serving warm containers on the OLD image for a while after. A
          # healthz probe is answered by one of those and reports success, so the
          # next assertion runs against the previous build — which is exactly how
          # this step failed the first time /app existed: healthz was green and
          # /app was a 404 from an image that predated it.
          #
          # So poll for something only the new build serves. /version reports the
          # commit the binary was built from.
          for i in $(seq 1 24); do
            SEEN="$(curl -s "${URL}version" || true)"
            [ "$SEEN" = "$GITHUB_SHA" ] && break
            echo "  attempt $i: serving '${SEEN:-nothing}', want ${GITHUB_SHA:0:7}"
            sleep 5
          done
          [ "$SEEN" = "$GITHUB_SHA" ] || {
            echo "::error::after 2 minutes the URL still serves '${SEEN:-nothing}', not $GITHUB_SHA"
            exit 1
          }
          echo "serving $GITHUB_SHA"

          # ⛔ NEVER `curl ... | grep -q` UNDER pipefail.
          #
          # `grep -q` exits at the first match, which SIGPIPEs curl, which
          # pipefail reports as a failed pipeline — so the assertion fails
          # BECAUSE it matched. It is racy below the 64KB pipe buffer and
          # reliable above it, which is why the 196KB console page failed here
          # while the smaller screens passed. Capture, then match.
          want() {  # want <name> <pattern> <url>
            local body
            body="$(curl -sf "$3")" || { echo "::error::$1: could not fetch $3"; exit 1; }
            case "$body" in
              *"$2"*) ;;
              *) echo "::error::$1: expected '$2'"; exit 1 ;;
            esac
          }

          deny() {
            case "$(curl -sf "$3" || echo FETCH-FAILED)" in
              *"$2"*) echo "::error::$1: found '$2' and should not have"; exit 1 ;;
            esac
          }

          # The plain screens still render.
          #
          # ⛔ `${URL}balance`, NOT `$URL`. This asserted against `/` and passed,
          # because `/` served the React console and "Trial balance" was one of
          # its tab labels — so it was testing the console while claiming to test
          # the screen. `/` is a redirect now and `curl -sf` does not follow one,
          # so leaving it would have failed for the right reason by accident.
          # These four screens are Rust string literals and have their own URLs.
          want "the balance screen" "Trial balance" "${URL}balance"

          # And they render the demo BOOK, not an empty one. An image whose
          # book failed to ship starts cleanly, answers healthz, and serves a
          # blank ledger — every signal green. That shipped twice.
          # ⚠ NOT an exact entry count. This asserted '"entries":7' until
          # seeding learned to admit facts and mark positions, which changed it
          # correctly and turned the deploy red. A check that has to be edited
          # every time the demo gains a step gets edited without being read.
          # What it is FOR is telling a shipped book from a blank one, so it
          # says that instead.
          deny "an empty book" '"entries":0'          "${URL}balance.json"
          want "a book that ties" '"difference":"0.00"' "${URL}balance.json"
          want "the proposal"  '"pending":[{'         "${URL}rules.json"
          # 2000.00 is deploy/seed-demo-book.sh's number.
          want "the break"     '"difference":"2000.00"' "${URL}breaks.json"

          # ⛔ THE CONSOLE IS NOT SERVED FROM HERE ANY MORE, so this no longer
          # asserts a React shell at /app. What it asserts instead is that the
          # front door is not a dead end: `/` either redirects to the console or
          # says what this process does serve. Both are fine; a 404 with no body
          # is not, because that URL is the "Try the live demo" link in
          # README.md and on the marketing site.
          #
          # ⚠ `-o /dev/null` and NO `-L`: the point is the 302 itself, not what
          # it lands on. Following it would test Vercel from a workflow that
          # does not deploy Vercel.
          front="$(curl -s -o /dev/null -w '%{http_code}' "${URL}")"
          case "$front" in
            302|404) echo "front door: $front" ;;
            *) echo "::error::/ returned $front, neither a redirect nor a stated 404"; exit 1 ;;
          esac

          # The sign-in flow can still bootstrap: /authconfig.json is public and
          # names the identity provider. ⛔ The path changed with the console —
          # it is the console's own callback route now, and it MUST match a
          # registered Cognito callback URL or every sign-in is refused by the
          # IdP with an error the console cannot explain.
          # The scale screen is public and must stay that way — it is the one
          # place the twenty-million-lot claim can be checked by somebody with
          # no account. ⚠ Asserting the RECORDED figure, not a live one: no
          # fold has run on a fresh deploy, and a smoke test that waited for one
          # would wait sixteen minutes.
          want "the scale screen" "Twenty million tax lots" "${URL}scale"
          # The funnel: the gate is on the page, and the run-report shell
          # serves for any well-formed id — a bad one 404s at the JSON, which
          # is what the page's own script renders as a sentence.
          want "the email gate" "Unlock the demo" "${URL}scale"
          want "the report shell" "A fold, and the figures it struck" "${URL}scale/runs/full-1"
          deny "a traversal id reaching a key" '"open_lots"' "${URL}scale/runs/..%2fcurrent.json"
          want "the recorded cold build" "995.0 s" "${URL}scale"
          want "the shapes it can fold" '"size":"full"' "${URL}scale-runs.json"
          # ⛔ AND THE RUNNER IS WIRED. `"runner":null` means the function has no
          # cluster to start a fold on — which is a valid LOCAL state and a
          # broken deployed one, so the deploy is where it must be caught.
          deny "an unwired scale runner" '"runner":null' "${URL}scale-runs.json"

          want "the auth config" '"redirectPath":"/callback"' "${URL}authconfig.json"

          # ⛔ THE CONSOLE TAKES ITS OAuth `redirect_uri` FROM THIS FIELD, so a
          # wrong value here refuses every sign-in — and refuses it at the IdP,
          # with an error the console cannot explain because it never sees it.
          # The field and the Cognito CallbackURLs are built from one
          # ConsoleOrigin parameter, which is the point: this asserts the
          # parameter arrived, not that two things agree.
          #
          # ⚠ Only when the variable is set. Unset is a supported state — no
          # console to point at — and app.yaml registers just the localhost
          # callback then.
          if [ -n "${CONSOLE_ORIGIN:-}" ]; then
            want "the console origin" "\"consoleOrigin\":\"${CONSOLE_ORIGIN}\"" \
              "${URL}authconfig.json"
          else
            echo "CONSOLE_ORIGIN unset; skipping the console-origin assertion"
          fi

          # ⛔ AUTH IS ON. Every /v1 route now requires a verified token, so an
          # unauthenticated request is REFUSED rather than served — this is the
          # assertion that proves the tenant boundary is live rather than merely
          # merged. The /v1 CONTENT checks that used to live here (a held
          # position, the three fund states, the NAV replay) move behind an
          # authenticated smoke user; see deploy/README.md. The public
          # /balance.json and /breaks.json above still prove a real book shipped,
          # so blank-book protection is intact.
          code="$(curl -s -o /dev/null -w '%{http_code}' "${URL}v1/funds")"
          [ "$code" = "401" ] || {
            echo "::error::/v1/funds returned $code, not 401 — auth is not enforced"
            exit 1
          }

          # MCP answers, and the fence still holds on a public endpoint.
          TOOLS="$(curl -sf -X POST "${URL}mcp" -H 'content-type: application/json' \
                    -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')"
          case "$TOOLS" in
            *propose_rule*) ;;
            *) echo "::error::MCP did not list its tools"; exit 1 ;;
          esac
          case "$TOOLS" in
            *approve_rule*) echo "::error::approve_rule is exposed publicly"; exit 1 ;;
          esac

          echo "### Ratio demo deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Screens: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- MCP: \`${URL}mcp\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.image.outputs.uri }}\`" >> "$GITHUB_STEP_SUMMARY"
