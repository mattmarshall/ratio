name: deploy

# Builds the demo image and deploys it to the ratio account (320473299741) as
# a Lambda behind an HTTP API.
#
# Why Lambda: the demo is used a few times a week, and everything else that
# serves HTTP on AWS bills while idle. Lambda plus an HTTP API costs nothing at
# rest — $1 per million requests and no hourly charge — and the Lambda Web
# Adapter runs `ratio watch` unmodified, so what is demoed is what ships rather
# than a Lambda-shaped port of it.
#
# The API is there because a public Function URL, which would have been simpler
# still, is refused in this account. See the comment in deploy/app.yaml.
#
# Why no long-lived key: the runner assumes `ratio-demo-deploy` via GitHub's
# OIDC provider. The trust policy is scoped to this repo's main branch, so a
# pull request from a fork cannot deploy.
#
# One-time setup, run by a human with admin on the account:
#
#   aws cloudformation deploy \
#     --template-file deploy/bootstrap.yaml \
#     --stack-name ratio-demo-bootstrap \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides GitHubRepo=mattmarshall/ratio BudgetEmail=you@example.com

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'web/**'
      - 'proto/**'
      - 'deploy/**'
      - 'lean/**'
      - 'MODULE.bazel*'
      - 'Cargo.*'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# A deploy must not race another deploy. Not cancel-in-progress: a half-applied
# CloudFormation change set is worse than a queued one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required to request the OIDC token

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: "320473299741"
  ECR_REPO: ratio-demo
  STACK: ratio-demo-app

jobs:
  deploy:
    # Pinned, not `ubuntu-latest`. The binary links against this runner's glibc
    # and deploy/Dockerfile runs it on ubuntu:24.04; the two are a matched pair.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-deploy-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'Cargo.lock', '.bazelrc', 'web/pnpm-lock.yaml') }}
          restore-keys: bazel-deploy-${{ runner.os }}-

      # Bazel only, never cargo — the same build the tests run against.
      - name: Build ratio
        run: bazel build --lockfile_mode=error //crates/ratio

      # Refuse to ship an image whose contents were never checked. The deploy
      # workflow runs on the same push as build.yml but not after it, so
      # without this a red test suite and a green deploy can happen at once.
      - name: Test
        run: bazel test --lockfile_mode=error --test_output=errors //...

      - name: Seed the demo book
        run: |
          cp "$(bazel info bazel-bin)/crates/ratio/ratio" deploy/ratio
          chmod +x deploy/ratio
          ./deploy/seed-demo-book.sh deploy/ratio deploy/demo-book
          ./deploy/seed-demo-funds.sh deploy/ratio deploy/demo-funds

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::320473299741:role/ratio-demo-deploy
          aws-region: us-east-1
          role-session-name: gha-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push
        id: image
        working-directory: deploy
        run: |
          set -euo pipefail
          REG="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker build --platform linux/amd64 -t "$REG/$ECR_REPO:${GITHUB_SHA}" .
          docker push "$REG/$ECR_REPO:${GITHUB_SHA}"
          # Deploy by digest, not by tag. A tag can be moved; a digest names
          # exactly the bytes this run built, so the function and the commit
          # cannot drift apart.
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$REG/$ECR_REPO:${GITHUB_SHA}")"
          echo "uri=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Deploying $DIGEST"

      - name: Deploy
        run: |
          aws cloudformation deploy \
            --template-file deploy/app.yaml \
            --stack-name "$STACK" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ImageUri='${{ steps.image.outputs.uri }}' \
              ExecutionRoleArn="arn:aws:iam::${ACCOUNT_ID}:role/ratio-demo-execution" \
              BuildSha="${GITHUB_SHA}"

      - name: Smoke test the deployed demo
        run: |
          set -euo pipefail
          URL="$(aws cloudformation describe-stacks --stack-name "$STACK" \
                  --query 'Stacks[0].Outputs[?OutputKey==`DemoUrl`].OutputValue' --output text)"
          echo "URL: $URL"
          # An empty URL makes every curl below return 000, which reads as "the
          # demo is down" when it actually means this query named an output
          # that no longer exists. It did, once — the output was renamed.
          case "$URL" in
            https://*) ;;
            *) echo "::error::no DemoUrl output on $STACK (got '$URL')"; exit 1 ;;
          esac

          # ⛔ WAIT FOR THE NEW IMAGE, NOT FOR A 200.
          #
          # `cloudformation deploy` returns when the stack is updated, but Lambda
          # keeps serving warm containers on the OLD image for a while after. A
          # healthz probe is answered by one of those and reports success, so the
          # next assertion runs against the previous build — which is exactly how
          # this step failed the first time /app existed: healthz was green and
          # /app was a 404 from an image that predated it.
          #
          # So poll for something only the new build serves. /version reports the
          # commit the binary was built from.
          for i in $(seq 1 24); do
            SEEN="$(curl -s "${URL}version" || true)"
            [ "$SEEN" = "$GITHUB_SHA" ] && break
            echo "  attempt $i: serving '${SEEN:-nothing}', want ${GITHUB_SHA:0:7}"
            sleep 5
          done
          [ "$SEEN" = "$GITHUB_SHA" ] || {
            echo "::error::after 2 minutes the URL still serves '${SEEN:-nothing}', not $GITHUB_SHA"
            exit 1
          }
          echo "serving $GITHUB_SHA"

          # ⛔ NEVER `curl ... | grep -q` UNDER pipefail.
          #
          # `grep -q` exits at the first match, which SIGPIPEs curl, which
          # pipefail reports as a failed pipeline — so the assertion fails
          # BECAUSE it matched. It is racy below the 64KB pipe buffer and
          # reliable above it, which is why the 196KB console page failed here
          # while the smaller screens passed. Capture, then match.
          want() {  # want <name> <pattern> <url>
            local body
            body="$(curl -sf "$3")" || { echo "::error::$1: could not fetch $3"; exit 1; }
            case "$body" in
              *"$2"*) ;;
              *) echo "::error::$1: expected '$2'"; exit 1 ;;
            esac
          }

          deny() {
            case "$(curl -sf "$3" || echo FETCH-FAILED)" in
              *"$2"*) echo "::error::$1: found '$2' and should not have"; exit 1 ;;
            esac
          }

          # The plain screens still render.
          want "the balance screen" "Trial balance" "$URL"

          # And they render the demo BOOK, not an empty one. An image whose
          # book failed to ship starts cleanly, answers healthz, and serves a
          # blank ledger — every signal green. That shipped twice.
          # ⚠ NOT an exact entry count. This asserted '"entries":7' until
          # seeding learned to admit facts and mark positions, which changed it
          # correctly and turned the deploy red. A check that has to be edited
          # every time the demo gains a step gets edited without being read.
          # What it is FOR is telling a shipped book from a blank one, so it
          # says that instead.
          deny "an empty book" '"entries":0'          "${URL}balance.json"
          want "a book that ties" '"difference":"0.00"' "${URL}balance.json"
          want "the proposal"  '"pending":[{'         "${URL}rules.json"
          # 2000.00 is deploy/seed-demo-book.sh's number.
          want "the break"     '"difference":"2000.00"' "${URL}breaks.json"

          # The console and its API.
          want "the console shell" 'id="root"'        "${URL}app"
          want "the fund list"     '"funds":[{'       "${URL}v1/funds"
          # ⛔ A POSITION. The seeder shipped facts that had never been admitted
          # once, so every row of the positions screen read "Not attributed" and
          # marking had nothing to mark — with every other signal green. This is
          # the assertion that would have caught it.
          want "a held position" '"quantity":"1000"' \
            "${URL}v1/funds/northstar-multi-strategy/positions"
          # Three funds in three states, and a NAV that re-derives. The replay
          # is the product's central claim; a demo that ships it broken ships
          # nothing.
          FUNDS="$(curl -sf "${URL}v1/funds")"
          for st in AWAITING_PRICES BLOCKED STRUCK; do
            case "$FUNDS" in
              *"\"state\":\"$st\""*) ;;
              *) echo "::error::no fund in state $st"; exit 1 ;;
            esac
          done
          SN="$(curl -sf "${URL}v1/funds/harbourline-global-value/navStrikes" \
                | sed -n 's/.*"name":"\([^"]*navStrikes[^"]*\)".*/\1/p' | head -1)"
          [ -n "$SN" ] || { echo "::error::no NAV strike to replay"; exit 1; }
          want "the NAV replay" '"historyIntact":true' "${URL}v1/${SN}:replay"
          want "the NAV re-derived" '"reproduced":true' "${URL}v1/${SN}:replay"
          # NAV as a JSON STRING is the one property a browser would otherwise
          # silently violate: an int64 as a number is a double.
          want "NAV as a string"   '"netAssetValue":"' "${URL}v1/funds"

          # MCP answers, and the fence still holds on a public endpoint.
          TOOLS="$(curl -sf -X POST "${URL}mcp" -H 'content-type: application/json' \
                    -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')"
          case "$TOOLS" in
            *propose_rule*) ;;
            *) echo "::error::MCP did not list its tools"; exit 1 ;;
          esac
          case "$TOOLS" in
            *approve_rule*) echo "::error::approve_rule is exposed publicly"; exit 1 ;;
          esac

          echo "### Ratio demo deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Screens: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- MCP: \`${URL}mcp\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.image.outputs.uri }}\`" >> "$GITHUB_STEP_SUMMARY"
