name: build

# Builds and tests everything: the Lean proofs, the Rust crates emitted from
# them, the AIP lint over the protos, and the two demo scripts.
#
# The demo scripts are the point of running this in CI rather than trusting a
# developer to remember. `//demo:rehearse_test` is PLAN.md's five-minute demo
# run end to end, and its central assertion is that the model has no way to
# approve a rule; `//demo:shadow_run_test` is the Stage 3 shadow run. A fence
# nobody tests is a fence that quietly opens, and a demo nobody rehearses is a
# demo that breaks in front of a customer.
#
# marketing/, paper/ and competitive/ are deliberately NOT path-ignored: they
# carry //marketing:language_test, the licensing sweep, and ignoring them would
# mean the one change that reintroduces "open source" is the one change that
# skips the check. That still holds — the sweep runs on every push here, and
# `PDF_FREE` below is written specifically so it keeps running.
#
# ⛔ WHAT `PDF_FREE` EXCLUDES, AND WHY IT IS NOT "SKIP THE MARKETING TREE".
# The nineteen `tectonic_pdf` targets — `//marketing:positioning`,
# `//paper:ratio`, and the seventeen `//competitive/specs:*` — run tectonic,
# which despite marketing/BUILD.bazel calling it "one hermetic tectonic action"
# fetches its TeX bundle from relay.fullyjustified.net AT ACTION TIME. That is a
# network call in the middle of the build, and when it fails the build fails.
#
# ⚠ IT IS A TRAP, NOT A FLAKE, WHICH IS WHY RE-RUNNING NEVER CLEARED IT. The
# cache key holds `MODULE.bazel.lock` and `Cargo.lock`, so any dependency change
# mints a cold key. A cold cache actually EXECUTES tectonic rather than replaying
# a cached action. Tectonic fails. The job dies before `Post Cache Bazel`, so
# nothing is saved — and the next run is cold again. Five consecutive runs across
# this workflow and deploy.yml died in that loop; the last green one was simply
# the last whose cache was still warm.
#
# ⭐ AND THE EXCLUSION COSTS NOTHING MEASURABLE. It names the PDF RULES, not the
# directories, so `tests(PDF_FREE)` is all 86 tests — the same set as `//...` —
# and `//marketing:language_test` is still among them. `tex_section`,
# `tex_figure`, the puml diagram and `//marketing:all_tex` carry no tectonic
# dependency and still build. What stops being checked here is whether the briefs
# still TYPESET; what keeps being checked is everything they say.
#
# Making tectonic genuinely hermetic — a pinned bundle instead of a fetch — is
# the real repair and belongs in its own change. Until then this is what lets a
# verified fix reach main and the demo.
#
# Bazel is the only build path — never cargo. The lockfiles are committed, so
# a build that needs `CARGO_BAZEL_REPIN=1` is a change somebody forgot to
# commit, and `--lockfile_mode=error` turns that into a failure here instead of
# a surprise later.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'site/**'
      - '**/*.md'
  workflow_dispatch:

# A merge burst must not stack runs on a fleet this size. `github.event_name`
# is in the key so a pull-request run never cancels a run of main.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Stage E live apply. `//...` stays hermetic (the denotational store).
    # `//crates/ratio-sql-project:pg_engine_test` is tagged `manual` so it
    # is not in that set; the step below runs it by name. Journal stays SoR.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ratio
          POSTGRES_PASSWORD: ratio
          POSTGRES_DB: ratio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ratio -d ratio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Keyed on the files that decide what gets fetched — the module lock, the
      # crate lock, and the toolchain pins. A miss re-downloads the Lean
      # toolchain and rebuilds the crate universe, which is the slow part.
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'Cargo.lock', '.bazelrc') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      # ⚠ THE PATTERN IS WRITTEN OUT IN BOTH STEPS RATHER THAN SET ONCE IN AN
      # ENV VAR, and the duplication is the safer half of the trade. A variable
      # that failed to get set expands to nothing, `bazel build --` then builds
      # NOTHING and exits 0, and the "What ran" step below still prints all 86
      # tests — a green run that checked zero targets, which is precisely the
      # failure that step exists to make visible. Two literal lines cannot do
      # that. Keep them in step.
      - name: Build
        run: |
          bazel build --lockfile_mode=error -- \
            //... -//marketing:positioning -//paper:ratio -//competitive/specs:all

      # This covers the Lean proof tests, the emitted-artifact diff tests, the
      # sorry audit, every Rust crate, and both demo scripts — all 86 tests
      # `//...` would run, the licensing sweep included.
      - name: Test
        run: |
          bazel test --lockfile_mode=error --test_output=errors -- \
            //... -//marketing:positioning -//paper:ratio -//competitive/specs:all

      # Surface which targets ran, so a silently-empty test set cannot pass as
      # a green build. A run that tests nothing looks identical to a run that
      # tests everything, right up until it matters.
      - name: What ran
        if: always()
        run: bazel query 'tests(//...)' --output=label 2>/dev/null | sort

      # ⛔ NOT A SKIP. RATIO_PG_URL unset fails the target. postgresql-client
      # is `psql`; the crate talks to the service through that, not a rust
      # postgres crate (the package stays off the Cargo workspace).
      - name: Live projection engine
        env:
          RATIO_PG_URL: postgres://ratio:ratio@127.0.0.1:5432/ratio
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
          bazel test --lockfile_mode=error --test_output=errors \
            --test_env=RATIO_PG_URL \
            -- \
            //crates/ratio-sql-project:pg_engine_test
