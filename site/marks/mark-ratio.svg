<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="currentColor" role="img" aria-label="Ratio">
  <!-- Two rows of exactly the same length: 48 units, from x=8 to x=56.
       The top row is cut 38/62; the bottom row is whole. However the entries
       are divided, the totals are equal — which is double-entry, and the only
       thing this product claims.

       Drawn as flat rects rather than a path so it stays crisp at 16px, where
       the earlier two-blocks-over-a-rule mark turned to mush. `currentColor`
       so it inherits ink or accent per theme.

       Regenerate nothing: this file is hand-authored and is the source. -->
  <rect x="8.00"  y="19" width="16.34" height="10" rx="2"/>
  <rect x="29.34" y="19" width="26.66" height="10" rx="2"/>
  <rect x="8.00"  y="35" width="48.00" height="10" rx="2"/>
</svg>
