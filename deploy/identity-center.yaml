AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Who can sign in to the ratio account. Deployed in the ORGANIZATION MANAGEMENT
  account (740659854426), not in the ratio account — Identity Center
  assignments are made from the management or delegated-admin account.

# Why this is a stack and not two CLI calls
#
# It was two CLI calls first, and that is exactly the problem: an account whose
# access exists only as something somebody once typed has no record of who is
# meant to reach it, and no way to review it in a diff. Every other account in
# this org carries the same pair; codifying it here means the next account is a
# copied parameter rather than a remembered procedure.
#
#   aws cloudformation deploy \
#     --template-file deploy/identity-center.yaml \
#     --stack-name ratio-identity-center \
#     --profile marsh --region us-east-1
#
# There is nothing to run on a schedule and nothing for CI to do here: this
# changes when a person's access should change, which is not a push event.

Parameters:
  InstanceArn:
    Type: String
    Default: arn:aws:sso:::instance/ssoins-722356c5527689d2
    Description: The `marsh` Identity Center instance, owned by the management account.
  AccountId:
    Type: String
    Default: "320473299741"
    Description: The ratio account.
  PlatformAdminsGroupId:
    Type: String
    Default: 4478f438-6001-70bd-b192-34d3c0c3ca07
    Description: >
      The `platform-admins` group in identity store d-9066753cc7. Assignments
      go to the group, never to a user: `marsh` is a member, and granting the
      group means adding a second person is a membership change rather than a
      template change.
  AdministratorAccessArn:
    Type: String
    Default: arn:aws:sso:::permissionSet/ssoins-722356c5527689d2/ps-72235c9cf0a0785c
  ReadOnlyAccessArn:
    Type: String
    Default: arn:aws:sso:::permissionSet/ssoins-722356c5527689d2/ps-72238ae7b94dc3a5

Resources:
  # The same pair every other account in the org carries — checked rather than
  # assumed: tomato-bazel and Lotic Labs have exactly this, fastverk-prod and
  # Matt have it plus a direct user grant that is redundant with the group.
  AdministratorAccess:
    Type: AWS::SSO::Assignment
    Properties:
      InstanceArn: !Ref InstanceArn
      PermissionSetArn: !Ref AdministratorAccessArn
      PrincipalType: GROUP
      PrincipalId: !Ref PlatformAdminsGroupId
      TargetType: AWS_ACCOUNT
      TargetId: !Ref AccountId

  # Separate from admin on purpose. Reading the account — checking what the
  # demo cost, what the function is doing — should not require assuming a role
  # that can delete it.
  ReadOnlyAccess:
    Type: AWS::SSO::Assignment
    Properties:
      InstanceArn: !Ref InstanceArn
      PermissionSetArn: !Ref ReadOnlyAccessArn
      PrincipalType: GROUP
      PrincipalId: !Ref PlatformAdminsGroupId
      TargetType: AWS_ACCOUNT
      TargetId: !Ref AccountId

Outputs:
  SignInHint:
    Description: How to reach the account once assigned.
    Value: !Sub >-
      aws sso login --sso-session marsh, then the ratio account
      (${AccountId}) appears at https://d-9066753cc7.awsapps.com/start
