AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Ratio demo — the function itself. Deployed by CI on every push to main,
  parameterised only by the image it should run.

Parameters:
  ImageUri:
    Type: String
    Description: The image CI just pushed, by digest.
  ExecutionRoleArn:
    Type: String
    Description: From the bootstrap stack.
  BuildSha:
    Type: String
    Default: dev
    Description: >
      The commit this deployment serves, reported at /version. The smoke test
      polls it to tell the new deployment from a warm container still running
      the previous image — "the URL returns 200" never meant "the URL runs what
      was just built".
  DemoMember:
    Type: String
    Default: demo@ratio.fastverk.dev
    Description: >
      Who every seeded fund is granted to in MEMBERSHIP.tsv, comma-separated. The
      tenant boundary matches a caller's verified email (or sub) against this, so
      each value MUST equal an email a member actually signs in as — the invited
      Cognito user, and any Google account (whose email arrives from Google). A
      mismatch signs the user in successfully and then shows an empty fund rail.
      Set the list via the DEMO_MEMBERS repository variable; entrypoint.sh writes
      the grant on each start. See deploy/README.md.
  ConsoleOrigin:
    Type: String
    Default: ""
    Description: >
      Where the operations console is served from, scheme and host, no trailing
      slash — e.g. https://console.ratio.example. The console is a Next.js
      application deployed to Vercel; this function no longer serves it. Two
      things read this: the function redirects / and /app there (so the "Try the
      live demo" links in README.md and on the marketing site keep working), and
      AuthKit registers ${ConsoleOrigin}/callback as the redirect URI. The
      Cognito pool below is left in place unused so this stack does not destroy
      a live user pool; it is not the sign-in path.

      ⛔ COGNITO ACCEPTS NO WILDCARDS. Every origin that must complete a sign-in
      has to be listed on the client below, which is why exactly three are —
      production, one stable preview alias, and localhost. A Vercel preview on
      its own generated hostname cannot sign in, by design: previews render from
      console/fixtures/ instead.

      Empty leaves the demo with no console to point at. Production is
      https://ratio.marsh.build, set via the CONSOLE_ORIGIN repository
      variable. The retired https://ratio-ims.vercel.app host still resolves
      and must not be shipped as this value.
  WorkOsClientId:
    Type: String
    Description: >
      WorkOS AuthKit client id for the Ratio project's Production environment
      (the audience the JWT authorizer checks). Public identifier, never a
      secret. Required — there is no default, because a missing value becoming
      a hard-coded production identifier is a silent wrong audience on /v1.
      Set it via the WORKOS_CLIENT_ID repository variable (the Production id
      is documented in deploy/README.md). The console holds WORKOS_CLIENT_ID /
      WORKOS_API_KEY / WORKOS_COOKIE_PASSWORD as Vercel env; this value is
      what API Gateway verifies on /v1. Do not substitute another product's
      client id.
  GoogleClientId:
    Type: String
    Default: ""
    Description: >
      OAuth client id of the Google app that backs "Continue with Google". Empty
      disables Google sign-in entirely (the pool keeps email/password), so this
      template deploys the same with or without it — set the id and secret as
      repository secrets and the next deploy lights Google up. Passed from CI, not
      committed.
  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      OAuth client secret paired with GoogleClientId. NoEcho so it is masked in
      stack events and not returned by describe-stacks. Passed from a repository
      secret; never committed.
  ScaleSender:
    Type: String
    Default: ""
    Description: >
      The verified SES identity the follow-up report email is sent from, e.g.
      demo@ratio.msoftware.co. Empty disables email entirely — the demo is
      whole without it, and the report link is on the page the moment a run
      completes. Set it only AFTER the identity verifies in SES, or every send
      fails quietly in the task log.

  ReservedConcurrency:
    Type: Number
    Default: 0
    Description: >
      Simultaneous invocations to reserve for this function; 0 leaves it unset.

      Unset is correct here and is not a missing guardrail. A new AWS account
      gets a total concurrency limit of 10, and AWS refuses any reservation
      that would leave fewer than 10 unreserved — so on this account a
      reservation cannot be created at all, and the account limit *is* the cap.
      It is also the better cap: a template edit cannot widen it, and it bounds
      every function in the account rather than this one.

      Set this only after raising the account quota, and only if something else
      in the account then needs protecting from the demo.

Conditions:
  ReserveConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]
  # Google sign-in is added only when an id has been supplied. The client's
  # provider list and the identity provider itself are both gated on this, so a
  # deploy with no Google secrets set is a valid, working demo (email/password
  # only) rather than a broken one.
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, ""]]
  # The console lives elsewhere, and might not be deployed yet. Same shape as
  # HasGoogle and for the same reason: a stack with no console origin set is a
  # working demo (the three public screens and the API) rather than a broken one.
  HasConsole: !Not [!Equals [!Ref ConsoleOrigin, ""]]

Resources:
  # Created explicitly rather than left to Lambda, which creates log groups
  # with retention set to "never expire" — the quietest recurring cost in AWS.
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/ratio-demo
      RetentionInDays: 7

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: ratio-demo
      Description: The three screens and the MCP endpoint, behind a Function URL.
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !Ref ExecutionRoleArn
      # 512MB is not about memory — the demo needs a fraction of it — but about
      # CPU, which Lambda allocates in proportion. It is the cheapest point at
      # which a cold start stays under half a second.
      MemorySize: 512
      # Every request is a table render or one JSON-RPC call. Anything taking
      # longer than this is stuck, and should fail rather than bill.
      Timeout: 15
      ReservedConcurrentExecutions: !If
        - ReserveConcurrency
        - !Ref ReservedConcurrency
        - !Ref "AWS::NoValue"
      Environment:
        Variables:
          RATIO_BOOK: /tmp/book
          RATIO_FUNDS: /tmp/funds
          # The journal is the part that does not heal on a cold start, so the
          # one write path has a ceiling even now that a caller must be signed
          # in to reach it.
          RATIO_MAX_API_ENTRIES: "250"
          RATIO_BUILD: !Ref BuildSha
          AWS_LWA_PORT: "8080"
          AWS_LWA_READINESS_CHECK_PATH: /healthz
          # ⛔ AUTH ACTIVATION. With RATIO_AUTH=required the server fails closed
          # on any /v1 request the JWT authorizer did not verify, and tenancy at
          # book_path then scopes each caller to the funds MEMBERSHIP grants
          # them. The COGNITO_* values are the public client configuration the
          # console serves at /authconfig.json to start the sign-in; the domain
          # is also what the CSP admits to connect-src for the token exchange.
          RATIO_AUTH: required
          # WorkOS is the IdP on /v1. Cognito resources remain in this template
          # so a stack update does not destroy the live pool; they are unused.
          RATIO_WORKOS_CLIENT_ID: !Ref WorkOsClientId
          # ⚠ AN OPEN DEMO. Its audience is not known ahead of time, so it cannot
          # be an allow-list of emails: RATIO_DEMO_OPEN grants any AUTHENTICATED
          # caller every fund, while the write stays signed with their id.
          # Sign-in is still required (RATIO_AUTH above) — anyone may sign in
          # (Google auto-provisions), and then everyone sees the demo. Unset this
          # to restore per-fund scoping from MEMBERSHIP with no other change.
          RATIO_DEMO_OPEN: "1"
          # Still written (the fallback if RATIO_DEMO_OPEN is unset); ignored while
          # the demo is open. entrypoint.sh seeds MEMBERSHIP.tsv from it.
          RATIO_DEMO_MEMBER: !Ref DemoMember
          # ⛔ WHERE / AND /app REDIRECT. The console used to be compiled into
          # this binary and served from here; it is a separate application now,
          # and this URL is the only thing that keeps the demo link in README.md
          # and on the marketing site from becoming a dead end. Empty is handled:
          # the function then says what it does serve rather than bouncing
          # somebody to an empty string.
          RATIO_CONSOLE_URL: !Ref ConsoleOrigin
          # ── The scale runner, for the button on /scale ──────────────────
          #
          # ⛔ THE FUNCTION LEARNS WHERE TO RUN A FOLD FROM HERE, NOT FROM A
          # LITERAL. Every one of these is a resource in this same template, so
          # a rename cannot leave the code pointing at something that no longer
          # exists — CloudFormation refuses the stack instead.
          #
          # ⚠ AND THE ABSENCE OF THEM IS A VALID STATE. A local `ratio watch`
          # sets none of these, and the scale screen serves its estimate and its
          # recorded figures with the button disabled — the same shape as
          # `RATIO_COGNITO_*` being unset meaning "no identity provider here"
          # rather than "misconfigured".
          RATIO_SCALE_CLUSTER: !Ref ScaleCluster
          RATIO_SCALE_TASK: !Ref ScaleTask
          RATIO_SCALE_SUBNET: !Ref ScaleSubnet
          RATIO_SCALE_SECURITY_GROUP: !GetAtt ScaleSecurityGroup.GroupId
          RATIO_SCALE_BUCKET: !Ref ScaleBucket
          # ⛔ THE JOURNAL. Same bucket as the scale record, a different prefix.
          # Unset, FileBook writes journal.jsonl under /tmp and a cold start
          # loses every ApplyEvent; two containers build two journals under one
          # URL. Set, append is LIST then conditional PUT at max+1
          # (`tla/S3Journal.tla`). The seeded chart and config still copy into
          # /tmp — they are not the system of record for a write.
          RATIO_JOURNAL_BUCKET: !Ref ScaleBucket
          RATIO_JOURNAL_PREFIX: journals/
          # The report email: who it is from, and where its permalink points.
          # ⚠ Both unset is a WORKING state — no email, nothing else changes.
          RATIO_SCALE_SENDER: !Ref ScaleSender
          RATIO_PUBLIC_ORIGIN: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
      Tags:
        - Key: project
          Value: ratio
        - Key: purpose
          Value: demo

  # How the demo is reached.
  #
  # This was a public Lambda Function URL, then CloudFront-in-front-of-one.
  # Neither works in this account: anonymous Function URLs are refused, and so
  # is CloudFront's OAC-signed request. Both were verified rather than
  # assumed — a SigV4 request signed with account credentials returns 200, a
  # throwaway control function is refused identically, and no SCP or RCP is
  # involved. Something above the account blocks Function URL access by
  # principals outside it, and no template can turn that off.
  #
  # An HTTP API reaches the same function and works. It is also cheap in the
  # same way a Function URL is: $1.00 per million requests and nothing at rest,
  # so a demo used a few times a week rounds to zero. The one thing given up is
  # response streaming, which nothing here uses.
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: ratio-demo
      ProtocolType: HTTP
      Description: The three screens and the MCP endpoint.
      # ⛔ `authorization` IS ABSENT FROM AllowHeaders, AND THAT IS NOW A FENCE
      # RATHER THAN AN OVERSIGHT. The console is served from another origin, so
      # the obvious thing to do is have the browser call /v1 directly with a
      # bearer — and this omission makes that impossible, because the preflight
      # refuses it. It has to be impossible: a browser that holds the id token
      # holds it somewhere a script on the page can reach, which is exactly what
      # moving the token into an httpOnly cookie on the console's server was for.
      #
      # The console's own requests never reach this configuration. They come
      # from its server, and a server-to-server fetch sends no Origin, so CORS
      # is not consulted at all. This block exists for /mcp, which is public and
      # is called from browsers.
      #
      # ⚠ Do not "fix" this by adding authorization. Adding it re-opens the
      # browser-direct path silently — nothing would fail, and the token would
      # simply move back into the page.
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type, mcp-session-id, mcp-protocol-version]
        MaxAge: 3600

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      # 2.0 is what the Lambda Web Adapter expects; on 1.0 it sees a different
      # event shape and every request 500s.
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 15000

  # One catch-all route. The application does its own routing — adding routes
  # here would mean two route tables that have to agree, and they would not.
  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: $default
      Target: !Sub "integrations/${Integration}"

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      # ⛔ THE COST CONTROL THAT MATTERS. Every other route is cheap; /chat.json
      # calls a paid model, and the endpoint is public. This bounds how fast
      # anyone can spend — a demo needs a handful of requests a minute and this
      # allows an order of magnitude more, while making a scripted abuser hit a
      # wall rather than a bill.
      #
      # The account's $5 budget in cloud-org is the alarm; this is the brake.
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20
      # $default serves at the API root, so URLs carry no stage prefix and the
      # links printed in the demo are the links people use.
      StageName: $default
      AutoDeploy: true

  ApiInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt Function.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"

  # ── Identity ──────────────────────────────────────────────────────────────
  #
  # Cognito Hosted UI on the DEFAULT (cognito-prefix) domain — NOT a custom
  # Hosted-UI domain, which provisions a CloudFront distribution this account
  # refuses (see the Api comment). Invite-only: a demo has a known set of
  # people, and public sign-up on an internet-facing pool is an abuse surface
  # with no upside here.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ratio-demo
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  # "Continue with Google", added only when a client id is supplied. Google is a
  # native Cognito social provider, so no shim is needed; the Hosted UI renders
  # the button automatically once this exists and the app client lists it.
  #
  # ⚠ FEDERATION AUTO-PROVISIONS. AdminCreateUserOnly above blocks the Hosted
  # UI's sign-up form, but a first Google sign-in still creates a pool user —
  # federation does not consult that setting. That is not an open door to data:
  # the tenant boundary at book_path scopes by email, so a Google account not in
  # MEMBERSHIP.tsv signs in and sees an EMPTY rail, not another fund's book. Close
  # it hard with a pre-sign-up trigger if the empty console itself must be private.
  #
  # ⚠ THE EMAIL IS MAPPED, and it is load-bearing: the console sends the id token
  # and the server authorizes on its `email` claim, so a Google user is granted
  # funds by the same MEMBERSHIP.tsv email as a native one.
  GoogleIdp:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "openid email profile"
      # Only the email is mapped — it is what the tenant boundary matches on, and
      # it is what the id token must carry. (Mapping email_verified is a common
      # source of first-deploy attribute errors and buys nothing here.)
      AttributeMapping:
        email: email

  # A PUBLIC client (no secret): a browser cannot keep one, which is why the
  # console uses authorization-code + PKCE. The access token is what the
  # authorizer validates — Cognito access tokens carry client_id rather than
  # aud, so the audience below IS the client id.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: ratio-console
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      # COGNITO keeps the email/password form; Google is added when configured.
      #
      # ⛔ THE Google ENTRY IS `!Ref GoogleIdp`, NOT THE LITERAL "Google", AND THE
      # DEPENDENCY THAT BUYS IS THE WHOLE POINT. A static `DependsOn: GoogleIdp`
      # is rejected at validation when HasGoogle is false ("Unresolved resource
      # dependencies [GoogleIdp]") because the provider is conditioned out. A
      # `!Ref` inside the matching `!If` branch is evaluated ONLY when HasGoogle is
      # true — so when Google is off this resolves to `[COGNITO]` with no dangling
      # reference, and when Google is on the `!Ref` both yields the provider name
      # and orders its creation before this client update. (Ref on a Cognito
      # identity provider returns its ProviderName, i.e. "Google".)
      SupportedIdentityProviders: !If
        - HasGoogle
        - [COGNITO, !Ref GoogleIdp]
        - [COGNITO]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      # ⛔ THE CALLBACK IS ON THE CONSOLE'S ORIGIN NOW, NOT THIS API'S. The old
      # console ran authorization-code + PKCE in the browser and came back to
      # /app — a page this function served. The console is a Next.js application
      # on its own host; it runs the exchange on its server and comes back to
      # /api/auth/callback there. The path is also what /authconfig.json
      # advertises as `redirectPath`, and the two must agree.
      #
      # ⛔ COGNITO ACCEPTS NO WILDCARDS, so every origin that must sign in is
      # listed. localhost is registered because Cognito permits plain http for
      # it and nowhere else, which is what makes `next dev` against the deployed
      # pool possible at all. A Vercel preview on its own generated hostname is
      # NOT here and cannot sign in — previews render from console/fixtures/,
      # which is simpler than the alternative. The alternative, if it is ever
      # needed, is a bounce through a registered origin carrying the preview's
      # host in the OAuth `state`, WITH a server-side allowlist on the way back:
      # without one that is an open redirect on a route that carries tokens.
      CallbackURLs: !If
        - HasConsole
        - - !Sub "${ConsoleOrigin}/api/auth/callback"
          - "http://localhost:3000/api/auth/callback"
        # A client must have at least one callback URL, and until the console is
        # deployed there is no real one — so this names the loopback developer
        # flow rather than a URL that 404s.
        - - "http://localhost:3000/api/auth/callback"
      LogoutURLs: !If
        - HasConsole
        - - !Sub "${ConsoleOrigin}/signin"
          - "http://localhost:3000/signin"
        - - "http://localhost:3000/signin"

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      # Globally unique across all of Cognito; the account id makes it so.
      Domain: !Sub "ratio-demo-${AWS::AccountId}"

  # The gateway proves the token is real, unexpired and ours; the server
  # (book_path) decides which funds it may open. The identity source is the
  # bearer the console sends.
  Authorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref Api
      AuthorizerType: JWT
      Name: workos-jwt
      IdentitySource: ["$request.header.Authorization"]
      JwtConfiguration:
        Audience: [!Ref WorkOsClientId]
        Issuer: "https://api.workos.com/"

  # ⛔ A SECOND ROUTE, AND THE ONE EXCEPTION TO THE ONE-ROUTE RULE ABOVE. It is a
  # COARSE prefix split, not a per-resource table: everything under /v1 requires
  # a token, everything else ($default) stays public — /app, /version, /healthz,
  # /mcp and /authconfig.json, which the unauthenticated console needs to start
  # the login. Most-specific match wins, so /v1/* hits this and the rest falls
  # through to $default.
  ProtectedRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "ANY /v1/{proxy+}"
      Target: !Sub "integrations/${Integration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer

  # ══════════════════════ THE SCALE RUNNER ══════════════════════
  #
  # A visitor presses a button and a twenty-million-lot book is folded from an
  # empty projection. It cannot happen in the function: measured, that fold is
  # 995 seconds over a ~40 GB journal in a gigabyte of memory, against a
  # 15-SECOND timeout, 512 MB of memory and 512 MB of /tmp. So it happens in a
  # one-shot Fargate task and the function only starts it and reports on it.
  #
  # ⛔ EVERYTHING BELOW COSTS NOTHING AT REST, which is the constraint the whole
  # deployment is built to — see "What it costs" in README.md. A VPC, a subnet,
  # a gateway, a route table, a security group, an ECS cluster and a task
  # definition are all free to have; only a RUNNING task is billed. That is why
  # there is no NAT gateway anywhere here: it would be ~$32/month standing,
  # against a $5 budget, to do a job a public subnet does for nothing.
  #
  # ⚠ AND THE SPEND CONTROL IS NOT IN THIS FILE. What stops a public button
  # exhausting the budget — one run in flight, a per-shape cooldown, a monthly
  # ceiling in cents — is in `crates/ratio/src/scale.rs`, where the test suite
  # can break it. A control that exists only in a CloudFormation template is a
  # control nothing can test.

  ScaleVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      # ⛔ BOTH DNS FLAGS, because a Fargate task in a public subnet resolves
      # ECR, S3 and CloudWatch by name over the internet gateway. Without
      # hostnames the task fails to pull its image and the only symptom is a
      # task that stops with no logs — it never got far enough to write any.
      EnableDnsHostnames: true
      Tags:
        - {Key: Name, Value: ratio-demo-scale}
        - {Key: project, Value: ratio}

  ScaleSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ScaleVpc
      CidrBlock: 10.0.0.0/24
      # ⚠ ONE SUBNET, ONE AZ. The task is a single one-shot run with no
      # availability requirement; spreading it over three zones would buy
      # nothing and add two more resources to reason about. If a zone is out,
      # the run is refused and retried, which is what a demo should do.
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: ratio-demo-scale}

  ScaleGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: ratio-demo-scale}

  ScaleGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref ScaleVpc
      InternetGatewayId: !Ref ScaleGateway

  ScaleRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ScaleVpc
      Tags:
        - {Key: Name, Value: ratio-demo-scale}

  ScaleDefaultRoute:
    Type: AWS::EC2::Route
    # ⛔ The route cannot be created before the gateway is attached, and
    # CloudFormation does not infer that from !Ref alone.
    DependsOn: ScaleGatewayAttachment
    Properties:
      RouteTableId: !Ref ScaleRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref ScaleGateway

  ScaleSubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ScaleSubnet
      RouteTableId: !Ref ScaleRouteTable

  # ⛔ EGRESS ONLY, AND NO INGRESS RULE AT ALL. The task pulls an image, reads
  # and writes one S3 prefix and writes logs. Nothing connects TO it — it has no
  # port, serves nothing, and an inbound rule would be an opening with no
  # purpose. A security group with no ingress rules admits nothing.
  ScaleSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "The scale runner: outbound to ECR, S3 and logs, nothing inbound"
      VpcId: !Ref ScaleVpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: ECR, S3 and CloudWatch over TLS
      Tags:
        - {Key: Name, Value: ratio-demo-scale}

  ScaleCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: ratio-demo-scale
      Tags:
        - {Key: project, Value: ratio}
        - {Key: purpose, Value: demo}

  ScaleLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/ecs/ratio-demo-scale
      # Same seven days as the function's. Lambda's default is never-expire,
      # which is the quietest recurring cost in AWS; ECS has the same trap.
      RetentionInDays: 7

  # Where the run's progress, its figures and the lock live.
  #
  # ⛔ NOT PUBLIC. The console reads this through the function, which already
  # serves the screens; a public bucket would be a second, unversioned way to
  # reach the same figures with no build stamp on them.
  ScaleBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ratio-demo-scale-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # ⚠ THE GENERATED BOOK IS KEPT, THE RUN RECORDS ARE NOT. A run's
          # progress and figures are superseded by the next run; the book is
          # what makes the next run possible without twenty minutes of
          # generation, so it is not on a timer.
          # ⛔ ONLY THE EPHEMERAL RECORDS EXPIRE. `runs/` also holds
          # `report-{id}.json` now — the PERMALINK a lead's follow-up email
          # opens — and the first version of this rule expired the whole
          # prefix, which would have 404ed every emailed link on day 31.
          # Progress documents are superseded by the next run and the awaits
          # are drained at completion; those may age out. A permalink may not.
          - Id: expire-progress-records
            Status: Enabled
            Prefix: runs/progress-
            ExpirationInDays: 30
          - Id: expire-stale-awaits
            Status: Enabled
            Prefix: runs/await-
            ExpirationInDays: 30
          - Id: drop-unfinished-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - {Key: project, Value: ratio}
        - {Key: purpose, Value: demo}

  # ── The two roles a task assumes ────────────────────────────────────────
  #
  # ⛔ THEY ARE DIFFERENT ROLES BECAUSE THEY ACT AT DIFFERENT TIMES. The
  # EXECUTION role is used by the ECS agent before the container starts, to pull
  # the image and open the log stream. The TASK role is used by the process
  # inside it. Collapsing them would give the running container permission to
  # pull and rewrite images, which is not a thing a benchmark needs.
  #
  # ⚠ Named, because `bootstrap.yaml` scopes CI's iam:CreateRole to these two
  # exact ARNs, and an unnamed role gets an ARN no policy can name in advance.
  # That is what CAPABILITY_NAMED_IAM in deploy.yml is for.
  ScaleTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ratio-demo-scale-exec
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ScaleTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ratio-demo-scale-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-the-book-write-the-figures
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ⛔ THE BOOK IS BUILT ONCE AND KEPT, WHICH IS A MEASURED
              # DECISION. Generating a fund costs MORE than the cold build it
              # feeds — 28.6 s against 24.0 s at 500x500, 115.8 s against 94.7 s
              # at 500x2000, a ratio of 1.2 at both. At twenty million lots that
              # is ~20 minutes of generation before a ~16 minute fold, so a task
              # that regenerated per run would spend most of its life building
              # something byte-identical to what it built last time.
              - Sid: TheGeneratedBooks
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::ratio-demo-scale-${AWS::AccountId}/books/*"
              - Sid: TheRunsOwnRecord
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::ratio-demo-scale-${AWS::AccountId}/runs/*"
              - Sid: ListWhatItMayRead
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::ratio-demo-scale-${AWS::AccountId}"
              # The follow-up report, sent when the fold this task ran lands.
              # ⛔ ONE identity and one configuration-set-free SendEmail — not
              # ses:* — because this role belongs to a container that executes
              # a public button's work. The cap in `send_awaited` bounds volume;
              # this bounds what a compromised task could send AS.
              - Sid: SendTheReportEmail
                Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: "*"
                Condition:
                  StringLike:
                    ses:FromAddress: !Ref ScaleSender

  # ⛔ ONE FAMILY, TWO JOBS, CHOSEN BY THE COMMAND AT RunTask. `build` generates
  # a book and uploads it; `fold` downloads one and measures the cold build.
  # Two task definitions would be two places for the image, the roles and the
  # sizing to drift, and the failure would be a benchmark measuring a container
  # built from a different commit than the one that generated its book.
  ScaleTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: ratio-demo-scale
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      # 4 vCPU / 8 GB. The measured peak footprint of the full fold is 1.00 GB,
      # so the memory is headroom; the vCPUs are for `parse`, which is 66% of
      # the cold build.
      Cpu: "4096"
      Memory: "8192"
      EphemeralStorage:
        # ⛔ THE JOURNAL IS ~40 GB AT THE FULL SHAPE — 140,030,274 lines at ~291
        # bytes. The 20 GiB a task gets by default does not hold a fifth of it,
        # and the failure is ENOSPC halfway through a twenty-minute generation.
        SizeInGiB: 100
      ExecutionRoleArn: !GetAtt ScaleTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ScaleTaskRole.Arn
      ContainerDefinitions:
        - Name: ratio
          # The same digest the function runs, so a run measures the build it
          # was started from. ⚠ ECR keeps only the last 3 tagged images, so a
          # task definition pinning an older digest breaks on the fourth deploy
          # — this tracks the parameter and cannot go stale.
          Image: !Ref ImageUri
          # ⛔ OVERRIDES entrypoint.sh's DEFAULT, NOT ITS ARGUMENT HANDLING. The
          # script execs `ratio "$@"` when given arguments and serves when not;
          # this passes the arguments. Before that branch existed the container
          # ran the WEB SERVER when asked for a benchmark, and the symptom was a
          # task that never produced output and never exited.
          Command: ["help"]
          Environment:
            - Name: RATIO_SCALE_BUCKET
              Value: !Sub "ratio-demo-scale-${AWS::AccountId}"
            - Name: RATIO_SCALE_SENDER
              Value: !Ref ScaleSender
            - Name: RATIO_PUBLIC_ORIGIN
              Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
            - Name: RATIO_BUILD
              Value: !Ref BuildSha
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ScaleLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: run

Outputs:
  DemoUrl:
    Description: >
      The API and the three public screens. `/` and `/app` redirect to the
      console; the break report is at /breaks and the rules at /rules.
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/"
  ConsoleUrl:
    Description: >
      The operations console, deployed separately to Vercel. Empty until
      ConsoleOrigin is set, which is also when `/` starts redirecting.
    Value: !Ref ConsoleOrigin
  McpEndpoint:
    Description: POST JSON-RPC here. Same tools as `ratio mcp`, same fence.
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/mcp"
  UserPoolId:
    Description: The Cognito pool. Create the demo user here (see deploy/README.md).
    Value: !Ref UserPool
  UserPoolClientId:
    Description: The public app client the console signs in with.
    Value: !Ref UserPoolClient
  HostedUiDomain:
    Description: The Cognito Hosted UI domain the console signs in against.
    Value: !Sub "ratio-demo-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
