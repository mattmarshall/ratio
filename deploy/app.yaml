AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Ratio demo — the function itself. Deployed by CI on every push to main,
  parameterised only by the image it should run.

Parameters:
  ImageUri:
    Type: String
    Description: The image CI just pushed, by digest.
  ExecutionRoleArn:
    Type: String
    Description: From the bootstrap stack.
  BuildSha:
    Type: String
    Default: dev
    Description: >
      The commit this deployment serves, reported at /version. The smoke test
      polls it to tell the new deployment from a warm container still running
      the previous image — "the URL returns 200" never meant "the URL runs what
      was just built".
  DemoMember:
    Type: String
    Default: demo@ratio.fastverk.dev
    Description: >
      Who every seeded fund is granted to in MEMBERSHIP.tsv, comma-separated. The
      tenant boundary matches a caller's verified email (or sub) against this, so
      each value MUST equal an email a member actually signs in as — the invited
      Cognito user, and any Google account (whose email arrives from Google). A
      mismatch signs the user in successfully and then shows an empty fund rail.
      Set the list via the DEMO_MEMBERS repository variable; entrypoint.sh writes
      the grant on each start. See deploy/README.md.
  GoogleClientId:
    Type: String
    Default: ""
    Description: >
      OAuth client id of the Google app that backs "Continue with Google". Empty
      disables Google sign-in entirely (the pool keeps email/password), so this
      template deploys the same with or without it — set the id and secret as
      repository secrets and the next deploy lights Google up. Passed from CI, not
      committed.
  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      OAuth client secret paired with GoogleClientId. NoEcho so it is masked in
      stack events and not returned by describe-stacks. Passed from a repository
      secret; never committed.
  ReservedConcurrency:
    Type: Number
    Default: 0
    Description: >
      Simultaneous invocations to reserve for this function; 0 leaves it unset.

      Unset is correct here and is not a missing guardrail. A new AWS account
      gets a total concurrency limit of 10, and AWS refuses any reservation
      that would leave fewer than 10 unreserved — so on this account a
      reservation cannot be created at all, and the account limit *is* the cap.
      It is also the better cap: a template edit cannot widen it, and it bounds
      every function in the account rather than this one.

      Set this only after raising the account quota, and only if something else
      in the account then needs protecting from the demo.

Conditions:
  ReserveConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]
  # Google sign-in is added only when an id has been supplied. The client's
  # provider list and the identity provider itself are both gated on this, so a
  # deploy with no Google secrets set is a valid, working demo (email/password
  # only) rather than a broken one.
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, ""]]

Resources:
  # Created explicitly rather than left to Lambda, which creates log groups
  # with retention set to "never expire" — the quietest recurring cost in AWS.
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/ratio-demo
      RetentionInDays: 7

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: ratio-demo
      Description: The three screens and the MCP endpoint, behind a Function URL.
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !Ref ExecutionRoleArn
      # 512MB is not about memory — the demo needs a fraction of it — but about
      # CPU, which Lambda allocates in proportion. It is the cheapest point at
      # which a cold start stays under half a second.
      MemorySize: 512
      # Every request is a table render or one JSON-RPC call. Anything taking
      # longer than this is stuck, and should fail rather than bill.
      Timeout: 15
      ReservedConcurrentExecutions: !If
        - ReserveConcurrency
        - !Ref ReservedConcurrency
        - !Ref "AWS::NoValue"
      Environment:
        Variables:
          RATIO_BOOK: /tmp/book
          RATIO_FUNDS: /tmp/funds
          # The journal is the part that does not heal on a cold start, so the
          # one write path has a ceiling even now that a caller must be signed
          # in to reach it.
          RATIO_MAX_API_ENTRIES: "250"
          RATIO_BUILD: !Ref BuildSha
          AWS_LWA_PORT: "8080"
          AWS_LWA_READINESS_CHECK_PATH: /healthz
          # ⛔ AUTH ACTIVATION. With RATIO_AUTH=required the server fails closed
          # on any /v1 request the JWT authorizer did not verify, and tenancy at
          # book_path then scopes each caller to the funds MEMBERSHIP grants
          # them. The COGNITO_* values are the public client configuration the
          # console serves at /authconfig.json to start the sign-in; the domain
          # is also what the CSP admits to connect-src for the token exchange.
          RATIO_AUTH: required
          RATIO_COGNITO_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
          RATIO_COGNITO_CLIENT_ID: !Ref UserPoolClient
          RATIO_COGNITO_DOMAIN: !Sub "ratio-demo-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
          # Whom the seeded funds are granted to. entrypoint.sh writes
          # MEMBERSHIP.tsv from this; it must equal the demo user's email.
          RATIO_DEMO_MEMBER: !Ref DemoMember
      Tags:
        - Key: project
          Value: ratio
        - Key: purpose
          Value: demo

  # How the demo is reached.
  #
  # This was a public Lambda Function URL, then CloudFront-in-front-of-one.
  # Neither works in this account: anonymous Function URLs are refused, and so
  # is CloudFront's OAC-signed request. Both were verified rather than
  # assumed — a SigV4 request signed with account credentials returns 200, a
  # throwaway control function is refused identically, and no SCP or RCP is
  # involved. Something above the account blocks Function URL access by
  # principals outside it, and no template can turn that off.
  #
  # An HTTP API reaches the same function and works. It is also cheap in the
  # same way a Function URL is: $1.00 per million requests and nothing at rest,
  # so a demo used a few times a week rounds to zero. The one thing given up is
  # response streaming, which nothing here uses.
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: ratio-demo
      ProtocolType: HTTP
      Description: The three screens and the MCP endpoint.
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type, mcp-session-id, mcp-protocol-version]
        MaxAge: 3600

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      # 2.0 is what the Lambda Web Adapter expects; on 1.0 it sees a different
      # event shape and every request 500s.
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 15000

  # One catch-all route. The application does its own routing — adding routes
  # here would mean two route tables that have to agree, and they would not.
  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: $default
      Target: !Sub "integrations/${Integration}"

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      # ⛔ THE COST CONTROL THAT MATTERS. Every other route is cheap; /chat.json
      # calls a paid model, and the endpoint is public. This bounds how fast
      # anyone can spend — a demo needs a handful of requests a minute and this
      # allows an order of magnitude more, while making a scripted abuser hit a
      # wall rather than a bill.
      #
      # The account's $5 budget in cloud-org is the alarm; this is the brake.
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20
      # $default serves at the API root, so URLs carry no stage prefix and the
      # links printed in the demo are the links people use.
      StageName: $default
      AutoDeploy: true

  ApiInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt Function.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"

  # ── Identity ──────────────────────────────────────────────────────────────
  #
  # Cognito Hosted UI on the DEFAULT (cognito-prefix) domain — NOT a custom
  # Hosted-UI domain, which provisions a CloudFront distribution this account
  # refuses (see the Api comment). Invite-only: a demo has a known set of
  # people, and public sign-up on an internet-facing pool is an abuse surface
  # with no upside here.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ratio-demo
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  # "Continue with Google", added only when a client id is supplied. Google is a
  # native Cognito social provider, so no shim is needed; the Hosted UI renders
  # the button automatically once this exists and the app client lists it.
  #
  # ⚠ FEDERATION AUTO-PROVISIONS. AdminCreateUserOnly above blocks the Hosted
  # UI's sign-up form, but a first Google sign-in still creates a pool user —
  # federation does not consult that setting. That is not an open door to data:
  # the tenant boundary at book_path scopes by email, so a Google account not in
  # MEMBERSHIP.tsv signs in and sees an EMPTY rail, not another fund's book. Close
  # it hard with a pre-sign-up trigger if the empty console itself must be private.
  #
  # ⚠ THE EMAIL IS MAPPED, and it is load-bearing: the console sends the id token
  # and the server authorizes on its `email` claim, so a Google user is granted
  # funds by the same MEMBERSHIP.tsv email as a native one.
  GoogleIdp:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "openid email profile"
      # Only the email is mapped — it is what the tenant boundary matches on, and
      # it is what the id token must carry. (Mapping email_verified is a common
      # source of first-deploy attribute errors and buys nothing here.)
      AttributeMapping:
        email: email

  # A PUBLIC client (no secret): a browser cannot keep one, which is why the
  # console uses authorization-code + PKCE. The access token is what the
  # authorizer validates — Cognito access tokens carry client_id rather than
  # aud, so the audience below IS the client id.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: ratio-console
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      # COGNITO keeps the email/password form; Google is added when configured.
      #
      # ⛔ THE Google ENTRY IS `!Ref GoogleIdp`, NOT THE LITERAL "Google", AND THE
      # DEPENDENCY THAT BUYS IS THE WHOLE POINT. A static `DependsOn: GoogleIdp`
      # is rejected at validation when HasGoogle is false ("Unresolved resource
      # dependencies [GoogleIdp]") because the provider is conditioned out. A
      # `!Ref` inside the matching `!If` branch is evaluated ONLY when HasGoogle is
      # true — so when Google is off this resolves to `[COGNITO]` with no dangling
      # reference, and when Google is on the `!Ref` both yields the provider name
      # and orders its creation before this client update. (Ref on a Cognito
      # identity provider returns its ProviderName, i.e. "Google".)
      SupportedIdentityProviders: !If
        - HasGoogle
        - [COGNITO, !Ref GoogleIdp]
        - [COGNITO]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      CallbackURLs:
        - !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/app"
      LogoutURLs:
        - !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/app"

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      # Globally unique across all of Cognito; the account id makes it so.
      Domain: !Sub "ratio-demo-${AWS::AccountId}"

  # The gateway proves the token is real, unexpired and ours; the server
  # (book_path) decides which funds it may open. The identity source is the
  # bearer the console sends.
  Authorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref Api
      AuthorizerType: JWT
      Name: cognito-jwt
      IdentitySource: ["$request.header.Authorization"]
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  # ⛔ A SECOND ROUTE, AND THE ONE EXCEPTION TO THE ONE-ROUTE RULE ABOVE. It is a
  # COARSE prefix split, not a per-resource table: everything under /v1 requires
  # a token, everything else ($default) stays public — /app, /version, /healthz,
  # /mcp and /authconfig.json, which the unauthenticated console needs to start
  # the login. Most-specific match wins, so /v1/* hits this and the rest falls
  # through to $default.
  ProtectedRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "ANY /v1/{proxy+}"
      Target: !Sub "integrations/${Integration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer

Outputs:
  DemoUrl:
    Description: The demo. Screens at /, break report at /breaks, rules at /rules.
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/"
  McpEndpoint:
    Description: POST JSON-RPC here. Same tools as `ratio mcp`, same fence.
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/mcp"
  UserPoolId:
    Description: The Cognito pool. Create the demo user here (see deploy/README.md).
    Value: !Ref UserPool
  UserPoolClientId:
    Description: The public app client the console signs in with.
    Value: !Ref UserPoolClient
  HostedUiDomain:
    Description: The Cognito Hosted UI domain the console signs in against.
    Value: !Sub "ratio-demo-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
