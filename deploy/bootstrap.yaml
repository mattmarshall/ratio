AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Ratio demo — one-time account setup: the registry the image lands in, the
  role GitHub Actions assumes to push it, and the cost guardrails. Deployed
  once by hand; everything after it is deployed by CI.

# Split from app.yaml on purpose. A Lambda whose PackageType is Image cannot be
# created before an image exists, so the registry has to be a separate stack
# that CI can push to before the app stack is ever deployed.

Parameters:
  GitHubRepo:
    Type: String
    Default: mattmarshall/ratio
    Description: owner/repo allowed to assume the deploy role.

Resources:
  # ── What ECS itself needs, once per account ─────────────────────────────
  #
  # ⛔ WITHOUT THIS, EVERY RunTask IN THE ACCOUNT IS REFUSED, AND NOTHING IN
  # ANY TEMPLATE SAYS SO. ECS manages the network interfaces of awsvpc tasks
  # through its service-linked role, which AWS creates automatically the first
  # time a cluster is made — IF the principal making it may
  # iam:CreateServiceLinkedRole. The scale cluster was created by CloudFormation
  # under the deploy role above, which deliberately may not. So the cluster
  # existed, the IAM simulator said RunTask was allowed, PassRole was allowed —
  # and the first button press on the deployed demo failed anyway, because the
  # role ECS ITSELF assumes was never born.
  #
  # ⚠ ACCOUNT-SINGLETON. This is the one place it can live: bootstrap is the
  # stack for things that exist once per account and are applied by a human
  # with admin. It costs nothing and AWS manages its policy.
  EcsServiceLinkedRole:
    Type: AWS::IAM::ServiceLinkedRole
    Properties:
      AWSServiceName: ecs.amazonaws.com

  # ── The registry ────────────────────────────────────────────────────────
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: ratio-demo
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      # A container-image Lambda is pulled by the Lambda service, not by the
      # execution role, so an identity policy cannot grant this — the registry
      # has to allow it. Without this the function fails to create with
      # "Lambda does not have permission to access the ECR image", which reads
      # like a broken image rather than a missing repository policy.
      #
      # Scoped by sourceArn to this one function: the default snippet AWS
      # publishes uses `function:*` and lets any Lambda in the account pull.
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaPullsTheDemoImage
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringEquals:
                aws:SourceArn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:ratio-demo"
      # Storage is billed per GB-month. Three images is enough to roll back to
      # while keeping the bill in the noise.
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after a day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": {"type": "expire"}
              },
              {
                "rulePriority": 2,
                "description": "Keep only the last 3 tagged images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 3
                },
                "action": {"type": "expire"}
              }
            ]
          }

  # ── How GitHub Actions gets in ──────────────────────────────────────────
  # OIDC rather than a long-lived access key. There is no secret to leak, no
  # rotation to forget, and the trust policy below is what actually constrains
  # who can assume this — not the absence of a published key.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS verifies GitHub's certificate chain against its own trust store for
      # this provider, so the thumbprint is vestigial — kept because the
      # resource still requires the field.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ratio-demo-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Scoped to this repo's main branch. `repo:owner/name:*` would
              # let a pull request from a fork deploy to production, which is
              # the classic way this pattern is got wrong.
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/main"
      Policies:
        - PolicyName: push-image-and-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PushToTheDemoRepositoryOnly
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                Resource: !GetAtt Repository.Arn
              - Sid: AuthToTheRegistry
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"   # this action does not accept a resource
              - Sid: DeployTheAppStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplateSummary
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListStackResources
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ratio-demo-app/*"
              - Sid: ManageTheDemoFunction
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  # Rollback deletes what a failed create left behind. Without
                  # these the first failure wedges the stack in ROLLBACK_FAILED
                  # and needs a human with admin to clear it by hand.
                  - lambda:DeleteFunction
                  - lambda:DeleteFunctionUrlConfig
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionUrlConfig
                  - lambda:CreateFunctionUrlConfig
                  - lambda:UpdateFunctionUrlConfig
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                  - lambda:TagResource
                  - lambda:ListTags
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:ratio-demo"
              - Sid: TheHttpApiInFrontOfIt
                Effect: Allow
                Action:
                  - apigateway:POST
                  - apigateway:GET
                  - apigateway:PATCH
                  - apigateway:PUT
                  - apigateway:DELETE
                  - apigateway:TagResource
                Resource: !Sub "arn:aws:apigateway:${AWS::Region}::/apis*"
              - Sid: TearDownTheUnusedUserPool
                Effect: Allow
                # ⛔ DELETE ONLY. The app stack no longer creates a Cognito
                # UserPool / Client / Domain / IdentityProvider — AuthKit is
                # the sole IdP. These verbs stay so the next stack update can
                # delete the unused live pool. Cognito management actions do
                # not support resource-level permissions, so this is scoped
                # by action. Do not add Create* / Update* back.
                Action:
                  - cognito-idp:DeleteUserPool
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:DeleteUserPoolClient
                  - cognito-idp:DescribeUserPoolClient
                  - cognito-idp:DeleteUserPoolDomain
                  - cognito-idp:DescribeUserPoolDomain
                  - cognito-idp:DeleteIdentityProvider
                  - cognito-idp:DescribeIdentityProvider
                  - cognito-idp:ListIdentityProviders
                  - cognito-idp:TagResource
                  - cognito-idp:UntagResource
                Resource: "*"
              - Sid: TheFunctionsOwnLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                  - logs:ListTagsLogGroup
                  # Issue #125: smoke used to fail with only the APIGW 500
                  # wrapper. These three let the deploy role dump INIT/panic
                  # from the function's own group. Applied by a human with
                  # the bootstrap stack — until then the smoke dump is `|| true`.
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/ratio-demo*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/ratio-demo*:*"
              - Sid: PassOnlyTheExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: ReadTheExecutionRoleForStackDrift
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:ListRoleTags
                Resource: !GetAtt ExecutionRole.Arn

              # ── The scale runner ───────────────────────────────────────────
              #
              # A twenty-million-lot cold build takes ~16 minutes, a gigabyte and
              # a ~40 GB journal. The function it would run in has a 15-SECOND
              # timeout, 512 MB of memory and 512 MB of /tmp, so the fold happens
              # in a one-shot Fargate task and the function only starts it.
              #
              # ⛔ NONE OF THIS EXISTED, AND CI COULD CREATE NONE OF IT. The
              # statements below are what `app.yaml` needs to stand up the task:
              # a VPC to put it in, a cluster to run it on, a bucket for the
              # figures, and the two roles the task assumes. Without them the
              # deploy fails with AccessDenied and the template is unusable.
              #
              # ⚠ EVERY ONE IS SCOPED. `ecs:*` on `*` would let a compromised CI
              # run any task definition in the account; these name the cluster
              # and the family. The `ec2:` block is the exception and cannot be
              # narrowed — VPC resources have no ARN until they exist, so
              # CreateVpc is inherently unscopable. It is bounded instead by the
              # CloudFormation statement above, which admits one stack.
              - Sid: TheScaleClusterAndItsTasks
                Effect: Allow
                Action:
                  - ecs:CreateCluster
                  - ecs:DeleteCluster
                  - ecs:DescribeClusters
                  - ecs:PutClusterCapacityProviders
                  - ecs:TagResource
                  - ecs:UntagResource
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:ListTaskDefinitions
                  - ecs:ListTagsForResource
                  - ecs:UpdateCluster
                Resource: "*"

              # ⛔ THE NETWORK IS CREATED, NOT BORROWED. Fargate requires awsvpc
              # networking and this account has no VPC at all — not even a
              # default one — so the stack brings its own: one VPC, one PUBLIC
              # subnet, an internet gateway and a route. ⚠ Public deliberately:
              # a private subnet would need a NAT gateway, which is ~$32/month
              # standing against a $5 budget, to reach ECR and S3.
              - Sid: TheNetworkTheTaskRunsIn
                Effect: Allow
                Action:
                  # ⛔ THE MUTATING ACTIONS ARE ENUMERATED. These are the ones
                  # worth being exact about: each creates or destroys something
                  # that costs money or carries traffic.
                  - ec2:CreateVpc
                  - ec2:DeleteVpc
                  - ec2:ModifyVpcAttribute
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                  - ec2:ModifySubnetAttribute
                  - ec2:CreateInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  # ⛔ AND THE READS ARE A WILDCARD, DELIBERATELY, BECAUSE
                  # ENUMERATING THEM IS WHAT FAILED. The first version listed
                  # five `Describe` calls — the ones matching resources this
                  # template creates — and the deploy died on a sixth:
                  #
                  #   ScaleSubnet CREATE_FAILED  AccessDenied. User doesn't have
                  #   permission to call ec2:DescribeAvailabilityZones
                  #
                  # `!GetAZs ""` needs it, and nothing about the subnet's own
                  # resource type says so. CloudFormation also reads back
                  # `DescribeVpcAttribute` after setting the DNS flags, and
                  # `DescribeSecurityGroupRules` after an egress rule — none of
                  # which is discoverable from the template.
                  #
                  # ⚠ THIS IS NOT A WIDENING. Every `ec2:Describe*` is read-only
                  # and takes no resource ARN, so enumerating them buys no
                  # narrowing whatsoever — the `Resource: "*"` below was already
                  # forced by that. What enumeration bought was a deploy that
                  # failed after a Bazel build, a test suite, a docker build and
                  # an ECR push, once per missing verb.
                  - ec2:Describe*
                Resource: "*"

              # Where the run's progress and its figures are kept. One bucket,
              # named after the account so the name is available.
              - Sid: TheBucketTheFiguresLandIn
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutLifecycleConfiguration
                  - s3:PutBucketTagging
                  - s3:PutEncryptionConfiguration
                  - s3:ListBucket
                  # ⛔ SAME REASON AS ec2:Describe*. CloudFormation's S3 handler
                  # populates its resource model by reading EVERY bucket
                  # sub-resource on create — acl, cors, website, logging,
                  # versioning, notification, replication, object-lock,
                  # ownership-controls, accelerate, request-payment — whether or
                  # not the template mentions them. Listing the ones this
                  # template sets is exactly the mistake that failed on
                  # `ec2:DescribeAvailabilityZones`, and every one of these is
                  # read-only on a single named bucket.
                  - s3:Get*
                Resource: !Sub "arn:aws:s3:::ratio-demo-scale-${AWS::AccountId}"

              # The task's own log group, kept separate from the function's so
              # the retention on each is set for what it holds.
              - Sid: TheScaleTasksLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                  - logs:ListTagsLogGroup
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/ecs/ratio-demo-scale*"

              # ⛔ THE TWO TASK ROLES, BY NAME. `app.yaml` creates them, so CI
              # needs iam:CreateRole — which is the widest thing in this policy
              # and is therefore pinned to two exact ARNs. Naming the roles
              # explicitly is what makes that possible; unnamed roles get
              # generated ARNs that no policy can name in advance.
              #
              # ⚠ This is why the deploy passes CAPABILITY_NAMED_IAM.
              - Sid: TheTaskRolesAndNothingElse
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListRoleTags
                  - iam:TagRole
                  - iam:UntagRole
                  # ⚠ Needed when a role's trust policy or description changes
                  # rather than when it is first created — so a template edit
                  # that CI could apply today would fail on the day somebody
                  # narrows a trust policy.
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/ratio-demo-scale-task"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/ratio-demo-scale-exec"

              - Sid: PassTheTaskRolesToEcsOnly
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/ratio-demo-scale-task"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/ratio-demo-scale-exec"
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  # ── What the function itself may do ─────────────────────────────────────
  # The demo used to read a book baked into its image and write only to /tmp.
  # It now also invokes Bedrock, starts a scale task, and appends the journal
  # to one prefix of the scale bucket. Each of those is a Sid below, scoped
  # to the thing it names. It is given no permission it does not use.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ratio-demo-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: invoke-the-demo-model
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The chat screen runs a model against the MCP tools. It uses the
              # execution role's own credentials, so there is no API key in the
              # image, in an environment variable, or on the wire for a visitor
              # to extract.
              #
              # Scoped to the two inference profiles the demo can select and the
              # foundation models behind them — not `bedrock:*` on `*`. A public
              # endpoint with an unscoped model permission is a bill waiting to
              # be discovered.
              - Sid: InvokeTheDemoModels
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
                  - arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0
        - PolicyName: start-and-read-a-scale-run
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The scale screen's button. ⛔ ONE TASK DEFINITION FAMILY AND ONE
              # CLUSTER — not `ecs:RunTask` on `*`, which on a PUBLIC endpoint
              # would let anyone who found a way to influence the call run any
              # container in the account.
              #
              # ⚠ The wildcard on the family is the task definition's REVISION,
              # which changes on every deploy. `…:task-definition/ratio-demo-
              # scale:*` names every revision of one family and nothing else.
              - Sid: StartOneKindOfTask
                Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/ratio-demo-scale:*"
                Condition:
                  ArnEquals:
                    ecs:cluster: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/ratio-demo-scale"

              # To report "a fold is already running" and how far along it is.
              - Sid: SeeWhatIsRunning
                Effect: Allow
                Action:
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                Resource: "*"
                Condition:
                  ArnEquals:
                    ecs:cluster: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/ratio-demo-scale"

              # ⛔ RunTask HANDS THE TASK ITS ROLES, so the caller needs
              # PassRole for them — scoped to the two, and to ECS only.
              - Sid: HandTheTaskItsRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/ratio-demo-scale-task"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/ratio-demo-scale-exec"
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

              # The lock, the spend counter and the published figures.
              #
              # ⛔ THE LOCK IS A CONDITIONAL PUT, which is an ordinary
              # `s3:PutObject` with an `If-None-Match` header — no extra
              # permission, and no read-then-write that could admit two runs.
              - Sid: TheRunRecord
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::ratio-demo-scale-${AWS::AccountId}/runs/*"
              - Sid: ListOnlyTheRunPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::ratio-demo-scale-${AWS::AccountId}"
                Condition:
                  StringLike:
                    s3:prefix: "runs/*"

              # Issue #24: the journal on the same bucket, a different prefix.
              # ⛔ NO DeleteObject. The log is append-only; a delete would be a
              # truncation wearing an IAM grant. PutObject here is the
              # conditional PUT (`If-None-Match:*`) — no extra permission, and
              # no read-then-write that could admit two writers to one slot.
              #
              # ⚠ CORRECT AND NOT SUFFICIENT. Bootstrap is applied by hand.
              # #84 added these Sids; the live role never received them; after
              # #126 bound before hydrate, /balance.json died on PutObject
              # AccessDenied (#129). The matching grant CI applies is the
              # ScaleBucket journal policy in app.yaml.
              - Sid: TheJournal
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::ratio-demo-scale-${AWS::AccountId}/journals/*"
              - Sid: ListOnlyTheJournalPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::ratio-demo-scale-${AWS::AccountId}"
                Condition:
                  StringLike:
                    s3:prefix: "journals/*"
              # A lead who arrives during a cooldown is emailed the LATEST run's
              # report immediately — no task exists to send it later, so the
              # function sends it. ⛔ Scoped exactly as the task role's grant is:
              # one SendEmail, and only AS an address under the demo's own
              # domain. A public endpoint with an unscoped mail permission is a
              # phishing kit with a budget.
              - Sid: SendTheReplayReportEmail
                Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: "*"
                Condition:
                  StringLike:
                    ses:FromAddress: "*@ratio.msoftware.co"

  # ⛔ NO BUDGET HERE. mattmarshall/cloud-org owns budgets for every account in
  # the organization, at the payer, filtered by LinkedAccount — including this
  # one (`msoftware-ratio`, $5, a tripwire rather than a cost control). A
  # second budget in this account would be a duplicate of a thing that already
  # exists a level up, and the two would drift.
  #
  # What bounds cost here instead: the account's own Lambda concurrency limit
  # of 10, which no template can widen, and log retention set explicitly in
  # app.yaml because Lambda's default is never-expire.

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  DeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE repository variable in GitHub.
    Value: !GetAtt DeployRole.Arn
  ExecutionRoleArn:
    Description: Passed to the app stack.
    Value: !GetAtt ExecutionRole.Arn
