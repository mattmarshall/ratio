[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ratio-sdk"
version = "0.0.0"
description = "Python SDK for the Ratio accounting kernel: a machine-checked ledger you post to over REST or gRPC."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = []

[project.optional-dependencies]
# The gRPC transport. REST needs nothing but the standard library.
grpc = ["grpcio>=1.60"]

[tool.setuptools.packages.find]
include = ["ratio*"]
