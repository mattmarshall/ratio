\* A projection per view, each advanced when its own view is asked. Both folds
\* are correct and both books tie; the reconciliation between them is partly a
\* settlement convention and partly one view being behind, in one number, with
\* nothing saying which part is which.
\* AReconciliationComparesOnePrefix MUST go red.
SPECIFICATION Spec
CONSTANTS
    Views = {abor, ibor}
    MaxJournal = 3
    MaxStrikes = 2
    MaxCalendars = 2
    OneStreamingPass = FALSE
    CalendarInConfig = TRUE
INVARIANTS
    TypeOK
    AReconciliationComparesOnePrefix
