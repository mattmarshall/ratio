\* No condition on the PUT: two writers that both reserved the same slot both
\* write it, and the second overwrites the first. The losing entry was acked
\* and is gone — the journal is one object shorter than the writes in it.
\* NoWriteIsLost MUST go red.
SPECIFICATION Spec
CONSTANTS
    Writers = {a, b}
    MaxSeq  = 2
    Empty   = none
    ConditionalPut = FALSE
INVARIANTS
    TypeOK
    NoWriteIsLost
