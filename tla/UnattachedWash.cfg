\* The first half of the rule, alone. The loss is disallowed and no lot's
\* basis moves, so a thousand of loss the investor genuinely suffered is
\* never recognized — not deferred, gone. Cost is conserved the entire time.
\* ADisallowedLossIsOnTheReplacement MUST go red.
