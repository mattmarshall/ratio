\* A sale posted under one rule set, relieved under whichever is active when
\* the engine gets to it. The lots left are right, the proceeds are right, and
\* the realized gain is somebody else's.
\* ReliefUsesTheMethodItPinned MUST go red.
SPECIFICATION Spec
CONSTANTS
    Sales = {s1, s2}
    MaxSplits = 2
    MaxConfigs = 1
    PinTheFactor   = TRUE
    RefuseOnChange = TRUE
    PinTheMethod   = FALSE
INVARIANTS
    TypeOK
    ReliefUsesTheMethodItPinned
