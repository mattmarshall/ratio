\* Average cost treated as a Method: sort the holding once, walk, never
\* pool. FIFO picks basis 10; the pool is 30.
\* TheBasisTakenIsThePooledBasis MUST go red.
\*
\* ⛔ DO NOT LIST ThePooledBasisIsNotAnOrdering HERE. That invariant is
\* about AverageCostPick and the lot bases, which do not read
\* TreatAsOrder, so it holds on this dial too. A probe that named only
\* that one would stay green — the vacuous pass this file exists to
\* prevent. It belongs on MCAverageCostEngine.cfg, which is the engine
\* that actually pools.
SPECIFICATION Spec
CONSTANTS
    TreatAsOrder = TRUE
INVARIANTS
    TypeOK
    TheBasisTakenIsThePooledBasis
