\* The door as designed: a dated entry on or before a closed-through day
\* is refused; a close only moves forward; the journal is free to grow
\* after the boundary with later dates.
SPECIFICATION Spec
CONSTANTS
    Views = {v1}
    Days = {1, 2}
    MaxPos = 2
    RefuseOnClosedPeriod = TRUE
INVARIANTS
    TypeOK
    AClosedPeriodRefusesABackdatedPost
    ACloseOnlyMovesForward
