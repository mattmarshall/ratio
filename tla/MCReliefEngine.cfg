\* The engine as designed: a relief that finds the factor moved under it is
\* sent back to be recomputed rather than written, and it is relieved under the
\* method the sale's own journal entry pinned.
SPECIFICATION Spec
CONSTANTS
    Sales = {s1, s2}
    MaxSplits = 2
    MaxConfigs = 1
    PinTheFactor   = TRUE
    RefuseOnChange = TRUE
    PinTheMethod   = TRUE
PROPERTIES
    EverySaleIsEventuallyWritten
INVARIANTS
    TypeOK
    ReliefIsWrittenAgainstWhatItRead
    WrittenMeansConverted
    ReliefUsesTheMethodItPinned
