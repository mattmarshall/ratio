\* The read path as it must be built: the projector advances every table for
\* one journal entry in one transaction, and a figure observes one instant
\* across every table it reads.
SPECIFICATION Spec
CONSTANTS
    Tables = {lots, positions}
    MaxJournal = 3
    MaxFigures = 2
    ApplyAtomically = TRUE
    SnapshotRead    = TRUE
INVARIANTS
    TypeOK
    AFigureIsFoldedFromOnePrefix
    NoTableOutrunsTheJournal
