\* MinTax treated as a Method: sort the holding once, walk, never look at
\* the sale price. Prefer-long picks lot B at both 50 and 5.
\* TheLotTakenMinimisesTax MUST go red.
\*
\* ⛔ DO NOT LIST TheTwoPricesDisagree HERE. That invariant is about
\* MinTaxPick, which does not read TreatAsOrder, so it holds on this
\* dial too. A probe that named only that one would stay green — the
\* vacuous pass this file exists to prevent. It belongs on
\* MCMinTaxEngine.cfg, which is the engine that actually ranks.
SPECIFICATION Spec
CONSTANTS
    TreatAsOrder = TRUE
INVARIANTS
    TypeOK
    TheLotTakenMinimisesTax
