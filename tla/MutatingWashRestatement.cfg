\* Qualification and restatement both fire, and the struck figure is
\* overwritten anyway. The identity still cites; the number is somebody
\* else's.
\* AStruckFigureIsNotRewritten MUST go red.
SPECIFICATION Spec
CONSTANTS
    Sales = {s1, s2}
    Window = 2
    MaxDay = 6
    QualifyOpenWindow = TRUE
    RestateOnLateWash = TRUE
    MutateStruckFigure = TRUE
INVARIANTS
    TypeOK
    AStruckFigureIsNotRewritten
