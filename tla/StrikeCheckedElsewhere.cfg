\* ACheckedStrikeIsPricedOnItsOwnDay MUST go red.
\* ⛔ THE SAME DIAL, THE WORSE CONSEQUENCE. A price dated after the clock's day
\* satisfies a check run for that later day, and the strike lands on a day with
\* no price at all. The check passed, and it was about the wrong day.
SPECIFICATION Spec
CONSTANTS
    Days = {1, 2, 3}
    AsOfMustBeTheStrikeDay = FALSE
    BareStrikeChecksPrices = FALSE
INVARIANTS
    TypeOK
    ACheckedStrikeIsPricedOnItsOwnDay
