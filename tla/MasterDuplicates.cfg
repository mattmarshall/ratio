\* An append-only master with NO superseding: correcting an entity leaves the
\* old record behind and both still match, so a correction makes every fact
\* that resolved through it AMBIGUOUS.
\* ResolutionUsesCurrentRecords MUST go red.
SPECIFICATION Spec
CONSTANTS
    Sections  = {"rule", "template"}
    EntityIds = {i1, i2}
    Claims    = {c1, c2}
    Refs      = {r1, r2}
    NoClaim   = NoClaim
    ApproveKeepsOtherSections = TRUE
    MasterSupersedesById      = FALSE
INVARIANTS
    TypeOK
    PendingExcludesPosted
    ResolutionUsesCurrentRecords
PROPERTIES
    ApprovePreservesSections
