\* A worker per table, each making its own progress. Lots reaches entry 105
\* while positions is still at 100, so even a PERFECT snapshot read observes
\* two prefixes at once and folds a figure that never existed.
\* AFigureIsFoldedFromOnePrefix MUST go red.
SPECIFICATION Spec
CONSTANTS
    Tables = {lots, positions}
    MaxJournal = 3
    MaxFigures = 2
    ApplyAtomically = FALSE
    SnapshotRead    = TRUE
INVARIANTS
    TypeOK
    AFigureIsFoldedFromOnePrefix
