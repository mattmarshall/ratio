\* Results published as each partition lands. A reader arriving early gets a
\* number built from part of the data — smaller, and indistinguishable from
\* right.
\* CommitIsAllOrNothing MUST go red.
SPECIFICATION Spec
CONSTANTS
    Partitions = {p1, p2}
    Workers    = {w1, w2}
    NoWorker   = none
    ClaimBeforeWork  = TRUE
    CommitAtomically = FALSE
INVARIANTS
    TypeOK
    CommitIsAllOrNothing
