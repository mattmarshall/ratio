\* ANewFigureRetiresItsExplanation MUST go red.
\* An explanation that outlives the figure it was written about: February's
\* note clearing June's difference, on a book that ties the whole way.
SPECIFICATION Spec
CONSTANTS
    Breaks = {b1, b2}
    Figures = {0, 1, 2}
    Facts = {f1}
    MaxPos = 2
    Threshold = 2
    RefuseOnUnexplainedHigh = TRUE
    RetireOnANewFigure = FALSE
    PinExplanationToThePrefix = FALSE
INVARIANTS
    TypeOK
    ANewFigureRetiresItsExplanation
