\* Corporate actions in a side plane, as `Plane::Actions` has them today. No
\* strike pins them, so under the factor representation a replay reads
\* whatever arrived since and answers differently.
\* This is `Ratio.Actions.Factor.an_unpinned_announcement_changes_the_answer`
\* as a run rather than a single step.
\* ReplayReproduces MUST go red.
SPECIFICATION Spec
CONSTANTS
    MaxJournal = 3
    MaxStrikes = 2
    PinWhatWasRead         = TRUE
    IncrementalProject     = TRUE
    AnnouncementsInJournal = FALSE
INVARIANTS
    TypeOK
    ReplayReproduces
