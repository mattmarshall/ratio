\* The engine as designed: a disallowed loss is written onto the replacement
\* lot's basis. The replacement is a new lot, still open; a later relief of
\* it takes acquisition plus the deferral, so the loss is moved and not
\* removed.
SPECIFICATION Spec
CONSTANTS
    Sales = {s1, s2}
    Window = 2
    MaxDay = 6
    AcquisitionCost = 5
    Loss = 3
    AttachToReplacement = TRUE
INVARIANTS
    TypeOK
    ADisallowedLossIsOnTheReplacement
    TheWriteIsToAnOpenReplacement
    LaterReliefTakesTheReplacementBasis
    AWashFiresOnlyInsideTheWindow
