\* The journal as designed: every append is a conditional PUT that claims an
\* absent key, so two writers racing for one slot serialize onto two.
SPECIFICATION Spec
CONSTANTS
    Writers = {a, b}
    MaxSeq  = 2
    Empty   = none
    ConditionalPut = TRUE
INVARIANTS
    TypeOK
    NoWriteIsLost
    ContiguousNoHoles
    NoEntryTwice
