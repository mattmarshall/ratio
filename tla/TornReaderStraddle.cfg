\* The projector writes every table for one entry in one transaction, and the
\* reader still straddles: it queries lots, the projector commits, it queries
\* positions. Two statements of one figure, two prefixes. Atomic writes alone
\* are not enough.
\* AFigureIsFoldedFromOnePrefix MUST go red.
SPECIFICATION Spec
CONSTANTS
    Tables = {lots, positions}
    MaxJournal = 3
    MaxFigures = 2
    ApplyAtomically = TRUE
    SnapshotRead    = FALSE
INVARIANTS
    TypeOK
    AFigureIsFoldedFromOnePrefix
