\* A strike reports a realized gain; a repurchase lands inside the window days
\* later and the same sale's gain is a different number. The strike carried no
\* qualification and nothing recorded that it moved, so there are two answers
\* to "what was the realized gain", both reproducible, both digested.
\* AStruckGainThatMovedSaysSo MUST go red.
SPECIFICATION Spec
CONSTANTS
    Sales = {s1, s2}
    Window = 2
    MaxDay = 6
    QualifyOpenWindow = FALSE
    RestateOnLateWash = FALSE
INVARIANTS
    TypeOK
    AStruckGainThatMovedSaysSo
