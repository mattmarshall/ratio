\* No claim before work. Two workers take the same partition and both compute
\* it correctly; the total double-counts.
\* NoPartitionRunsTwice MUST go red.
SPECIFICATION Spec
CONSTANTS
    Partitions = {p1, p2}
    Workers    = {w1, w2}
    NoWorker   = none
    ClaimBeforeWork  = FALSE
    CommitAtomically = TRUE
INVARIANTS
    TypeOK
    NoPartitionRunsTwice
