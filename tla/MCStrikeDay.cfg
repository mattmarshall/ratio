\* The strike as fixed: every strike checks prices for the day it lands on, and
\* --as-of, if given, must name that day. Each fix has a probe that flips it
\* back: StrikeAsOfElsewhere, StrikeCheckedElsewhere and BareStrikeIsUnchecked.
SPECIFICATION Spec
CONSTANTS
    Days = {1, 2, 3}
    AsOfMustBeTheStrikeDay = TRUE
    BareStrikeChecksPrices = TRUE
INVARIANTS
    TypeOK
    AStrikeLandsOnTheDayItWasAskedFor
    ACheckedStrikeIsPricedOnItsOwnDay
    EveryStrikeIsPricedOnItsOwnDay
