\* The strike as fixed: --as-of must name the day the strike lands on, and the
\* price check runs for that day. A bare strike still checks no prices, as it
\* ships; BareStrikeIsUnchecked.cfg keeps that gap red.
SPECIFICATION Spec
CONSTANTS
    Days = {1, 2, 3}
    AsOfMustBeTheStrikeDay = TRUE
    BareStrikeChecksPrices = FALSE
INVARIANTS
    TypeOK
    AStrikeLandsOnTheDayItWasAskedFor
    ACheckedStrikeIsPricedOnItsOwnDay
