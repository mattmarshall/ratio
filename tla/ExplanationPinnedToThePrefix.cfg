\* PostingDoesNotUnexplainABreak MUST go red.
\* ⭐ THE DESIGN THAT WAS NOT SHIPPED, and the reason this spec is worth its
\* afternoon. Pinning a note to the journal prefix its accepter read is the
\* obvious reading of "a proposal is as-of" — and it retires every explanation
\* on the next posting, so a fund that posts on the morning of a close can
\* never be struck at all.
SPECIFICATION Spec
CONSTANTS
    Breaks = {b1, b2}
    Figures = {0, 1, 2}
    Facts = {f1}
    MaxPos = 2
    Threshold = 2
    RefuseOnUnexplainedHigh = TRUE
    RetireOnANewFigure = TRUE
    PinExplanationToThePrefix = TRUE
INVARIANTS
    TypeOK
PROPERTIES
    PostingDoesNotUnexplainABreak
