\* No per-shard claim: two sales may relieve one instrument at once. Each
\* one's arithmetic is impeccable and the total is wrong.
\* NothingIsRelievedTwice MUST go red.
SPECIFICATION Spec
CONSTANTS
    Instruments = {i1}
    Sales       = {s1, s2, s3}
    NoOne       = NoOne
    NoLot       = NoLot
    Lots        = {1, 2}
    QueueDepth  = 3
    LockPerInstrument = FALSE
INVARIANTS
    TypeOK
    NothingIsRelievedTwice
