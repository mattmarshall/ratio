\* The settlement calendar in a side file, pinned by nothing. A trade struck on
\* the 30th settles on the 2nd today and on the 3rd once somebody declares a
\* holiday, so re-deriving a recorded NAV answers differently as the world tells
\* us more — which is worse than a restatement, because a restatement announces
\* itself.
\* ReplayReproducesUnderEveryView MUST go red.
SPECIFICATION Spec
CONSTANTS
    Views = {abor, ibor}
    MaxJournal = 3
    MaxStrikes = 2
    MaxCalendars = 2
    OneStreamingPass = TRUE
    CalendarInConfig = FALSE
INVARIANTS
    TypeOK
    ReplayReproducesUnderEveryView
