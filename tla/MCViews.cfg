\* Multi-view books as designed: one journal parsed once, every view folded by
\* the same pass, and the settlement calendar inside the configuration each
\* entry already pins.
SPECIFICATION Spec
CONSTANTS
    Views = {abor, ibor}
    MaxJournal = 3
    MaxStrikes = 2
    MaxCalendars = 2
    OneStreamingPass = TRUE
    CalendarInConfig = TRUE
PROPERTIES
    EveryViewCatchesUp
INVARIANTS
    TypeOK
    EveryViewFoldsTheSamePrefix
    AReconciliationComparesOnePrefix
    AStrikeFoldsTheViewItNames
    ReplayReproducesUnderEveryView
