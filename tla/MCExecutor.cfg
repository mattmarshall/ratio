\* The executor as designed: a worker claims before it runs, and results are
\* published all at once.
SPECIFICATION Spec
CONSTANTS
    Partitions = {p1, p2}
    Workers    = {w1, w2}
    NoWorker   = none
    ClaimBeforeWork  = TRUE
    CommitAtomically = TRUE
INVARIANTS
    TypeOK
    NoPartitionRunsTwice
    CommitIsAllOrNothing
    CancelPublishesNothing
    CommittedWasRun
