\* The fixed system: approve preserves other sections, and the master
\* supersedes by id rather than leaving a duplicate behind.
SPECIFICATION Spec

CONSTANTS
    Sections  = {"rule", "template"}
    EntityIds = {i1, i2}
    Claims    = {c1, c2}
    Refs      = {r1, r2}
    NoClaim   = NoClaim
    ApproveKeepsOtherSections = TRUE
    MasterSupersedesById      = TRUE

INVARIANTS
    TypeOK
    PendingExcludesPosted
    ResolutionUsesCurrentRecords
    PostedWasRead

PROPERTIES
    ApprovePreservesSections
    PostedNeverRetracted
    FactsOutliveConfig
