\* Acknowledgment before publication returns a transition that is not durable.
\* AcknowledgedTransitionsSurvive MUST go red.
SPECIFICATION Spec
CONSTANTS
    NoState = noState
    ConditionalPublish = TRUE
    CheckPredecessor = TRUE
    PublishBeforeAck = FALSE
    ExactRetry = TRUE
    FreshAuthorization = TRUE
    ProtectSeed = TRUE
INVARIANTS
    TypeOK
    AcknowledgedTransitionsSurvive
