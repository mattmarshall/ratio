\* EveryStrikeIsPricedOnItsOwnDay MUST go red.
\* ⚠ NOT A DIAL FLIPPED: THIS IS WHAT SHIPS. A bare `ratio strike` runs no price
\* check, so a NAV can be struck over a holding with no price on the day. Kept
\* red on purpose. When the bare strike checks prices, set
\* BareStrikeChecksPrices = TRUE in MCStrikeDay.cfg, list this invariant there,
\* and retire this probe.
SPECIFICATION Spec
CONSTANTS
    Days = {1, 2, 3}
    AsOfMustBeTheStrikeDay = TRUE
    BareStrikeChecksPrices = FALSE
INVARIANTS
    TypeOK
    EveryStrikeIsPricedOnItsOwnDay
