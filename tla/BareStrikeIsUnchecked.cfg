\* EveryStrikeIsPricedOnItsOwnDay MUST go red.
\* ⛔ THE BARE STRIKE BEFORE THE FIX. Without --as-of, `ratio strike` ran no
\* price check — "a book does not know what day it is" — although the strike
\* itself chose the day. The seeded demo's two struck funds each held 250 VWRL
\* that nothing priced, and both NAVs were struck over it.
SPECIFICATION Spec
CONSTANTS
    Days = {1, 2, 3}
    AsOfMustBeTheStrikeDay = TRUE
    BareStrikeChecksPrices = FALSE
INVARIANTS
    TypeOK
    EveryStrikeIsPricedOnItsOwnDay
