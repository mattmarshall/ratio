\* The engine as designed: a strike taken while a wash window is still open
\* says so, and a repurchase that lands inside the window of an already-struck
\* sale produces a restatement rather than a quietly different answer.
SPECIFICATION Spec
CONSTANTS
    Sales = {s1, s2}
    Window = 2
    MaxDay = 6
    QualifyOpenWindow = TRUE
    RestateOnLateWash = TRUE
INVARIANTS
    TypeOK
    AStruckGainThatMovedSaysSo
    AClosedWindowIsNotQualified
