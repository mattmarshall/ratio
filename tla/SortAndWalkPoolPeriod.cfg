\* The category rule treated as an Order: FIFO takes the oldest
\* date on a mixed pool and invents long-term. Mixed dates should
\* stay unset. The books still tie.
\* ThePoolDateStaysUnset MUST go red.
\*
\* ⛔ DO NOT LIST TreatingMixedDatesAsAnOrderInventsACategory HERE.
\* That invariant is about DateA and DateB, which do not read
\* TreatAsOrder, so it holds on this dial too. A probe that named
\* only that one would stay green — the vacuous pass this file
\* exists to prevent. It belongs on MCPoolPeriodEngine.cfg, which
\* is the engine that actually leaves the date unset.
SPECIFICATION Spec
CONSTANTS
    TreatAsOrder = TRUE
INVARIANTS
    TypeOK
    ThePoolDateStaysUnset
