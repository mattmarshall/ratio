\* SpecID treated as a Method: sort the holding once, walk, never look at
\* the taxpayer's name. FIFO picks lot A; the taxpayer named lot B.
\* TheLotTakenIsTheOneNamed MUST go red.
\*
\* ⛔ DO NOT LIST TheNamedLotIsNotFifo HERE. That invariant is about
\* SpecIdPick and OrderPick, which do not read TreatAsOrder, so it holds
\* on this dial too. A probe that named only that one would stay green —
\* the vacuous pass this file exists to prevent. It belongs on
\* MCSpecIdEngine.cfg, which is the engine that actually names.
SPECIFICATION Spec
CONSTANTS
    TreatAsOrder = TRUE
INVARIANTS
    TypeOK
    TheLotTakenIsTheOneNamed
