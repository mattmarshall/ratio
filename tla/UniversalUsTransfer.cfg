\* The US transfer hardcoded as universal. The replacement is classified
\* from the original lot's date, not the repurchase's. Same sale, same
\* basis, the wrong rate. The books still tie.
\* TheReplacementKeepsItsOwnDate MUST go red.
\*
\* ⛔ DO NOT LIST ChoosingTheWrongRuleFlipsTheRate HERE. That invariant is
\* about the two dates, which do not read AssumeUsTransfer, so it holds
\* on this dial too. A probe that named only that one would stay green —
\* the vacuous pass this file exists to prevent. It belongs on
\* MCWashHoldingPeriod.cfg, which is the engine that actually elects.
SPECIFICATION Spec
CONSTANTS
    AssumeUsTransfer = TRUE
INVARIANTS
    TypeOK
    TheReplacementKeepsItsOwnDate
