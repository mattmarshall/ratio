\* Complete immutable bootstrap objects precede one conditional publication.
SPECIFICATION Spec
CONSTANTS
    Creators = {alice, bob}
    NoBook = noBook
    ConditionalPublication = TRUE
    RequireComplete = TRUE
    KeepGeneration = TRUE
    RefuseIncomplete = TRUE
    GrantOnlyPublished = TRUE
INVARIANTS
    TypeOK
    PublishedBookComplete
    PublishedGenerationAgrees
    OneWinningGeneration
    AcknowledgedPublicationSurvives
    ReaderHasVerifiedSnapshot
    ReaderGrantMatchesSnapshot
    LosingCreatorHasNoMembership
