\* A relief converted against the factor it read and written against whatever
\* is current. The entry balances; the units are wrong.
\* ReliefIsWrittenAgainstWhatItRead MUST go red.
\*
\* ⚠ MaxConfigs = 0 so no rule set is ever promoted. This probe is about the
\* factor, and a second dial moving would let it go red for a reason it is not
\* testing — which reads exactly like going red for the reason it is.
SPECIFICATION Spec
CONSTANTS
    Sales = {s1, s2}
    MaxSplits = 2
    MaxConfigs = 0
    PinTheFactor   = FALSE
    RefuseOnChange = FALSE
    PinTheMethod   = TRUE
INVARIANTS
    TypeOK
    ReliefIsWrittenAgainstWhatItRead
