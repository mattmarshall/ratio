\* AStrikeLandsOnTheDayItWasAskedFor MUST go red.
\* ⛔ THE CLI BEFORE THE FIX. `ratio strike --as-of D` checked prices at D and
\* struck at the clock's day, so a NAV asked for one day was filed under another.
SPECIFICATION Spec
CONSTANTS
    Days = {1, 2, 3}
    AsOfMustBeTheStrikeDay = FALSE
    BareStrikeChecksPrices = FALSE
INVARIANTS
    TypeOK
    AStrikeLandsOnTheDayItWasAskedFor
