syntax = "proto3";

package ratio.storage.v1;

option java_multiple_files = true;
option java_package = "com.fastverk.ratio.storage.v1";
option java_outer_classname = "ControlProto";

// One reviewed post-create change. The actor is supplied by a trusted caller,
// never copied from an unverified request body.
message ControlOperation {
  // Only version 1 is supported. Zero is not a default version.
  int32 format_version = 1;
  string book_id = 2;
  string bootstrap_digest = 3;
  uint64 expected_revision = 4;
  string expected_predecessor_digest = 5;
  string operation_id = 6;
  string actor_subject = 7;
  string actor_provenance = 8;
  oneof change {
    ConfigPromotion config_promotion = 9;
    MembershipRevision membership_revision = 10;
  }
}

// A reference to exact configuration bytes stored under their SHA-256 digest.
message ConfigPromotion {
  string config_digest = 1;
}

// One explicit book-membership decision.
message MembershipRevision {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    GRANT = 1;
    REVOKE = 2;
  }
  Action action = 1;
  oneof principal {
    string authkit_subject = 2;
    string organization_id = 3;
  }
}

// The immutable object conditionally claimed at its exact revision.
message ControlTransition {
  // Only version 1 is supported. Zero is not a default version.
  int32 format_version = 1;
  uint64 revision = 2;
  ControlOperation operation = 3;
  // SHA-256 of the canonical protobuf bytes of operation.
  string operation_digest = 4;
}

// The stable result returned after publication and on an exact retry.
message ControlReceipt {
  string book_id = 1;
  string bootstrap_digest = 2;
  string operation_id = 3;
  string operation_digest = 4;
  uint64 committed_revision = 5;
  string transition_digest = 6;
}
