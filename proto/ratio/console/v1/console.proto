}

message ListPendingFactsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListPendingFactsResponse {
  repeated PendingFact pending_facts = 1;
  string next_page_token = 2;
}

message GetDeliveryRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Delivery"
  ];
}

message GetPendingFactRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/PendingFact"
  ];
}

// What a fund holds in one instrument, in one account.
message Position {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Position"
    pattern: "funds/{fund}/views/{view}/positions/{position}"
    singular: "position"
    plural: "positions"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The account, as a resource name.
  string account = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Account"
  ];
  // Its label, so a screen does not have to join to show one. `_label` rather
  // than `_name`: AIP-122 reserves `name` for a resource name.
  string account_label = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The instrument this is held in. EMPTY for value in the account that is not
  // attributed to any instrument — which is a real row, not a missing one.
  string instrument = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string instrument_label = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whole units.
  //
  // ⚠ A MEASURE, not a conserved quantity: buying a hundred shares creates a
  // hundred here and destroys them at the counterparty, who is outside this
  // book. What checks it is reconciliation against the custodian.
  string quantity = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What the book holds it at, in minor units. Value DOES conserve — an
  // instrument partitions where it sits, not how much there is.
  string value = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many open tax lots stand behind this figure.
  //
  // ⛔ THE NUMBER THAT DOES NOT APPEAR IN A NAV, SHOWN NEXT TO ONE THAT DOES.
  // `Ratio.Closure.factored_nav_never_reads_the_lots` — a position is a chart
  // and its lots are a history, and the whole scale argument is that valuing
  // the first does not touch the second. Putting them side by side is what lets
  // a reader see that twenty thousand lots produced one line.
  int64 open_lot_count = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The valuation date this was last marked at, ABSENT if it never has been.
  //
  // ⛔ THE DIFFERENCE BETWEEN COST AND MARKET, ON THE FACE OF THE FIGURE. Two
  // positions can show the same number for opposite reasons — one because that
  // is what it is worth, the other because that is what it cost and nobody has
  // priced it. A screen that does not distinguish them is reporting an opinion
  // as a fact.
  google.type.Date mark_date = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListPositionsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListPositionsResponse {
  repeated Position positions = 1;
  string next_page_token = 2;
}

message GetPositionRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Position"
  ];
}

// One open tax lot: what was bought, when, and what it cost.
//
// ⛔ THE THING A REALIZED GAIN IS COMPUTED FROM, and the reason the lot method
// is a term of an agreement rather than a preference. A sale gives up some of
// these and not others, and which ones decides the taxable income.
message Lot {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Lot"
    pattern: "funds/{fund}/views/{view}/positions/{position}/lots/{lot}"
    singular: "lot"
    plural: "lots"
  };

  // The resource name: `funds/{fund}/positions/{position}/lots/{lot}`, where
  // the lot id is its journal position.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Acquisition order, which is the journal position of the entry that opened
  // it. ⛔ NOT A DATE: two lots acquired a year apart may be adjacent ordinals,
  // and FIFO is this field while the holding period is the one below.
  int64 sequence = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Units still open in this lot.
  string units = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What those units cost, in minor units. ⛔ COST, NOT VALUE — a lot is never
  // revalued. `//tla:valuation_check`'s `CostIsNeverRevalued`.
  string cost = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The day it was acquired, ABSENT when the entry that opened it carried no
  // trade date.
  //
  // ⛔ ABSENT RATHER THAN DEFAULTED, and the holding-period methods REFUSE such
  // a holding rather than guessing. Both defaults are wrong in opposite
  // directions: the epoch makes it long-term at the favorable rate on records
  // that do not support the claim, and today makes it short-term on a holding
  // that may have been held for years.
  google.type.Date acquired = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListLotsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Position"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListLotsResponse {
  repeated Lot lots = 1;
  string next_page_token = 2;
}

message GetLotRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Lot"
  ];
}

// A mapping template: how a counterparty's file becomes facts.
message Template {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Template"
    pattern: "funds/{fund}/templates/{template}"
    singular: "template"
    plural: "templates"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string template_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What a row of this file is: a trade, a price, an fx rate.
  string fact_kind = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The template as a person reads it — the same rendering the rules screen
  // uses, so a mapping can be read before it is trusted.
  string form = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // False for reference data — a price file, an FX file, a security master —
  // which is recorded, resolved and citable, and never touches the books.
  bool posts = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListTemplatesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListTemplatesResponse {
  repeated Template templates = 1;
  string next_page_token = 2;
}

message GetTemplateRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Template"
  ];
}

// A row the template could not map, and why. Per row, never per file.
message RejectedRow {
  string row = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string reason = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message IngestDeliveryRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];

  // A template in the configuration in force.
  string template_id = 2 [(google.api.field_behavior) = REQUIRED];

  // The file, verbatim.
  string content = 3 [(google.api.field_behavior) = REQUIRED];

  // What to call it — a filename, an S3 key, an SFTP path.
  string origin = 4 [(google.api.field_behavior) = OPTIONAL];

  // Read the file and report what it would produce, recording nothing.
  bool validate_only = 5 [(google.api.field_behavior) = OPTIONAL];
}

message IngestDeliveryResponse {
  string delivery_digest = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string row_count = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Facts this file produced, and how many of them are new — the same bytes
  // under the same template do not produce a second set.
  string fact_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string new_fact_count = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  string ready_count = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated RejectedRow rejected = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated PendingFact pending = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  bool validate_only = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One position's valuation.
message Mark {
  // The instrument, and the label the screens show.
  string instrument = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string instrument_label = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whole units held.
  string quantity = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What the book held it at, what it is worth, and the difference the mark
  // posts. All in minor units.
  string carrying = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string market = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  string movement = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The price used, and the day it was observed — never after the valuation
  // date.
  string price = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.type.Date price_date = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message MarkPositionsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];

  // The day to value at. A price observed after it is not evidence about it
  // and is not used.
  //
  // A `Date` and not a `Timestamp`: a valuation date is a calendar day, not an
  // instant, and pretending otherwise would invite a timezone into a figure
  // that does not have one.
  google.type.Date valuation_date = 2 [(google.api.field_behavior) = REQUIRED];

  // Compute the marks and post nothing. (AIP-163)
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

message MarkPositionsResponse {
  repeated Mark marks = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Positions nothing has priced on or before the date. NOT marked at zero.
  repeated Mark unpriced = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Positions whose arithmetic does not land on a whole minor unit.
  repeated string inexact = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many entries were posted. A position already at market moves by
  // nothing and posts nothing.
  string posted_count = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  string net_asset_value = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  string previous_net_asset_value = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  bool validate_only = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message AdmitFactsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  bool validate_only = 2 [(google.api.field_behavior) = OPTIONAL];
}

message AdmitFactsResponse {
  string posted_count = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Reference data — a price file, an FX file — declares no posting rules. It
  // is recorded, resolved and citable, and never touches the books. Counted
  // apart from a refusal, because it is the design rather than a fault.
  string recorded_count = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  string pending_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated string refused = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The fund's NAV with what this posted, and what it was without.
  string net_asset_value = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  string previous_net_asset_value = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  bool validate_only = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

