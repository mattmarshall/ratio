syntax = "proto3";

// The operations console's contract — the backend-for-frontend.
//
// # Why a BFF and not the domain services directly
//
// `Chart` and `Ledger` are the domain: accounts, transactions, a trial
// balance. A fund controller on a NAV day does not think in those terms. They
// think in funds that are blocked or struck, exceptions ordered by money at
// risk, and a deadline. Shaping that in the browser would mean the console
// issuing a fan-out of domain calls and reassembling them — over a link whose
// latency it does not control, in a language where the reassembly is untyped.
//
// So this service is view-shaped on purpose. It is allowed to know what a
// screen needs; the domain services are not allowed to know a screen exists.
//
// # HTTP
//
// Every method carries a `google.api.http` rule, and the transcoder in
// `ratio-console` is generated from nothing — it is written by hand and then
// CHECKED against these annotations by `//crates/ratio-console:transcode_test`,
// which reads the descriptor set this file compiles to. A route that drifts
// from its annotation is a failing build rather than a 404 someone finds.
//
// AIP-idiomatic (aip.dev); lints clean via //proto:ratio_aip_lint. Layout is
// `ratio/console/v1/console.proto` so the path matches the package (AIP-191).
// ⛔ ITS OWN PACKAGE, not `ratio.v1`.
//
// The console is a BFF over its own resource hierarchy (`funds/…`), while the
// kernel contracts are keyed on `books/…`. Both need an `Account` and a
// `Posting`, and they are not the same message: the kernel's carry integers
// and classification, the console's carry rendered strings and a running
// balance. Sharing a package made that a protoc error — "ratio.v1.Account is
// already defined" — and the fix is not to rename the console's messages into
// something they are not. It is to say that these are two APIs.
package ratio.console.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";

option java_multiple_files = true;
option java_package = "com.fastverk.ratio.console.v1";
option java_outer_classname = "ConsoleProto";

// What a fund controller works from.
service Console {
  option (google.api.default_host) = "ratio.fastverk.dev";

  // Lists the funds this operator is responsible for. (AIP-132)
  rpc ListFunds(ListFundsRequest) returns (ListFundsResponse) {
    option (google.api.http) = {get: "/v1/funds"};
  }

  // Gets one fund, with the figures that decide whether its NAV can be
  // struck. (AIP-131)
  rpc GetFund(GetFundRequest) returns (Fund) {
    option (google.api.http) = {get: "/v1/{name=funds/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists the views declared on a fund. (AIP-132)
  //
  // ⛔ A FUND ALWAYS HAS AT LEAST ONE, AND A BOOK THAT DECLARES NOTHING HAS
  // EXACTLY ONE. That one recognises entries in the journal's own order, which
  // is what every book has always done — see `View.declared`.
  rpc ListViews(ListViewsRequest) returns (ListViewsResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/views"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one view, with the figures it recognises. (AIP-131)
  rpc GetView(GetViewRequest) returns (View) {
    option (google.api.http) = {get: "/v1/{name=funds/*/views/*}"};
    option (google.api.method_signature) = "name";
  }

  // What two views over one journal disagree about, entry by entry. (AIP-136)
  //
  // GET, like `:replay` and `:diff` above: it folds a journal prefix and writes
  // nothing, so a verb implying mutation would be a lie about a method that
  // cannot.
  //
  // ⭐ THE DIFFERENCE IS A LIST, NOT A DISCREPANCY.
  // `Ratio.Views.two_views_differ_by_exactly_what_is_in_flight` — each view is
  // the other plus the entries the other has not recognised yet. That is what
  // makes this a derivation rather than a reconciliation somebody performs.
  rpc ReconcileViews(ReconcileViewsRequest) returns (ReconcileViewsResponse) {
    option (google.api.http) = {get: "/v1/{name=funds/*/views/*}:reconcile"};
    option (google.api.method_signature) = "name";
  }

  // Lists a fund's open breaks, ordered by money at risk. (AIP-132)
  rpc ListBreaks(ListBreaksRequest) returns (ListBreaksResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*/views/*}/breaks"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one break, with the postings behind Ratio's figure and the
  // configuration that produced it. (AIP-131)
  rpc GetBreak(GetBreakRequest) returns (Break) {
    option (google.api.http) = {get: "/v1/{name=funds/*/views/*/breaks/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists a fund's configuration versions, newest first. (AIP-132)
  rpc ListConfigVersions(ListConfigVersionsRequest)
      returns (ListConfigVersionsResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/configVersions"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one configuration version, with its rules as a person reads them.
  // (AIP-131)
  rpc GetConfigVersion(GetConfigVersionRequest) returns (ConfigVersion) {
    option (google.api.http) = {get: "/v1/{name=funds/*/configVersions/*}"};
    option (google.api.method_signature) = "name";
  }

  // What changed between two configuration versions. (AIP-136)
  //
  // GET, like the replay above: comparing two immutable, content-addressed
  // blobs is safe and idempotent, and a verb that implies mutation would be a
  // lie about a method that cannot.
  rpc DiffConfigVersions(DiffConfigVersionsRequest)
      returns (DiffConfigVersionsResponse) {
    option (google.api.http) = {get: "/v1/{name=funds/*/configVersions/*}:diff"};
    option (google.api.method_signature) = "name";
  }

  // The rules in force, structured. `ConfigVersion.rules` renders them for
  // reading; this is for a caller that has to choose one. (AIP-132)
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/rules"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one rule of the active configuration. (AIP-131)
  rpc GetRule(GetRuleRequest) returns (Rule) {
    option (google.api.http) = {get: "/v1/{name=funds/*/rules/*}"};
    option (google.api.method_signature) = "name";
  }

  // The mapping templates in force. (AIP-132)
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/templates"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one template. (AIP-131)
  rpc GetTemplate(GetTemplateRequest) returns (Template) {
    option (google.api.http) = {get: "/v1/{name=funds/*/templates/*}"};
    option (google.api.method_signature) = "name";
  }

  // Reads a delivered file into facts. (AIP-136)
  //
  // ⛔ A WRITE. Set `validate_only` to see what the template would produce —
  // the facts, what each resolves to, what would pend — without recording
  // anything (AIP-163). The same move as ApplyEvent, and for the same reason:
  // a mapping you have watched run beats a mapping you have to imagine.
  rpc IngestDelivery(IngestDeliveryRequest) returns (IngestDeliveryResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=funds/*}:ingest"
      body: "*"
    };
  }

  // Marks the book to market at a valuation date. (AIP-136)
  //
  // ⛔ A WRITE, and a POSTING rather than an assignment: each position moves by
  // the difference between what the book holds it at and what it is worth, with
  // the contra in unrealized gain. Nothing is overwritten, so "why is this
  // worth more than we paid" has an entry to point at.
  //
  // A position with no price on or before the date is NOT marked at zero. It is
  // reported unpriced, and it blocks — a NAV struck over a position nobody has
  // priced is wrong in a way nobody can see.
  rpc MarkPositions(MarkPositionsRequest) returns (MarkPositionsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=funds/*}:mark"
      body: "*"
    };
  }

  // Posts every fact that fully resolves. (AIP-136)
  //
  // ⛔ A WRITE. The fact becomes an event and the rules already in force decide
  // the entries; nothing here knows how a trade books.
  rpc AdmitFacts(AdmitFactsRequest) returns (AdmitFactsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=funds/*}:admit"
      body: "*"
    };
  }

  // Records an event and returns the entry the active configuration produced
  // from it. (AIP-136)
  //
  // ⛔ THE ONLY METHOD ON THIS SERVICE THAT WRITES.
  //
  // It takes a RULE and an amount, never a set of postings. Which accounts
  // move, and in which direction, is decided by the configuration a person
  // approved — an operator recording a trade is asserting that something
  // happened, not deciding how it is booked. That distinction is the reason
  // this can be a write at all while `approve` stays humans-only at a
  // terminal: recording a fact does not change how any figure is derived.
  //
  // Set `validate_only` to see the entry and the NAV it would produce without
  // writing anything (AIP-163).
  rpc ApplyEvent(ApplyEventRequest) returns (ApplyEventResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=funds/*}:applyEvent"
      body: "*"
    };
  }

  // Files received on the data plane, newest first. (AIP-132)
  rpc ListDeliveries(ListDeliveriesRequest) returns (ListDeliveriesResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/deliveries"};
    option (google.api.method_signature) = "parent";
  }

  // Facts read out of those files that cannot post yet, and what blocks each.
  // (AIP-132)
  //
  // These are exceptions in the same sense a reconciliation break is: a figure
  // missing an input is not a figure. They block the NAV for the same reason
  // and appear in the same place.
  rpc ListPendingFacts(ListPendingFactsRequest)
      returns (ListPendingFactsResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/pendingFacts"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one delivery. (AIP-131)
  rpc GetDelivery(GetDeliveryRequest) returns (Delivery) {
    option (google.api.http) = {get: "/v1/{name=funds/*/deliveries/*}"};
    option (google.api.method_signature) = "name";
  }

  // Gets one pending fact. (AIP-131)
  rpc GetPendingFact(GetPendingFactRequest) returns (PendingFact) {
    option (google.api.http) = {get: "/v1/{name=funds/*/pendingFacts/*}"};
    option (google.api.method_signature) = "name";
  }

  // What the fund holds, by account and instrument. (AIP-132)
  //
  // ⛔ THE UNATTRIBUTED REMAINDER IS IN THIS LIST, as a position with no
  // instrument. Not a separate field beside it: a caller can render a list
  // without noticing a field, and a positions view that quietly omits what it
  // does not attribute disagrees with the trial balance by exactly the amount
  // it hid. In the list, the rows sum to the accounts by construction.
  rpc ListPositions(ListPositionsRequest) returns (ListPositionsResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*/views/*}/positions"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one position. (AIP-131)
  rpc GetPosition(GetPositionRequest) returns (Position) {
    option (google.api.http) = {get: "/v1/{name=funds/*/views/*/positions/*}"};
    option (google.api.method_signature) = "name";
  }

  // The open tax lots behind one position, oldest first. (AIP-132)
  //
  // ⛔ A SUBCOLLECTION OF THE POSITION, not a screen of its own. A lot is only
  // meaningful as part of the holding it belongs to — `Position.open_lot_count`
  // is the count and this is what it counts — and the nesting is what says so.
  //
  // ⚠ THIS IS THE EXPENSIVE READ ON THIS SERVICE, and deliberately scoped so it
  // stays affordable. A fund's lots are its whole trading HISTORY where its
  // positions are a chart of five hundred lines; asking for one position's lots
  // is bounded by that position, and there is deliberately no way to ask for
  // every lot in the fund at once.
  rpc ListLots(ListLotsRequest) returns (ListLotsResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*/views/*/positions/*}/lots"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one open tax lot. (AIP-131)
  rpc GetLot(GetLotRequest) returns (Lot) {
    option (google.api.http) = {get: "/v1/{name=funds/*/views/*/positions/*/lots/*}"};
    option (google.api.method_signature) = "name";
  }

  // The trial balance: every account in the chart with what it holds.
  // (AIP-132)
  //
  // This is the screen the whole product argues for. A NAV is a fold over
  // these figures, and until you can open one there is no difference between
  // a proved ledger and a confident one.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*/views/*}/accounts"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one account with its balance. (AIP-131)
  rpc GetAccount(GetAccountRequest) returns (Account) {
    option (google.api.http) = {get: "/v1/{name=funds/*/views/*/accounts/*}"};
    option (google.api.method_signature) = "name";
  }

  // Every posting on one account, in the order the journal holds them, each
  // carrying the running balance after it. (AIP-132)
  //
  // The same answer `ratio explain` gives at a terminal. A figure that cannot
  // name the lines behind it is a claim; this is what makes it a derivation.
  rpc ListPostings(ListPostingsRequest) returns (ListPostingsResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*/views/*/accounts/*}/postings"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one posting. (AIP-131)
  rpc GetPosting(GetPostingRequest) returns (Posting) {
    option (google.api.http) = {
      get: "/v1/{name=funds/*/views/*/accounts/*/postings/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists a fund's NAV strikes, newest first. (AIP-132)
  rpc ListNavStrikes(ListNavStrikesRequest) returns (ListNavStrikesResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*/views/*}/navStrikes"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one NAV strike. (AIP-131)
  rpc GetNavStrike(GetNavStrikeRequest) returns (NavStrike) {
    option (google.api.http) = {get: "/v1/{name=funds/*/views/*/navStrikes/*}"};
    option (google.api.method_signature) = "name";
  }

  // Re-derives a strike from the journal and reports whether it reproduced.
  // (AIP-136)
  //
  // A custom method on GET rather than POST, which AIP permits for one that is
  // safe and idempotent: replaying reads a journal prefix and folds it. It
  // writes nothing, and a method that cannot change anything should not need a
  // verb that says it might.
  rpc ReplayNavStrike(ReplayNavStrikeRequest) returns (ReplayNavStrikeResponse) {
    option (google.api.http) = {get: "/v1/{name=funds/*/views/*/navStrikes/*}:replay"};
    option (google.api.method_signature) = "name";
  }

  // Lists the corporate actions announced on this fund. (AIP-132)
  //
  // Announced, NOT applied. An action sits here from the moment somebody tells
  // us about it, and whether it has gone through the book is a field on it —
  // because a list that showed only applied actions would hide precisely the
  // ones a NAV was struck without.
  rpc ListCorporateActions(ListCorporateActionsRequest)
      returns (ListCorporateActionsResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/corporateActions"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one corporate action. (AIP-131)
  rpc GetCorporateAction(GetCorporateActionRequest) returns (CorporateAction) {
    option (google.api.http) = {get: "/v1/{name=funds/*/corporateActions/*}"};
    option (google.api.method_signature) = "name";
  }

  // Gets one change-log entry — a permalink for citing a specific approval in
  // an audit, which is the whole reason the log is addressable. (AIP-131)
  rpc GetChangeLogEntry(GetChangeLogEntryRequest) returns (ChangeLogEntry) {
    option (google.api.http) = {get: "/v1/{name=funds/*/changeLogEntries/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists configuration changes, newest first. (AIP-132)
  rpc ListChangeLogEntries(ListChangeLogEntriesRequest)
      returns (ListChangeLogEntriesResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/changeLogEntries"};
    option (google.api.method_signature) = "parent";
  }
}

// A fund on a valuation date.
message Fund {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Fund"
    pattern: "funds/{fund}"
    singular: "fund"
    plural: "funds"
  };

  // Where a fund is in its NAV day.
  enum State {
    STATE_UNSPECIFIED = 0;

    // Prices have not landed; there is nothing to reconcile yet.
    STATE_AWAITING_PRICES = 1;

    // Open breaks that must be resolved before the NAV can be struck.
    STATE_BLOCKED = 2;

    // Breaks remain, but all of them are explained and within tolerance.
    STATE_IN_REVIEW = 3;

    // Struck and signed off.
    STATE_STRUCK = 4;
  }

  // The resource name: `funds/{fund}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // ISO 4217.
  string currency_code = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  State state = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Debits minus credits. Zero for any book the journal accepted — it is
  // reported as a figure rather than a green tick because it is a proved
  // property of the kernel, not a check that happened to pass.
  //
  // ⭐ AND ON THE FUND RATHER THAN ON THE VIEW, WHICH IS THE CHECK THAT THE
  // LINE BETWEEN THEM IS DRAWN IN THE RIGHT PLACE. A view keeps or drops WHOLE
  // entries and each entry conserves on its own, so every view's difference is
  // the same zero — `Ratio.Views.every_view_conserves`. The two COLUMN totals
  // are not like that: a settlement view folds fewer entries, so its columns
  // are smaller. They live on `View`, and putting them here would have been one
  // figure quietly answering for several.
  string trial_balance_difference = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Facts read off a delivered file that cannot post yet. Non-zero blocks the
  // NAV, exactly as an open break does.
  //
  // ⚠ FUND-LEVEL, because a pending fact has not posted: it is in no view's
  // fold, and it blocks all of them.
  string pending_fact_count = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  int64 entry_count = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Where the fund is in its NAV day, and how many breaks are open — BOTH AS
  // THE DEFAULT VIEW SEES THEM.
  //
  // ⛔ A DELIBERATE TRADE, STATED RATHER THAN HIDDEN. Both are view-dependent,
  // and the honest alternatives were to drop them from `ListFunds` — which
  // would cost the fund rail a call per fund — or to answer for one view
  // without saying which, which is the failure HANDOFF.md already records: the
  // console and the CLI reported different NAVs for one book, neither saying
  // which. So they answer for `default_view`, and `default_view` sits beside
  // them so a client cannot render either without the label to hand.
  State state = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  int64 open_break_count = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration every figure above was produced under.
  string config_digest = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The view `state` and `open_break_count` above answer for, as a view id.
  //
  // ⛔ WITHOUT THIS THOSE TWO FIELDS ARE UNREADABLE. A number that depends on a
  // recognition convention and does not name it is the defect this whole
  // resource split exists to prevent.
  string default_view = 25 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many views this fund declares. Always at least one.
  int64 view_count = 26 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Which lots a sale gives up, as the active configuration declares it.
  //
  // ⛔ ON THE FUND BECAUSE IT IS A TERM OF AN ADMINISTRATION AGREEMENT, not an
  // implementation detail of the engine. The same holding and the same trade
  // produce four different taxable incomes under the four methods, with no
  // figure on the balance sheet moving —
  // `Ratio.Lots.Methods.the_method_decides_the_taxable_gain` — so it belongs
  // beside the figures it decides rather than buried in a configuration screen.
  //
  // ⚠ AND IT IS FUND-LEVEL, NOT PER VIEW, BECAUSE A VIEW OVERRIDES TIMING ONLY.
  // Every view relieves under the same election. They still reach DIFFERENT
  // realized gains, because a settlement view has recognised a different set of
  // open lots when a sale arrives — which is the feature working, not two
  // elections.
  string lot_method = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the configuration DECLARES that method, or merely gets it.
  //
  // ⛔ THE FIELD ABOVE CANNOT CARRY THIS AND MUST NOT BE ASKED TO. A rule set
  // that says nothing about lots is relieved oldest-first by custom, not by
  // election, and the two are indistinguishable once the absence is defaulted
  // away. A client that reports `lot_method` as an agreed term without checking
  // this asserts a decision nobody made — which is what happened.
  bool lot_method_declared = 21 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Days a holding must be held for its gain to be long-term.
  //
  // ⚠ A JURISDICTION'S NUMBER, which is why it is reported rather than assumed
  // to be 365. `Ratio.Lots.Methods.isLongTerm` takes it as a parameter.
  int64 long_term_days = 20 [(google.api.field_behavior) = OUTPUT_ONLY];

  // ⛔ MOVED TO `View`, NOT DELETED, AND RESERVED SO THE NUMBERS CANNOT COME
  // BACK MEANING SOMETHING ELSE. Every one of these depends on WHICH ENTRIES
  // ARE RECOGNISED, so a fund-level answer is an answer for a view it does not
  // name. A reused field number would let an old client read a new figure as an
  // old one, which is the same defect with a wire format in front of it.
  reserved 5, 7, 11, 12, 15, 16, 17, 18, 19, 22, 23, 24;
  reserved "net_asset_value", "open_difference", "total_debit", "total_credit",
    "realized_gain", "basis_relieved", "short_term_gain", "long_term_gain",
    "unclassified_gain", "open_lot_count", "position_count", "nav_strike";
}

// One lens over one journal: which entries it recognises, and the figures that
// follow.
//
// ⭐ A VIEW IS A RECOGNITION PREDICATE, NOT A SECOND BOOK. `Ratio.Views`
// classifies it against the three kinds of label a posting carries — conserved,
// partitioning, measured — and it is none of them: it does not say how much
// value there is or where it sits, it says WHICH ENTRIES ARE IN SCOPE AS OF A
// DAY. So there is one journal, folded more than one way, and no second store
// to keep in step with the first.
message View {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/View"
    pattern: "funds/{fund}/views/{view}"
    singular: "view"
    plural: "views"
  };

  // How a view decides the day it recognises an entry on.
  enum Basis {
    BASIS_UNSPECIFIED = 0;

    // The journal's own order. Consults no date, so it answers over every book
    // ever written — including the ones whose entries carry no trade date.
    //
    // ⛔ THIS IS THE ABSENCE OF AN ELECTION, NOT A SAME-DAY CONVENTION. See
    // `declared` below and `Ratio.Views.nobody_said_is_not_a_settlement_
    // convention`.
    BASIS_RECORDED = 1;

    // The day the trade was struck. Refuses an entry carrying no trade date.
    BASIS_TRADE = 2;

    // The trade date rolled forward `settles_in` open days over `calendar`.
    BASIS_SETTLEMENT = 3;
  }

  // The resource name: `funds/{fund}/views/{view}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  Basis basis = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Open days from trade to settlement. Zero unless `basis` is settlement.
  int64 settles_in = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The calendar the roll skips days on, and how many days it names.
  string calendar = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  int64 holiday_count = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the configuration DECLARES this view, or whether it is the one
  // every book has by default.
  //
  // ⛔ THE SAME FIELD, FOR THE SAME REASON, AS `Fund.lot_method_declared`. A
  // book that says nothing about views has exactly one, recognising entries in
  // the journal's own order — and reporting that as an elected trade-date or
  // same-day-settlement basis asserts a decision nobody made. That is not
  // hypothetical: it is what the console did with the lot method, on three live
  // funds, until the distinction was given a field of its own.
  bool declared = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The last day this view has recognised entries through, `YYYY-MM-DD`. Empty
  // on a recorded-basis view, which does not recognise by date at all.
  string recognised_through = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Entries this view cannot place at all — no trade date, or a configuration
  // that does not declare this view.
  //
  // ⛔ REPORTED, NEVER SILENTLY DROPPED. An entry a view cannot date is a
  // refusal in the sense `Ratio.Valuation.strike_refuses_exactly_when_something_
  // is_unpriced` means it, and hiding it would remove value from a book whose
  // trial balance went on tying.
  int64 unplaceable_entry_count = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as a string. Never a float and never a JSON number: a figure
  // that has been exact all the way through the kernel should not become a
  // double in the last hop to a browser.
  string net_asset_value = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The two column totals of the trial balance, in minor units.
  //
  // ⚠ VIEW-LEVEL, unlike `Fund.trial_balance_difference`. A view that has not
  // recognised a trade has folded neither of its legs, so both columns are
  // smaller — while their DIFFERENCE is the same zero in every view, because
  // conservation is per entry.
  string total_debit = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  string total_credit = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The total unresolved difference across this view's open breaks, in minor
  // units, and how many there are.
  string open_difference = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  int64 open_break_count = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  Fund.State state = 15 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Realized gain since inception, in minor units.
  //
  // ⛔ CREDIT-NORMAL, SO A GAIN READS NEGATIVE. `Ratio.Lots.Posting` has the
  // convention and why. This is the raw figure and a client that prints it
  // unflipped shows every profitable fund with a minus sign.
  //
  // ⚠ AND IT DIFFERS BETWEEN VIEWS EVEN THOUGH THE LOT METHOD DOES NOT. A view
  // overrides timing only, so every view relieves under the same election — but
  // a settlement view has recognised a different set of OPEN LOTS when a sale
  // arrives, so the same election gives up different lots. That is the feature
  // working, and it is the figure with no counterparty.
  string realized_gain = 16 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Cost given up by sales, in minor units.
  string basis_relieved = 17 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The part of `realized_gain` on holdings held less than the fund's
  // threshold, and at least it. Same sign convention as `realized_gain`.
  string short_term_gain = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
  string long_term_gain = 19 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The rest of `realized_gain`: disposals no holding period could be
  // established for. The three parts sum to the total by construction — this
  // one is the remainder.
  string unclassified_gain = 20 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Open tax lots this view holds, and the positions they stand behind.
  //
  // ⛔ THE TWO NUMBERS THE SCALE ARGUMENT IS, side by side.
  // `Ratio.Closure.factored_nav_never_reads_the_lots` says striking a NAV
  // touches the first and not the second.
  int64 open_lot_count = 21 [(google.api.field_behavior) = OUTPUT_ONLY];
  int64 position_count = 22 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How long the fold that strikes this view's NAV took.
  //
  // ⛔ THE MAINTAINED FOLD ONLY — NOT THE COLD BUILD. Two curves, and quoting
  // this one as though it were both is the overclaim `ratio bench` is shaped to
  // make hard.
  google.protobuf.Duration nav_strike = 23 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The journal prefix every figure above was folded from.
  //
  // ⭐ THE SAME NUMBER ON EVERY VIEW OF ONE FUND, AND THAT IS THE POINT. One
  // pass over the journal feeds every view, so a client can put two of them
  // side by side and know the difference is a recognition convention rather
  // than one of them being three entries behind. `//tla:views_check`'s
  // `EveryViewFoldsTheSamePrefix`, and `views_at_two_prefixes_check` is what it
  // looks like when this stops being true.
  int64 journal_position = 24 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One entry that two views disagree about, and what it is worth.
message RecognitionDifference {
  // The journal entry, and what it says it is.
  string entry_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string memo = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // `YYYY-MM-DD`. Empty when the record carries none, which is why a view may
  // be unable to place it.
  string trade_date = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The day each side recognises it on. Empty where that side cannot place it.
  string recognised_here = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string recognised_there = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What recognising it contributes to the NAV, in minor units.
  string net_asset_value_effect = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// How serious an exception is, which is what the queue is ordered by.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;

  // Explained and within tolerance.
  SEVERITY_LOW = 1;

  // Wants a decision, but does not stop the NAV.
  SEVERITY_MEDIUM = 2;

  // Blocks the NAV.
  SEVERITY_HIGH = 3;
}

// One posting behind a break's figure, as the console shows it.
//
// NOT `ratio.v1.Posting` from ledger.proto, which is the kernel's own type: a
// conserved dimension and an integer. That one is what conservation is proved
// about; this one carries the memo and the provenance a person reads. Folding
// them together would drag `dim` into a view that has no use for it and put a
// display concern into the type the proofs are about.
message BreakPosting {
  string entry_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string memo = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as a string.
  string amount = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration in force when this line was posted — which is not
  // necessarily the one active now. A period spanning a change has to show
  // which entry used which.
  string config_digest = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// An unresolved difference on a fund, as the operator works it.
//
// NAMED FOR WHAT IT IS. `ratio.v1.Exception` in recon.proto already means
// something else — a row a shadow run REFUSED to model — and `ratio.v1.Break`
// there is a line in a finished report. This is neither: it is a break that is
// still open, carrying the severity, the explanation state and the postings an
// operator needs to close it. The console labels these "exceptions" on screen
// because that is the desk's word; the contract uses the accountant's.
message Break {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Break"
    pattern: "funds/{fund}/views/{view}/breaks/{break}"
    singular: "break"
    plural: "breaks"
  };

  // The resource name: `funds/{fund}/breaks/{break}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The account this concerns, by its name in the chart.
  string account = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  int64 account_dimension = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  Severity severity = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // True when a person has recorded why this difference is acceptable. An
  // unexplained difference is work; an explained one is a note.
  bool explained = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What is different, in words a fund accountant would use.
  string cause = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as strings.
  string ratio_amount = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  string reported_amount = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  string difference = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The postings that produced Ratio's figure.
  repeated BreakPosting postings = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration that produced Ratio's figure. Without it the figure is
  // not checkable, which is the only thing that makes it worth more than the
  // other one.
  string config_digest = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Whether a person or a model did something.
enum ActorKind {
  ACTOR_KIND_UNSPECIFIED = 0;

  ACTOR_KIND_PERSON = 1;

  // A model. It appears in this log only ever as the author of a DRAFT — the
  // verb that changed the books always has a person on it.
  ACTOR_KIND_MODEL = 2;
}

// Who changed the configuration, and how.
message ChangeLogEntry {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/ChangeLogEntry"
    pattern: "funds/{fund}/changeLogEntries/{change_log_entry}"
    singular: "changeLogEntry"
    plural: "changeLogEntries"
  };

  // The resource name: `funds/{fund}/changeLogEntries/{change_log_entry}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Who did it. A model appears here only as the author of a DRAFT; the verb
  // that changed the books always has a person on it.
  string actor = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  ActorKind actor_kind = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // `approved`, `drafted`, `signed_off`, `accepted`.
  string action = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What the action was about — a rule id, an account name.
  string subject = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  string detail = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration that resulted, or `proposal` for a draft.
  string config_digest = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListFundsRequest {
  // (AIP-158)
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

message ListFundsResponse {
  repeated Fund funds = 1;
  string next_page_token = 2;
}

message GetFundRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
}

message ListViewsRequest {
  // `funds/{fund}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "ratio.fastverk.dev/View"}
  ];
}

message ListViewsResponse {
  repeated View views = 1;

  // The view a client should open when it has no other reason to pick one, as
  // a view id. The same value as `Fund.default_view`.
  string default_view = 2;

  string next_page_token = 3;
}

message GetViewRequest {
  // `funds/{fund}/views/{view}`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "ratio.fastverk.dev/View"}
  ];
}

message ReconcileViewsRequest {
  // `funds/{fund}/views/{view}` — the view being read.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "ratio.fastverk.dev/View"}
  ];

  // The view id to compare it against.
  //
  // ⚠ A QUERY PARAMETER, like `DiffConfigVersions.base`. The resource being
  // read is one view; the other is an argument to the question, not a second
  // subject of it.
  string against = 2 [(google.api.field_behavior) = REQUIRED];
}

message ReconcileViewsResponse {
  // The two views compared, as resource names.
  string name = 1;
  string against = 2;

  // Their net asset values, and this view's minus the other's. Minor units.
  string net_asset_value = 3;
  string against_net_asset_value = 4;
  string difference = 5;

  // The entries this view recognises and the other does not, and the reverse.
  //
  // ⭐ THESE ARE WHY THE DIFFERENCE IS NOT A DISCREPANCY.
  // `Ratio.Views.two_views_differ_by_exactly_what_is_in_flight` — each view is
  // the other plus what the other has not recognised yet, so these two lists
  // account for `difference` exactly, and a client can show the arithmetic
  // rather than assert it.
  repeated RecognitionDifference recognised_here = 6;
  repeated RecognitionDifference recognised_there = 7;

  // Entries NEITHER view can place: no trade date, or a pinned configuration
  // that does not declare one of them.
  //
  // ⛔ SHOWN, NOT OMITTED. These contribute to neither figure, so leaving them
  // out makes a difference look fully explained when it is not — which is the
  // shape of every defect in HANDOFF.md's table.
  repeated RecognitionDifference unplaceable = 8;

  // The journal prefix both sides were folded from. One number, because one
  // pass feeds every view.
  int64 journal_position = 9;
}

message ListBreaksRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // `unexplained` or `blocking`; empty for everything. Deliberately not a
  // general filter expression (AIP-160) — the console offers three chips, and
  // an expression language nothing sends is a surface to get wrong.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ListBreaksResponse {
  repeated Break breaks = 1;
  string next_page_token = 2;
}

message GetBreakRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/FundBreak"
  ];
}

message GetChangeLogEntryRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/ChangeLogEntry"
  ];
}

// A NAV, struck at a point in time and pinned to the journal that produced it.
//
// # What makes this more than a saved number
//
// A strike records the journal POSITION it was taken at and a digest of that
// prefix. Re-deriving it folds the same entries and must produce the identical
// figure — so a replay checks two different things at once:
//
//   * the prefix still hashes the same, meaning history was not rewritten; and
//   * the fold still lands on the same number, meaning the engine is
//     deterministic.
//
// Either failing is serious and they fail differently, which is why `NavReplay`
// reports them separately rather than as one boolean. An append-only journal
// should make the first impossible; saying so is cheaper than assuming it.
message NavStrike {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/NavStrike"
    pattern: "funds/{fund}/views/{view}/navStrikes/{nav_strike}"
    singular: "navStrike"
    plural: "navStrikes"
  };

  // The resource name: `funds/{fund}/views/{view}/navStrikes/{nav_strike}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The view this NAV was struck in, as a view id.
  //
  // ⛔ ON THE STRIKE, AND IT IS WHAT MAKES
  // `Ratio.Period.one_answer_per_view_per_day` mean anything. A valuation point still has ONE answer — per
  // view. Two views striking the same day are two answers to two questions, and
  // neither restates the other; two answers to ONE question is the restatement
  // that theorem refuses. Without this field on the record they are
  // indistinguishable, and the id is derived from the valuation time alone.
  string view = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The valuation point — not the moment the command ran. Those differ whenever
  // a strike is taken late, which is most of the time.
  google.protobuf.Timestamp valuation_time = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Who struck it. A NAV is signed by a person; nothing here strikes itself.
  // Named to match ChangeLogEntry rather than inventing a second word.
  string actor = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many journal entries this NAV folds. The pin.
  int64 journal_position = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // SHA-256 of exactly those entries. What makes a rewritten history visible.
  string journal_digest = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as strings.
  string net_asset_value = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  string trial_balance_difference = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Why this figure cannot be read at face value, if it cannot.
  //
  // ⛔ ON THE STRIKE, NOT BESIDE IT.
  // `Ratio.Period.one_answer_per_view_per_day` refuses
  // restatement — a valuation point has one answer and the first is what
  // somebody was paid on — so a corporate action arriving afterwards CANNOT
  // correct the NAVs it should have been in. The obligation that leaves is to
  // qualify them, and a qualification a caller has to fetch separately is one
  // a caller will render the figure without.
  //
  // Empty means the figure stands on its own.
  repeated string qualification = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration in force at the last entry folded.
  string config_digest = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A corporate action, as announced.
//
// ⛔ ANNOUNCEMENT IS NOT APPLICATION, and this resource exists at the moment we
// are told rather than the moment the book moves. `Ratio.Closure` makes that
// distinction expensive: OPEN actions are the dial that dominates the cost of a
// period end, and actions-ever is not a dial at all.
//
// ⛔ AND AN ACTION IS NOT IDEMPOTENT, which nothing else on this surface can
// say. Marking twice at one price posts nothing, admitting a fact twice writes
// nothing, ingesting a file twice reads nothing — the console retries all of
// them freely. A two-for-one applied twice quadruples the position and the
// trial balance goes on tying. `Ratio.Actions.applying_twice_is_not_applying_
// once`. `applied` is therefore not a status field; it is the idempotence.
message CorporateAction {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/CorporateAction"
    pattern: "funds/{fund}/corporateActions/{corporate_action}"
    singular: "corporateAction"
    plural: "corporateActions"
  };

  // The resource name: `funds/{fund}/corporateActions/{corporate_action}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The instrument it acts on.
  string instrument = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The ratio, as the action declares it: units received for units given up.
  // A 2-for-1 is `numerator: 2, denominator: 1`; a 1-for-10 reverse split is
  // `1` and `10`. Minor units, as strings — proto3 JSON renders int64 that way.
  string numerator = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string denominator = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The same ratio the way a person says it: `2-for-1`. Rendered here rather
  // than in each caller, so two screens cannot disagree about how to say it.
  string form = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The day it takes effect. A NAV struck on or after this day should have
  // included it.
  google.type.Date ex_date = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When we were told — which is NOT when it took effect. An action announced
  // late is the whole reason `NavStrike.qualification` exists.
  google.protobuf.Timestamp announce_time = 7
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether it has gone through the book.
  //
  // Derived from the journal rather than stored beside the announcement: the
  // applied action IS an entry, so a book cannot disagree with itself about
  // whether it happened.
  bool applied = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Where in the journal it landed. Zero when it has not been applied.
  int64 journal_position = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Where the ANNOUNCEMENT sits in the journal. Zero means it does not.
  //
  // ⛔ ZERO IS NOT "UNKNOWN", IT IS "PINNED BY NOTHING". An announcement in the
  // journal is inside the prefix every later strike pins, so a replay
  // re-derives the same figure forever
  // (`Ratio.Actions.Factor.replay_is_determined_by_the_prefix`). One in a side
  // plane — where every book written before that change has them — is pinned by
  // no strike, so under the factor representation a replay reads whatever has
  // arrived since and answers differently.
  //
  // ⚠ Such a book cannot be made retroactively pinnable. The announcements were
  // not in the order, and no rewrite can put them there without changing every
  // digest after the point. Reporting the zero is the only honest option.
  int64 announce_position = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // ⭐ The NAV strikes this action was NOT in — resource names, so a caller can
  // follow them.
  //
  // This is the reverse of `NavStrike.qualification` and the reason the screen
  // is worth having: the strike knows what qualifies it, but only the action
  // knows the full extent of what it disturbed. `Ratio.Period.one_answer_per_
  // day` refuses restatement, so this list can never be emptied by fixing
  // anything — it is the permanent record of what a late arrival cost.
  repeated string qualified_nav_strikes = 10
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The result of re-deriving a strike. Not a resource — nothing stores it;
// it is computed on demand and is only meaningful about the strike it names.
message ReplayNavStrikeResponse {
  // The strike that was replayed.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The journal prefix still hashes to what the strike recorded. False means
  // history was rewritten, which an append-only journal should prevent.
  bool history_intact = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The fold produced the same figures. False means the engine is not
  // deterministic, which is the claim this product is built on.
  bool reproduced = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What the re-derivation actually produced, so a mismatch can be read rather
  // than merely reported.
  string net_asset_value = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string journal_digest = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One version of a fund's configuration.
//
// Content-addressed, so the digest IS the identity: two funds running the same
// rules have the same digest, and a version cannot be edited without becoming a
// different version. That is what makes "the configuration this figure was
// computed under" a citation rather than a label.
message ConfigVersion {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/ConfigVersion"
    pattern: "funds/{fund}/configVersions/{config_version}"
    singular: "configVersion"
    plural: "configVersions"
  };

  // The resource name: `funds/{fund}/configVersions/{config_version}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // SHA-256 of the configuration bytes.
  string digest = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Where it sits in this fund's history. 1 is the first.
  int64 sequence = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // True for the version currently in force.
  bool active = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Who promoted it, and when — from what `ratio approve` recorded. Empty for a
  // version that predates the record rather than guessed at: an audit trail
  // that invents an actor is worse than one that admits a gap.
  string actor = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp approve_time = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // The proposal this came from, if it came from one.
  string subject = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The rules, rendered the way the rules screen shows them.
  repeated string rules = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One rule's fate between two versions.
message RuleChange {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ADDED = 1;
    KIND_REMOVED = 2;
    KIND_CHANGED = 3;
  }

  string rule_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  Kind kind = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How the rule read in each version, rendered. Empty on the side where it did
  // not exist. Named for the versions rather than "before"/"after", which
  // AIP-140 rejects as prepositions and which are ambiguous anyway once a diff
  // can run in either direction.
  string base_form = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string form = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListConfigVersionsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListConfigVersionsResponse {
  repeated ConfigVersion config_versions = 1;
  string next_page_token = 2;
}

message GetConfigVersionRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/ConfigVersion"
  ];
}

message DiffConfigVersionsRequest {
  // The version to diff, which is the AFTER side.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/ConfigVersion"
  ];

  // The digest to compare against. Defaults to the version immediately before
  // `name` in this fund's history, which is the comparison somebody almost
  // always wants and the one it is tedious to look up.
  string base = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DiffConfigVersionsResponse {
  string base_digest = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string digest = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Empty when the two versions hold the same rules — which happens, because a
  // digest changes on any byte and formatting is a byte.
  repeated RuleChange changes = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message Account {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Account"
    pattern: "funds/{fund}/views/{view}/accounts/{account}"
    singular: "account"
    plural: "accounts"
  };

  // What the account is, which fixes which side is normal for it.
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_ASSET = 1;
    TYPE_LIABILITY = 2;
    TYPE_EQUITY = 3;
    TYPE_REVENUE = 4;
    TYPE_EXPENSE = 5;
  }

  // The resource name: `funds/{fund}/accounts/{account}`, where the account id
  // is its dimension. The dimension is what postings carry, so it is the
  // stable id; the display name is a label a chart can revise.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The account dimension postings are keyed by.
  string dimension = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  Type type = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as strings. Debits and credits are reported separately as
  // well as netted, because a netted figure hides gross activity — an account
  // that moved ten million each way is not the same as one that never moved.
  string debit = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  string credit = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Debits minus credits. Signed, and not flipped to the account's normal
  // side: a presentation that always shows a positive number cannot show the
  // case worth seeing.
  string balance = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // True when the balance sits on the side this type calls abnormal — a
  // negative asset, a positive liability. Legal, and usually worth a look.
  bool abnormal = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  string posting_count = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The same account, one row per currency it actually holds.
  //
  // The fields above are ONE figure per account, which means they are
  // translated: an account holding dollars and euros reports their converted
  // sum. That is the right thing for a chart row and it is not the whole
  // truth, because the rate is a judgment and the denominations are a fact.
  //
  // A reader checking a figure needs the fact. `balances_by_dim` folded the
  // currency away entirely and five surfaces printed the result as a trial
  // balance, adding dollars to euros under one label; the fold now carries the
  // currency and every other surface shows the split. This is the console
  // catching up, so that the one screen a customer looks at is not the one
  // that cannot show it.
  //
  // Empty on a single-currency fund: there is nothing a split would add.
  repeated CurrencyTotal currency_totals = 10
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One account's activity in one denomination, before any translation.
//
// This is the untranslated fact underneath `Account.debit`/`credit`, so a
// reader can see what the rate did rather than take the converted figure on
// trust.
message CurrencyTotal {
  // ISO 4217, or empty for a posting that named no currency. Empty is its own
  // group and NOT the fund's currency: for conservation an untyped leg cannot
  // be assumed to be any particular denomination, and quietly labeling it USD
  // is how a mismatch becomes invisible.
  string currency_code = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as strings, in THIS currency — not converted.
  string debit = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string credit = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Debits minus credits, in this currency. Signed, like `Account.balance`.
  string balance = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What this denomination was multiplied by to reach the translated figure,
  // in hundredths. Empty for the fund's own currency, which has no rate fact —
  // a fund does not record what a dollar is worth in dollars.
  string rate = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One line of one entry, as it lands on an account.
message Posting {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Posting"
    pattern: "funds/{fund}/views/{view}/accounts/{account}/postings/{posting}"
    singular: "posting"
    plural: "postings"
  };

  // The resource name. The posting id is the entry id and the leg's position
  // within that entry — one entry may touch the same account twice, and two
  // lines that cannot be told apart cannot be cited.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  string entry_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string memo = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as a string. Signed: a debit is positive.
  string amount = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The account's balance after this line, folding from the start of the
  // journal. This is the audit trail as a running figure rather than a final
  // one — you can see where a balance became what it is.
  string running_balance = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration in force when this line was posted, which is not
  // necessarily the one active now.
  string config_digest = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListAccountsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // `posted` for accounts that have postings on them, `abnormal` for those
  // sitting on the wrong side; empty for the whole chart. Three chips, not an
  // expression language — same reasoning as ListBreaks.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ListAccountsResponse {
  repeated Account accounts = 1;
  string next_page_token = 2;
}

message GetAccountRequest {
  string name = 1 [
