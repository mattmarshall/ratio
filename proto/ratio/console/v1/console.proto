syntax = "proto3";

// The operations console's contract — the backend-for-frontend.
//
// # Why a BFF and not the domain services directly
//
// `Chart` and `Ledger` are the domain: accounts, transactions, a trial
// balance. A fund controller on a NAV day does not think in those terms. They
// think in funds that are blocked or struck, exceptions ordered by money at
// risk, and a deadline. Shaping that in the browser would mean the console
// issuing a fan-out of domain calls and reassembling them — over a link whose
// latency it does not control, in a language where the reassembly is untyped.
//
// So this service is view-shaped on purpose. It is allowed to know what a
// screen needs; the domain services are not allowed to know a screen exists.
//
// # HTTP
//
// Every method carries a `google.api.http` rule, and the transcoder in
// `ratio-console` is generated from nothing — it is written by hand and then
// CHECKED against these annotations by `//crates/ratio-console:transcode_test`,
// which reads the descriptor set this file compiles to. A route that drifts
// from its annotation is a failing build rather than a 404 someone finds.
//
// AIP-idiomatic (aip.dev); lints clean via //proto:ratio_aip_lint. Layout is
// `ratio/console/v1/console.proto` so the path matches the package (AIP-191).
// ⛔ ITS OWN PACKAGE, not `ratio.v1`.
//
// The console is a BFF over a resource hierarchy whose first-class unit is
// `books/…`. `funds/…` is an optional organizational layer for the
// investment case — a view of a fund is not a Book. The kernel contracts are
// also keyed on books. Both APIs need an `Account` and a `Posting`, and they
// are not the same message: the kernel's carry integers and classification,
// the console's carry rendered strings and a running balance. Sharing a
// package made that a protoc error — "ratio.v1.Account is already defined" —
// and the fix is not to rename the console's messages into something they
// are not. It is to say that these are two APIs.
package ratio.console.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";

option java_multiple_files = true;
option java_package = "com.fastverk.ratio.console.v1";
option java_outer_classname = "ConsoleProto";

// What a fund controller works from.
service Console {
  option (google.api.default_host) = "ratio.fastverk.dev";

  // Lists the books this operator may open. (AIP-132)
  //
  // ⭐ A BOOK IS THE THING THAT OWNS A JOURNAL. A fund and a WorkOS
  // organization are optional layers over it, not parents. A personal or
  // project book appears here and not in ListFunds.
  rpc ListBooks(ListBooksRequest) returns (ListBooksResponse) {
    option (google.api.http) = {get: "/v1/books"};
  }

  // Gets one book — the journal, the chart kind, and the optional fund or
  // organization it is filed under. (AIP-131)
  rpc GetBook(GetBookRequest) returns (Book) {
    option (google.api.http) = {get: "/v1/{name=books/*}"};
    option (google.api.method_signature) = "name";
  }

  // Creates a book with no fund and no organization. (AIP-133)
  //
  // ⛔ THE JOURNAL IS THE STORE. This writes a directory of files — a chart,
  // an empty configuration, a sidecar — not a row in a database. The same
  // kernel serves personal finance, investment accounting and project
  // finance; only the chart and the terms change.
  rpc CreateBook(CreateBookRequest) returns (Book) {
    option (google.api.http) = {
      post: "/v1/books"
      body: "book"
    };
    option (google.api.method_signature) = "book,book_id";
  }

  // Lists the funds this operator is responsible for. (AIP-132)
  //
  // ⚠ OPTIONAL LAYER. A fund is a book that is filed as one. Independent
  // books do not appear here — see ListBooks.
  rpc ListFunds(ListFundsRequest) returns (ListFundsResponse) {
    option (google.api.http) = {get: "/v1/funds"};
  }

  // Gets one fund, with the figures that decide whether its NAV can be
  // struck. (AIP-131)
  rpc GetFund(GetFundRequest) returns (Fund) {
    option (google.api.http) = {get: "/v1/{name=funds/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists the views declared on a fund. (AIP-132)
  //
  // ⛔ A FUND ALWAYS HAS AT LEAST ONE, AND A BOOK THAT DECLARES NOTHING HAS
  // EXACTLY ONE. That one recognises entries in the journal's own order, which
  // is what every book has always done — see `View.declared`.
  rpc ListViews(ListViewsRequest) returns (ListViewsResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/views"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one view, with the figures it recognises. (AIP-131)
  rpc GetView(GetViewRequest) returns (View) {
    option (google.api.http) = {get: "/v1/{name=funds/*/views/*}"};
    option (google.api.method_signature) = "name";
  }

  // What two views over one journal disagree about, entry by entry. (AIP-136)
  //
  // GET, like `:replay` and `:diff` above: it folds a journal prefix and writes
  // nothing, so a verb implying mutation would be a lie about a method that
  // cannot.
  //
  // ⭐ THE DIFFERENCE IS A LIST, NOT A DISCREPANCY.
  // `Ratio.Views.two_views_differ_by_exactly_what_is_in_flight` — each view is
  // the other plus the entries the other has not recognised yet. That is what
  // makes this a derivation rather than a reconciliation somebody performs.
  rpc ReconcileViews(ReconcileViewsRequest) returns (ReconcileViewsResponse) {
    option (google.api.http) = {get: "/v1/{name=funds/*/views/*}:reconcile"};

    // ⚠ BOTH, because both are REQUIRED. A signature naming only `name` would
    // generate a binding that cannot be called — there is no second view to
    // compare against — and `client-libraries::4232` says so at lint time.
    option (google.api.method_signature) = "name,against";
  }

  // Billed vs earned, retainage outstanding, and cost by work-package
  // account, for one project book of record. (AIP-136)
  //
  // GET, like `:reconcile`: it folds a journal prefix and writes nothing.
  //
  // ⛔ PROJECT ONLY. Personal and investment books are refused with a
  // sentence, not served a zero that looks like "nothing billed". Unset
  // billed / earned / retainage / phase budget stay empty — not `"0"`.
  // Actual costs of zero on a seeded phase account are real (nothing
  // posted there); an omitted `[project.phase] budget` is not a budget
  // of zero.
  //
  // ⭐ ACCOUNTS, NOT INSTRUMENTS. Work packages are dimensions on
  // `chart_for(Project)`. Tagging a cost with an instrument would open
  // a lot, and a project phase is not a security.
  rpc ProjectProgress(ProjectProgressRequest) returns (ProjectProgressResponse) {
    option (google.api.http) = {get: "/v1/{name=funds/*/views/*}:projectProgress"};
    option (google.api.method_signature) = "name";
  }

  // Lists a fund's open breaks, ordered by money at risk. (AIP-132)
  rpc ListBreaks(ListBreaksRequest) returns (ListBreaksResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*/views/*}/breaks"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one break, with the postings behind Ratio's figure and the
  // configuration that produced it. (AIP-131)
  rpc GetBreak(GetBreakRequest) returns (Break) {
    option (google.api.http) = {get: "/v1/{name=funds/*/views/*/breaks/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists a fund's configuration versions, newest first. (AIP-132)
  rpc ListConfigVersions(ListConfigVersionsRequest)
      returns (ListConfigVersionsResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/configVersions"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one configuration version, with its rules as a person reads them.
  // (AIP-131)
  rpc GetConfigVersion(GetConfigVersionRequest) returns (ConfigVersion) {
    option (google.api.http) = {get: "/v1/{name=funds/*/configVersions/*}"};
    option (google.api.method_signature) = "name";
  }

  // What changed between two configuration versions. (AIP-136)
  //
  // GET, like the replay above: comparing two immutable, content-addressed
  // blobs is safe and idempotent, and a verb that implies mutation would be a
  // lie about a method that cannot.
  rpc DiffConfigVersions(DiffConfigVersionsRequest)
      returns (DiffConfigVersionsResponse) {
    option (google.api.http) = {get: "/v1/{name=funds/*/configVersions/*}:diff"};
    option (google.api.method_signature) = "name";
  }

  // The rules in force, structured. `ConfigVersion.rules` renders them for
  // reading; this is for a caller that has to choose one. (AIP-132)
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/rules"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one rule of the active configuration. (AIP-131)
  rpc GetRule(GetRuleRequest) returns (Rule) {
    option (google.api.http) = {get: "/v1/{name=funds/*/rules/*}"};
    option (google.api.method_signature) = "name";
  }

  // The mapping templates in force. (AIP-132)
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/templates"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one template. (AIP-131)
  rpc GetTemplate(GetTemplateRequest) returns (Template) {
    option (google.api.http) = {get: "/v1/{name=funds/*/templates/*}"};
    option (google.api.method_signature) = "name";
  }

  // Reads a delivered file into facts. (AIP-136)
  //
  // ⛔ A WRITE. Set `validate_only` to see what the template would produce —
  // the facts, what each resolves to, what would pend — without recording
  // anything (AIP-163). The same move as ApplyEvent, and for the same reason:
  // a mapping you have watched run beats a mapping you have to imagine.
  rpc IngestDelivery(IngestDeliveryRequest) returns (IngestDeliveryResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=funds/*}:ingest"
      body: "*"
    };
  }

  // Marks the book to market at a valuation date. (AIP-136)
  //
  // ⛔ A WRITE, and a POSTING rather than an assignment: each position moves by
  // the difference between what the book holds it at and what it is worth, with
  // the contra in unrealized gain. Nothing is overwritten, so "why is this
  // worth more than we paid" has an entry to point at.
  //
  // A position with no price on or before the date is NOT marked at zero. It is
  // reported unpriced, and it blocks — a NAV struck over a position nobody has
  // priced is wrong in a way nobody can see.
  rpc MarkPositions(MarkPositionsRequest) returns (MarkPositionsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=funds/*}:mark"
      body: "*"
    };
  }

  // Posts every fact that fully resolves. (AIP-136)
  //
  // ⛔ A WRITE. The fact becomes an event and the rules already in force decide
  // the entries; nothing here knows how a trade books.
  rpc AdmitFacts(AdmitFactsRequest) returns (AdmitFactsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=funds/*}:admit"
      body: "*"
    };
  }

  // Records an event and returns the entry the active configuration produced
  // from it. (AIP-136)
  //
  // ⛔ THE ONLY METHOD ON THIS SERVICE THAT WRITES.
  //
  // It takes a RULE and an amount, never a set of postings. Which accounts
  // move, and in which direction, is decided by the configuration a person
  // approved — an operator recording a trade is asserting that something
  // happened, not deciding how it is booked. That distinction is the reason
  // this can be a write at all while `approve` stays humans-only at a
  // terminal: recording a fact does not change how any figure is derived.
  //
  // Set `validate_only` to see the entry and the NAV it would produce without
  // writing anything (AIP-163).
  rpc ApplyEvent(ApplyEventRequest) returns (ApplyEventResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=funds/*}:applyEvent"
      body: "*"
    };
  }

  // Every journal entry, in the order the journal holds them. (AIP-132)
  //
  // ⚠ AIP-121 REQUIRES THIS ONCE GetEntry EXISTS. A resource with Get and no
  // List is a citation you cannot walk up from. The list is the journal; the
  // get is one row of it.
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/entries"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one journal entry, with the postings the rule produced. (AIP-131)
  //
  // ⭐ THE CITATION HOP. Every posting names the entry it came from. Without
  // this, that name is an identifier printed as text — the chain the console
  // exists to keep open. The resource pattern stays `funds/{fund}/entries/{entry}`
  // because that is what ApplyEvent already writes; the console URL is
  // `/books/{book}/entries/{entry}`, rewritten like every other book job.
  rpc GetEntry(GetEntryRequest) returns (Entry) {
    option (google.api.http) = {get: "/v1/{name=funds/*/entries/*}"};
    option (google.api.method_signature) = "name";
  }

  // Files received on the data plane, newest first. (AIP-132)
  rpc ListDeliveries(ListDeliveriesRequest) returns (ListDeliveriesResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/deliveries"};
    option (google.api.method_signature) = "parent";
  }

  // Facts read out of those files that cannot post yet, and what blocks each.
  // (AIP-132)
  //
  // These are exceptions in the same sense a reconciliation break is: a figure
  // missing an input is not a figure. They block the NAV for the same reason
  // and appear in the same place.
  rpc ListPendingFacts(ListPendingFactsRequest)
      returns (ListPendingFactsResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/pendingFacts"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one delivery. (AIP-131)
  rpc GetDelivery(GetDeliveryRequest) returns (Delivery) {
    option (google.api.http) = {get: "/v1/{name=funds/*/deliveries/*}"};
    option (google.api.method_signature) = "name";
  }

  // Gets one pending fact. (AIP-131)
  rpc GetPendingFact(GetPendingFactRequest) returns (PendingFact) {
    option (google.api.http) = {get: "/v1/{name=funds/*/pendingFacts/*}"};
    option (google.api.method_signature) = "name";
  }

  // Facts this book has recorded — prices, FX rates, and everything else a
  // template read out of a file. (AIP-132)
  //
  // ⛔ NOT PENDINGFACTS. That collection is the exception queue: facts that
  // cannot post. This one is the fact plane itself. A price or an FX rate
  // never posts; it is cited by a figure, and an operator opens it from that
  // figure rather than only from a CLI dump of facts.jsonl.
  //
  // Corrections are a new row, never an edit of an old one. `Fact.superseded`
  // is derived from append order so both records stay readable.
  rpc ListFacts(ListFactsRequest) returns (ListFactsResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/facts"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one fact, with the delivery, the row, and the config digest the
  // ingest run pinned. (AIP-131)
  rpc GetFact(GetFactRequest) returns (Fact) {
    option (google.api.http) = {get: "/v1/{name=funds/*/facts/*}"};
    option (google.api.method_signature) = "name";
  }

  // What the fund holds, by account and instrument. (AIP-132)
  //
  // ⛔ THE UNATTRIBUTED REMAINDER IS IN THIS LIST, as a position with no
  // instrument. Not a separate field beside it: a caller can render a list
  // without noticing a field, and a positions view that quietly omits what it
  // does not attribute disagrees with the trial balance by exactly the amount
  // it hid. In the list, the rows sum to the accounts by construction.
  rpc ListPositions(ListPositionsRequest) returns (ListPositionsResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*/views/*}/positions"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one position. (AIP-131)
  rpc GetPosition(GetPositionRequest) returns (Position) {
    option (google.api.http) = {get: "/v1/{name=funds/*/views/*/positions/*}"};
    option (google.api.method_signature) = "name";
  }

  // The open tax lots behind one position, oldest first. (AIP-132)
  //
  // ⛔ A SUBCOLLECTION OF THE POSITION, not a screen of its own. A lot is only
  // meaningful as part of the holding it belongs to — `Position.open_lot_count`
  // is the count and this is what it counts — and the nesting is what says so.
  //
  // ⚠ THIS IS THE EXPENSIVE READ ON THIS SERVICE, and deliberately scoped so it
  // stays affordable. A fund's lots are its whole trading HISTORY where its
  // positions are a chart of five hundred lines; asking for one position's lots
  // is bounded by that position, and there is deliberately no way to ask for
  // every lot in the fund at once.
  rpc ListLots(ListLotsRequest) returns (ListLotsResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*/views/*/positions/*}/lots"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one open tax lot. (AIP-131)
  rpc GetLot(GetLotRequest) returns (Lot) {
    option (google.api.http) = {get: "/v1/{name=funds/*/views/*/positions/*/lots/*}"};
    option (google.api.method_signature) = "name";
  }

  // The trial balance: every account in the chart with what it holds.
  // (AIP-132)
  //
  // This is the screen the whole product argues for. A NAV is a fold over
  // these figures, and until you can open one there is no difference between
  // a proved ledger and a confident one.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*/views/*}/accounts"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one account with its balance. (AIP-131)
  rpc GetAccount(GetAccountRequest) returns (Account) {
    option (google.api.http) = {get: "/v1/{name=funds/*/views/*/accounts/*}"};
    option (google.api.method_signature) = "name";
  }

  // Every posting on one account, in the order the journal holds them, each
  // carrying the running balance after it. (AIP-132)
  //
  // The same answer `ratio explain` gives at a terminal. A figure that cannot
  // name the lines behind it is a claim; this is what makes it a derivation.
  rpc ListPostings(ListPostingsRequest) returns (ListPostingsResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*/views/*/accounts/*}/postings"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one posting. (AIP-131)
  rpc GetPosting(GetPostingRequest) returns (Posting) {
    option (google.api.http) = {
      get: "/v1/{name=funds/*/views/*/accounts/*/postings/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists a fund's NAV strikes, newest first. (AIP-132)
  rpc ListNavStrikes(ListNavStrikesRequest) returns (ListNavStrikesResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*/views/*}/navStrikes"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one NAV strike. (AIP-131)
  rpc GetNavStrike(GetNavStrikeRequest) returns (NavStrike) {
    option (google.api.http) = {get: "/v1/{name=funds/*/views/*/navStrikes/*}"};
    option (google.api.method_signature) = "name";
  }

  // Re-derives a strike from the journal and reports whether it reproduced.
  // (AIP-136)
  //
  // A custom method on GET rather than POST, which AIP permits for one that is
  // safe and idempotent: replaying reads a journal prefix and folds it. It
  // writes nothing, and a method that cannot change anything should not need a
  // verb that says it might.
  rpc ReplayNavStrike(ReplayNavStrikeRequest) returns (ReplayNavStrikeResponse) {
    option (google.api.http) = {get: "/v1/{name=funds/*/views/*/navStrikes/*}:replay"};
    option (google.api.method_signature) = "name";
  }

  // What this strike DID, step by step, and what the same question costs off
  // the maintained totals. (AIP-136)
  //
  // ⛔ A DESCRIPTION OF THE TWO PATHS, NOT A PLAN THE ENGINE CHOSE. Nothing in
  // Ratio selects between them: `ratio_nav::strike` folds the journal,
  // `Projection::nav` reads maintained totals, and a caller picks one by calling
  // it. `Ratio.Plan` proves the two agree and is not emitted into Rust at all.
  // Serving this as "the plan" without saying so would put a diagram behind a
  // structure nothing produces — which is the shape of both false premises
  // HANDOFF.md opens with.
  //
  // ⛔ AND IT ANSWERS IN TWO CURRENCIES OF COST THAT MUST NOT BE MIXED. The
  // proved model (`Ratio.Closure`) costs a period end off a projection that is
  // already CURRENT; it has no term for parsing a journal and no theorem about
  // what a fold costs. So a step carries an estimate only where the model or the
  // strike record supplies one, and carries nothing — never zero — elsewhere.
  //
  // ⛔ THIS IS NOT THE "explain" THE CONSOLE DELIBERATELY HAS NO BUTTON FOR.
  // ORCHESTRATION.md: "the console reads and previews, and deliberately has no
  // approve, explain, or strike button." That "explain" is the VERB — accepting
  // an explanation for a break, which is `ratio accept` at a terminal and has no
  // RPC on purpose. This one reads how a recorded NAV was computed and changes
  // nothing. Same word, and the two are one word apart in exactly the way
  // `/scale` is one word from performance attribution, so it is written down
  // here rather than left to be inferred from the absence of a write.
  //
  // A custom method on GET, for the same reason `:replay` is one: it reads.
  //
  // `?analyze=true` re-derives the strike under instrumentation and fills in
  // what the fold actually saw. Opt-in, because a fold is the slowest thing this
  // API does and a page that measured on load would spend a period end's work on
  // somebody who wanted to look at a diagram — the argument `:replay` already
  // makes about asserting a proof rather than offering it.
  rpc ExplainNavStrike(ExplainNavStrikeRequest) returns (ExplainNavStrikeResponse) {
    option (google.api.http) = {get: "/v1/{name=funds/*/views/*/navStrikes/*}:explain"};
    option (google.api.method_signature) = "name";
  }

  // Lists the corporate actions announced on this fund. (AIP-132)
  //
  // Announced, NOT applied. An action sits here from the moment somebody tells
  // us about it, and whether it has gone through the book is a field on it —
  // because a list that showed only applied actions would hide precisely the
  // ones a NAV was struck without.
  rpc ListCorporateActions(ListCorporateActionsRequest)
      returns (ListCorporateActionsResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/corporateActions"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one corporate action. (AIP-131)
  rpc GetCorporateAction(GetCorporateActionRequest) returns (CorporateAction) {
    option (google.api.http) = {get: "/v1/{name=funds/*/corporateActions/*}"};
    option (google.api.method_signature) = "name";
  }

  // Gets one change-log entry — a permalink for citing a specific approval in
  // an audit, which is the whole reason the log is addressable. (AIP-131)
  rpc GetChangeLogEntry(GetChangeLogEntryRequest) returns (ChangeLogEntry) {
    option (google.api.http) = {get: "/v1/{name=funds/*/changeLogEntries/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists configuration changes, newest first. (AIP-132)
  rpc ListChangeLogEntries(ListChangeLogEntriesRequest)
      returns (ListChangeLogEntriesResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/changeLogEntries"};
    option (google.api.method_signature) = "parent";
  }
}

// A journal and its content-addressed configuration.
//
// ⭐ THIS IS THE UNIT THAT OWNS THE BOOKS. The kernel has always treated a
// directory as a book — an append-only journal plus the configuration each
// entry pinned. The control plane used to call that directory a Fund. A fund
// is now an optional filing of a book, and a WorkOS organization is an
// optional tenant around a set of books. Neither is required to create one.
//
// Kind selects the chart and the terms, not a fork of the kernel. Personal
// finance, investment accounting and project finance are one Book with
// different accounts.
message Book {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Book"
    pattern: "books/{book}"
    singular: "book"
    plural: "books"
  };

  // What this book is used for. The kernel is the same; the chart is not.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // Household or personal ledger.
    KIND_PERSONAL = 1;
    // Fund or investment book — the chart `ratio init` has always written.
    KIND_INVESTMENT = 2;
    // A single project: costs (including work-package accounts), WIP,
    // funding, revenue, progress billings, and retainage. Budget vs actual
    // is a configuration total; billed vs earned and retainage are journal
    // figures. They are two screens, not one ledger.
    KIND_PROJECT = 3;
  }

  // The resource name: `books/{book}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  Kind kind = 3 [(google.api.field_behavior) = REQUIRED];

  // ISO 4217. The base the figures are labelled in.
  string currency_code = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional fund this book is filed under, as `funds/{fund}`. Empty when
  // the book is independent.
  string fund = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional WorkOS organization id. Empty when the book is not in an org.
  // Membership still grants the book by subject; this field only says whether
  // an org layer was recorded.
  string organization = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  string default_view = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  int64 entry_count = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  string config_digest = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Debits minus credits — the same zero in every view.
  string trial_balance_difference = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Authorized spend, minor units. Filled from `[personal] budget` or
  // `[project] budget` depending on kind. Empty when this book has no
  // matching table in the configuration in force — including every
  // investment book, and a household or project nobody has set a
  // baseline on.
  //
  // ⛔ A CONFIGURATION TOTAL, NOT A SECOND LEDGER. Actuals are the trial
  // balance. The figure page compares them. `0` is a set baseline of
  // nothing; empty is unset.
  string budget = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Per-category household envelopes from `[personal.envelope]`. Keyed by
  // chart dimension. Personal-only; unset categories are omitted, not
  // sent as `"0"`.
  repeated HouseholdEnvelope envelopes = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Declared loan schedules from `[personal.loan]`, keyed by liability
  // chart dimension with the paired interest-expense dimension as the
  // value. Empty when this book has no such table — including every
  // investment and project book, and a household nobody has named a loan
  // on. CreateBook seeds the posting pattern and does not invent a
  // schedule.
  //
  // ⛔ EMPTY IS UNSET, NOT A ROLL-FORWARD OF ZEROS. A silent zero here
  // would put a mortgage of nothing on a book that never declared one.
  //
  // ⚠ Field 13: budget is 11, envelopes 12. This must not collide.
  repeated LoanSchedule loans = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One declared household envelope. Absent from `Book.envelopes` when that
// category has no `[personal.envelope]` entry — not a fake zero.
message HouseholdEnvelope {
  // Chart dimension as decimal. Living expenses is `10`, taxes `11`.
  string dimension = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Minor units. Never empty on this message — unset envelopes are omitted.
  string budget = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One declared household loan. Absent from `Book.loans` when that
// liability has no `[personal.loan]` entry — not a fake zero.
message LoanSchedule {
  // Liability chart dimension as decimal. Seeded mortgage is `41`,
  // auto loan `42`, student loan `43`.
  string dimension = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Interest-expense chart dimension as decimal. Seeded mortgage
  // interest is `12`, auto `13`, student `14`.
  string interest = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListBooksRequest {
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

message ListBooksResponse {
  repeated Book books = 1;
  string next_page_token = 2;
}

message GetBookRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Book"
  ];
}

message CreateBookRequest {
  // The book to create. Only `display_name` and `kind` are taken as input.
  Book book = 1 [(google.api.field_behavior) = REQUIRED];
  // Caller-chosen id. Becomes `books/{book_id}`.
  string book_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// A fund on a valuation date.
message Fund {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Fund"
    pattern: "funds/{fund}"
    singular: "fund"
    plural: "funds"
  };

  // Where a fund is in its NAV day.
  enum State {
    STATE_UNSPECIFIED = 0;

    // Prices have not landed; there is nothing to reconcile yet.
    STATE_AWAITING_PRICES = 1;

    // Open breaks that must be resolved before the NAV can be struck.
    STATE_BLOCKED = 2;

    // Breaks remain, but all of them are explained and within tolerance.
    STATE_IN_REVIEW = 3;

    // Struck and signed off.
    STATE_STRUCK = 4;
  }

  // The resource name: `funds/{fund}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // ISO 4217.
  string currency_code = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Debits minus credits. Zero for any book the journal accepted — it is
  // reported as a figure rather than a green tick because it is a proved
  // property of the kernel, not a check that happened to pass.
  //
  // ⭐ AND ON THE FUND RATHER THAN ON THE VIEW, WHICH IS THE CHECK THAT THE
  // LINE BETWEEN THEM IS DRAWN IN THE RIGHT PLACE. A view keeps or drops WHOLE
  // entries and each entry conserves on its own, so every view's difference is
  // the same zero — `Ratio.Views.every_view_conserves`. The two COLUMN totals
  // are not like that: a settlement view folds fewer entries, so its columns
  // are smaller. They live on `View`, and putting them here would have been one
  // figure quietly answering for several.
  string trial_balance_difference = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Facts read off a delivered file that cannot post yet. Non-zero blocks the
  // NAV, exactly as an open break does.
  //
  // ⚠ FUND-LEVEL, because a pending fact has not posted: it is in no view's
  // fold, and it blocks all of them.
  string pending_fact_count = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  int64 entry_count = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Where the fund is in its NAV day, and how many breaks are open — BOTH AS
  // THE DEFAULT VIEW SEES THEM.
  //
  // ⛔ A DELIBERATE TRADE, STATED RATHER THAN HIDDEN. Both are view-dependent,
  // and the honest alternatives were to drop them from `ListFunds` — which
  // would cost the fund rail a call per fund — or to answer for one view
  // without saying which, which is the failure HANDOFF.md already records: the
  // console and the CLI reported different NAVs for one book, neither saying
  // which. So they answer for `default_view`, and `default_view` sits beside
  // them so a client cannot render either without the label to hand.
  State state = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  int64 open_break_count = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration every figure above was produced under.
  string config_digest = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The view `state` and `open_break_count` above answer for, as a view id.
  //
  // ⛔ WITHOUT THIS THOSE TWO FIELDS ARE UNREADABLE. A number that depends on a
  // recognition convention and does not name it is the defect this whole
  // resource split exists to prevent.
  string default_view = 25 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many views this fund declares. Always at least one.
  int64 view_count = 26 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Which lots a sale gives up, as the active configuration declares it.
  //
  // ⛔ ON THE FUND BECAUSE IT IS A TERM OF AN ADMINISTRATION AGREEMENT, not an
  // implementation detail of the engine. The same holding and the same trade
  // produce four different taxable incomes under the four methods, with no
  // figure on the balance sheet moving —
  // `Ratio.Lots.Methods.the_method_decides_the_taxable_gain` — so it belongs
  // beside the figures it decides rather than buried in a configuration screen.
  //
  // ⚠ AND IT IS FUND-LEVEL, NOT PER VIEW, BECAUSE A VIEW OVERRIDES TIMING ONLY.
  // Every view relieves under the same election. They still reach DIFFERENT
  // realized gains, because a settlement view has recognised a different set of
  // open lots when a sale arrives — which is the feature working, not two
  // elections.
  string lot_method = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the configuration DECLARES that method, or merely gets it.
  //
  // ⛔ THE FIELD ABOVE CANNOT CARRY THIS AND MUST NOT BE ASKED TO. A rule set
  // that says nothing about lots is relieved oldest-first by custom, not by
  // election, and the two are indistinguishable once the absence is defaulted
  // away. A client that reports `lot_method` as an agreed term without checking
  // this asserts a decision nobody made — which is what happened.
  bool lot_method_declared = 21 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Days a holding must be held for its gain to be long-term.
  //
  // ⚠ A JURISDICTION'S NUMBER, which is why it is reported rather than assumed
  // to be 365. `Ratio.Lots.Methods.isLongTerm` takes it as a parameter.
  int64 long_term_days = 20 [(google.api.field_behavior) = OUTPUT_ONLY];

  // ⛔ MOVED TO `View`, NOT DELETED, AND RESERVED SO THE NUMBERS CANNOT COME
  // BACK MEANING SOMETHING ELSE. Every one of these depends on WHICH ENTRIES
  // ARE RECOGNISED, so a fund-level answer is an answer for a view it does not
  // name. A reused field number would let an old client read a new figure as an
  // old one, which is the same defect with a wire format in front of it.
  reserved 5, 7, 11, 12, 15, 16, 17, 18, 19, 22, 23, 24;
  reserved "net_asset_value", "open_difference", "total_debit", "total_credit",
    "realized_gain", "basis_relieved", "short_term_gain", "long_term_gain",
    "unclassified_gain", "open_lot_count", "position_count", "nav_strike";
}

// One lens over one journal: which entries it recognises, and the figures that
// follow.
//
// ⭐ A VIEW IS A RECOGNITION PREDICATE, NOT A SECOND BOOK. `Ratio.Views`
// classifies it against the three kinds of label a posting carries — conserved,
// partitioning, measured — and it is none of them: it does not say how much
// value there is or where it sits, it says WHICH ENTRIES ARE IN SCOPE AS OF A
// DAY. So there is one journal, folded more than one way, and no second store
// to keep in step with the first.
message View {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/View"
    pattern: "funds/{fund}/views/{view}"
    singular: "view"
    plural: "views"
  };

  // How a view decides the day it recognises an entry on.
  enum Basis {
    BASIS_UNSPECIFIED = 0;

    // The journal's own order. Consults no date, so it answers over every book
    // ever written — including the ones whose entries carry no trade date.
    //
    // ⛔ THIS IS THE ABSENCE OF AN ELECTION, NOT A SAME-DAY CONVENTION. See
    // `declared` below and `Ratio.Views.nobody_said_is_not_a_settlement_
    // convention`.
    BASIS_RECORDED = 1;

    // The day the trade was struck. Refuses an entry carrying no trade date.
    BASIS_TRADE = 2;

    // The trade date rolled forward `settlement_open_days` over `calendar`.
    BASIS_SETTLEMENT = 3;
  }

  // The resource name: `funds/{fund}/views/{view}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  Basis basis = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Open days from trade to settlement. Zero unless `basis` is settlement.
  //
  // ⚠ SPELLED `settles_in` IN THE CONFIGURATION, which is the word a person
  // writing a TOML wants; AIP-140 refuses a preposition in a wire field name,
  // so the contract spells the same number out. `ratio-rules` owns the former
  // and neither name is a second source of truth for the other.
  int64 settlement_open_days = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The calendar the roll skips days on, and how many days it names.
  string calendar = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  int64 holiday_count = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the configuration DECLARES this view, or whether it is the one
  // every book has by default.
  //
  // ⛔ THE SAME FIELD, FOR THE SAME REASON, AS `Fund.lot_method_declared`. A
  // book that says nothing about views has exactly one, recognising entries in
  // the journal's own order — and reporting that as an elected trade-date or
  // same-day-settlement basis asserts a decision nobody made. That is not
  // hypothetical: it is what the console did with the lot method, on three live
  // funds, until the distinction was given a field of its own.
  bool declared = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The last day this view has recognised entries through. Absent on a
  // recorded-basis view, which does not recognise by date at all — and absent
  // is the honest answer there, not the epoch.
  google.type.Date recognised_through = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Entries this view cannot place at all — no trade date, or a configuration
  // that does not declare this view.
  //
  // ⛔ REPORTED, NEVER SILENTLY DROPPED. An entry a view cannot date is a
  // refusal in the sense `Ratio.Valuation.strike_refuses_exactly_when_something_
  // is_unpriced` means it, and hiding it would remove value from a book whose
  // trial balance went on tying.
  int64 unplaceable_entry_count = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as a string. Never a float and never a JSON number: a figure
  // that has been exact all the way through the kernel should not become a
  // double in the last hop to a browser.
  string net_asset_value = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The two column totals of the trial balance, in minor units.
  //
  // ⚠ VIEW-LEVEL, unlike `Fund.trial_balance_difference`. A view that has not
  // recognised a trade has folded neither of its legs, so both columns are
  // smaller — while their DIFFERENCE is the same zero in every view, because
  // conservation is per entry.
  string total_debit = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  string total_credit = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The total unresolved difference across this view's open breaks, in minor
  // units, and how many there are.
  string open_difference = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  int64 open_break_count = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  Fund.State state = 15 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Realized gain since inception, in minor units.
  //
  // ⛔ CREDIT-NORMAL, SO A GAIN READS NEGATIVE. `Ratio.Lots.Posting` has the
  // convention and why. This is the raw figure and a client that prints it
  // unflipped shows every profitable fund with a minus sign.
  //
  // ⚠ AND IT DIFFERS BETWEEN VIEWS EVEN THOUGH THE LOT METHOD DOES NOT. A view
  // overrides timing only, so every view relieves under the same election — but
  // a settlement view has recognised a different set of OPEN LOTS when a sale
  // arrives, so the same election gives up different lots. That is the feature
  // working, and it is the figure with no counterparty.
  string realized_gain = 16 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Cost given up by sales, in minor units.
  string basis_relieved = 17 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The part of `realized_gain` on holdings held less than the fund's
  // threshold, and at least it. Same sign convention as `realized_gain`.
  string short_term_gain = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
  string long_term_gain = 19 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The rest of `realized_gain`: disposals no holding period could be
  // established for. The three parts sum to the total by construction — this
  // one is the remainder.
  string unclassified_gain = 20 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Open tax lots this view holds, and the positions they stand behind.
  //
  // ⛔ THE TWO NUMBERS THE SCALE ARGUMENT IS, side by side.
  // `Ratio.Closure.factored_nav_never_reads_the_lots` says striking a NAV
  // touches the first and not the second.
  int64 open_lot_count = 21 [(google.api.field_behavior) = OUTPUT_ONLY];
  int64 position_count = 22 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How long the fold that strikes this view's NAV took.
  //
  // ⛔ THE MAINTAINED FOLD ONLY — NOT THE COLD BUILD. Two curves, and quoting
  // this one as though it were both is the overclaim `ratio bench` is shaped to
  // make hard.
  google.protobuf.Duration nav_strike = 23 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The journal prefix every figure above was folded from.
  //
  // ⭐ THE SAME NUMBER ON EVERY VIEW OF ONE FUND, AND THAT IS THE POINT. One
  // pass over the journal feeds every view, so a client can put two of them
  // side by side and know the difference is a recognition convention rather
  // than one of them being three entries behind. `//tla:views_check`'s
  // `EveryViewFoldsTheSamePrefix`, and `views_at_two_prefixes_check` is what it
  // looks like when this stops being true.
  int64 journal_position = 24 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One entry that two views disagree about, and what it is worth.
message RecognitionDifference {
  // The journal entry, and what it says it is.
  string entry_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string memo = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Absent when the record carries none, which is why a view may be unable to
  // place it.
  //
  // ⚠ A DATE, NOT A TIMESTAMP, for the reason `Mark.price_date` is: a trade
  // date that moves by a day depending on where the reader is sitting is a
  // different trade date. Absent and "1970-01-01" must not be the same value.
  google.type.Date trade_date = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The day each side recognises it on. Absent where that side cannot place it.
  google.type.Date recognised_here = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.type.Date recognised_there = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What this entry contributes to `ReconcileViewsResponse.difference`, in
  // minor units.
  //
  // ⛔ TO THE DIFFERENCE, NOT TO EITHER NAV, and the sign follows from which
  // list it is in. An entry only the read view recognises adds its own effect;
  // one only the other view recognises subtracts it. So the two lists sum to
  // `difference` by construction and a client can render the arithmetic rather
  // than assert it — which is the whole reason this is a list and not a number.
  string net_asset_value_effect = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// How serious an exception is, which is what the queue is ordered by.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;

  // Explained and within tolerance.
  SEVERITY_LOW = 1;

  // Wants a decision, but does not stop the NAV.
  SEVERITY_MEDIUM = 2;

  // Blocks the NAV.
  SEVERITY_HIGH = 3;
}

// One posting behind a break's figure, as the console shows it.
//
// NOT `ratio.v1.Posting` from ledger.proto, which is the kernel's own type: a
// conserved dimension and an integer. That one is what conservation is proved
// about; this one carries the memo and the provenance a person reads. Folding
// them together would drag `dim` into a view that has no use for it and put a
// display concern into the type the proofs are about.
message BreakPosting {
  string entry_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string memo = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as a string.
  string amount = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration in force when this line was posted — which is not
  // necessarily the one active now. A period spanning a change has to show
  // which entry used which.
  string config_digest = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// An unresolved difference on a fund, as the operator works it.
//
// NAMED FOR WHAT IT IS. `ratio.v1.Exception` in recon.proto already means
// something else — a row a shadow run REFUSED to model — and `ratio.v1.Break`
// there is a line in a finished report. This is neither: it is a break that is
// still open, carrying the severity, the explanation state and the postings an
// operator needs to close it. The console labels these "exceptions" on screen
// because that is the desk's word; the contract uses the accountant's.
message Break {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Break"
    pattern: "funds/{fund}/views/{view}/breaks/{break}"
    singular: "break"
    plural: "breaks"
  };

  // The resource name: `funds/{fund}/breaks/{break}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The account this concerns, by its name in the chart.
  string account = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  int64 account_dimension = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  Severity severity = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // True when a person has recorded why this difference is acceptable, AND
  // that explanation is still current. An unexplained difference is work; an
  // explained one is a note.
  //
  // DERIVED, NOT STORED. An explanation is a claim about a FIGURE — "the
  // 2,000.00 is the custodian's unsettled dividend" — so it holds exactly as
  // long as the figure it was written about. A reconciliation that moves the
  // difference retires it, with nothing to remember to invalidate. See
  // `explanation.qualification` for the one that moved.
  bool explained = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What is different, in words a fund accountant would use.
  string cause = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as strings.
  string ratio_amount = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  string reported_amount = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  string difference = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The postings that produced Ratio's figure.
  repeated BreakPosting postings = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration that produced Ratio's figure. Without it the figure is
  // not checkable, which is the only thing that makes it worth more than the
  // other one.
  string config_digest = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The bounds this break's severity was graded against.
  //
  // ON THE BREAK, NOT BESIDE IT, for the reason `NavStrike.qualification`
  // gives: a grade whose terms a caller has to go and look up is a grade a
  // caller takes on trust. Absent on a break the tolerance did not decide —
  // a lot break, which is graded by what it means rather than by how much.
  Tolerance tolerance = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What somebody recorded about this difference, current or not.
  //
  // Present even when stale, because a stale explanation is evidence: it says
  // what a person believed, when, and about which figure. Absent when nobody
  // has explained it.
  BreakExplanation explanation = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Why a person decided a difference was acceptable.
//
// A PERSON'S VERB, RECORDED. A model may draft the words — that is what
// ORCHESTRATION.md calls the explanation disposition — but the act of accepting
// one has a name on it, and that name comes from the authenticated subject
// rather than from anything the caller sent. There is no RPC that writes this:
// acceptance is `ratio accept` at a terminal, for the same reason approval is
// `ratio approve` at a terminal.
message BreakExplanation {
  // What was written.
  string text = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Who accepted it. Named to match `ChangeLogEntry.actor` and
  // `NavStrike.actor` rather than inventing a second word for the same idea.
  string actor = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp accept_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The difference this was written about, in minor units.
  //
  // THE CURRENCY TEST, AND THE REASON THERE IS NO STATE MACHINE. An
  // explanation is a claim about a figure; when a later reconciliation reports
  // a different one, the claim is about something that is no longer there.
  string difference = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration the explained break was graded under. The other half of
  // the currency test: the same number under different terms is a different
  // statement.
  string config_digest = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How much of the journal the accepter had in front of them.
  //
  // AUDIT, NOT CURRENCY. These say what somebody was looking at; they
  // deliberately do NOT decide whether the explanation still holds. Pinning
  // currency to the journal prefix would retire every explanation on the next
  // posting, which on a NAV morning is a gate nobody can ever clear —
  // `//tla:explanation_pinned_to_the_prefix_check` is that design, model
  // checked, deadlocking.
  int64 journal_position = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  string journal_digest = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Empty when the explanation still stands. Otherwise what moved.
  //
  // ON THE EXPLANATION, NOT BESIDE IT — `NavStrike.qualification`'s argument.
  // A reader who is shown the words without being shown that the figure has
  // changed underneath them is being told something that was true last week.
  repeated string qualification = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// How big a difference has to be before it stops the NAV.
//
// A TERM OF AN ADMINISTRATION AGREEMENT, which is why it travels with the
// break rather than being a property of the software: two funds looking at the
// same difference disagree about whether it matters, and both are right.
// `Ratio.Tolerance` is the proof side, and the boundary is inclusive — a
// difference of exactly `blocks_nav` blocks.
message Tolerance {
  // Minor units, as strings.
  string below_notice = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string blocks_nav = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the configuration DECLARES these bounds, or merely gets them.
  //
  // A rule set that says nothing about tolerance is graded at 5.00 and
  // 1,000.00 by custom, not by election, and the two are different facts. The
  // same distinction `lot_method_declared` keeps, after a screen reported the
  // default as a term of the agreement on funds that had agreed nothing.
  bool declared = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Whether a person or a model did something.
enum ActorKind {
  ACTOR_KIND_UNSPECIFIED = 0;

  ACTOR_KIND_PERSON = 1;

  // A model. It appears in this log only ever as the author of a DRAFT — the
  // verb that changed the books always has a person on it.
  ACTOR_KIND_MODEL = 2;
}

// Who changed the configuration, and how.
message ChangeLogEntry {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/ChangeLogEntry"
    pattern: "funds/{fund}/changeLogEntries/{change_log_entry}"
    singular: "changeLogEntry"
    plural: "changeLogEntries"
  };

  // The resource name: `funds/{fund}/changeLogEntries/{change_log_entry}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Who did it. A model appears here only as the author of a DRAFT; the verb
  // that changed the books always has a person on it.
  string actor = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  ActorKind actor_kind = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // `approved`, `drafted`, `signed_off`, `accepted`.
  string action = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What the action was about — a rule id, an account name.
  string subject = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  string detail = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration that resulted, or `proposal` for a draft.
  string config_digest = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListFundsRequest {
  // (AIP-158)
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

message ListFundsResponse {
  repeated Fund funds = 1;
  string next_page_token = 2;
}

message GetFundRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
}

message ListViewsRequest {
  // `funds/{fund}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// ⚠ NO `default_view` HERE, THOUGH THE CONSOLE WANTS ONE. AIP-132 admits only
// the resource list, `next_page_token`, `total_size` and `unreachable` in a
// List response, and `Fund.default_view` already carries it — a second copy on
// the collection is a second thing to keep in step with the first, which is the
// whole argument views are one journal and not two books.
message ListViewsResponse {
  repeated View views = 1;
  string next_page_token = 2;
}

message GetViewRequest {
  // `funds/{fund}/views/{view}`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/View"
  ];
}

message ReconcileViewsRequest {
  // `funds/{fund}/views/{view}` — the view being read.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/View"
  ];

  // The view id to compare it against.
  //
  // ⚠ A QUERY PARAMETER, like `DiffConfigVersions.base`. The resource being
  // read is one view; the other is an argument to the question, not a second
  // subject of it.
  string against = 2 [(google.api.field_behavior) = REQUIRED];
}

message ReconcileViewsResponse {
  // The two views compared, as resource names.
  string name = 1;
  string against = 2;

  // Their net asset values, and this view's minus the other's. Minor units.
  string net_asset_value = 3;
  string against_net_asset_value = 4;
  string difference = 5;

  // The entries this view recognises and the other does not, and the reverse.
  //
  // ⭐ THESE ARE WHY THE DIFFERENCE IS NOT A DISCREPANCY.
  // `Ratio.Views.two_views_differ_by_exactly_what_is_in_flight` — each view is
  // the other plus what the other has not recognised yet, so these two lists
  // account for `difference` exactly, and a client can show the arithmetic
  // rather than assert it.
  repeated RecognitionDifference recognised_here = 6;
  repeated RecognitionDifference recognised_there = 7;

  // Entries NEITHER view can place: no trade date, or a pinned configuration
  // that does not declare one of them.
  //
  // ⛔ SHOWN, NOT OMITTED. These contribute to neither figure, so leaving them
  // out makes a difference look fully explained when it is not — which is the
  // shape of every defect in HANDOFF.md's table.
  repeated RecognitionDifference unplaceable = 8;

  // The journal prefix both sides were folded from. One number, because one
  // pass feeds every view.
  int64 journal_position = 9;
}

message ProjectProgressRequest {
  // `funds/{fund}/views/{view}` — the book of record the figures fold.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/View"
  ];
}

// Billed vs earned, retainage, and cost by work-package account.
//
// ⚠ NAMED FOR THE METHOD. AIP-136 wants `<Rpc>Response` or the resource;
// there is no ProjectProgress resource — these are figures folded off the
// view's trial balance and the configuration it pins.
message ProjectProgressResponse {
  // The view these figures fold, as `funds/{fund}/views/{view}`.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Credit of Progress billings, minor units. Empty when that account has
  // never been posted to — not `"0"`, which would claim a billing cycle
  // that has not started.
  string billed = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Credit of Project revenue, minor units. Empty when revenue has never
  // been posted. Independent of `billed`: progress-bill credits billings,
  // earn-progress credits revenue, and the two can diverge.
  string earned = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // `billed − earned`. Empty when either side is unset, so a book that
  // has only billed (or only earned) does not look fully caught up.
  string billed_minus_earned = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Retainage receivable balance (debit-normal). Empty until a hold posts.
  string retainage_receivable = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Retainage payable outstanding, credit-normal (the credit of that
  // liability). Empty until a vendor hold posts. Contractor and owner
  // sides are two accounts, not one netted figure.
  string retainage_payable = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Expense accounts on this chart — the work-package grain. Cost is the
  // trial-balance balance (zero when nothing posted is a true zero).
  // Budget is empty when `[project.phase]` omits that account.
  repeated PhaseCost phases = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Cost (and optional authorized spend) on one work-package account.
message PhaseCost {
  // Chart dimension, as a decimal string so it matches `Account.dimension`.
  string account = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Minor units, debit-normal. A seeded phase with no postings is `"0"`.
  string cost = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Authorized spend for this account, minor units. Empty when unset.
  // ⛔ `"0"` IS A SET BASELINE OF NOTHING; empty is no baseline.
  string budget = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListBreaksRequest {
  // ⛔ A VIEW, NOT A FUND. Which breaks are open depends on which entries are
  // recognised, so the collection hangs off the view — and `core::0127` refuses
  // a `funds/*/views/*` URL whose `parent` claims to name a `Fund`, which is
  // exactly the confusion it would be if this said `Fund`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/View"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // `unexplained` or `blocking`; empty for everything. Deliberately not a
  // general filter expression (AIP-160) — the console offers three chips, and
  // an expression language nothing sends is a surface to get wrong.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ListBreaksResponse {
  repeated Break breaks = 1;
  string next_page_token = 2;
}

message GetBreakRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/FundBreak"
  ];
}

message GetChangeLogEntryRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/ChangeLogEntry"
  ];
}

// A NAV, struck at a point in time and pinned to the journal that produced it.
//
// # What makes this more than a saved number
//
// A strike records the journal POSITION it was taken at and a digest of that
// prefix. Re-deriving it folds the same entries and must produce the identical
// figure — so a replay checks two different things at once:
//
//   * the prefix still hashes the same, meaning history was not rewritten; and
//   * the fold still lands on the same number, meaning the engine is
//     deterministic.
//
// Either failing is serious and they fail differently, which is why `NavReplay`
// reports them separately rather than as one boolean. An append-only journal
// should make the first impossible; saying so is cheaper than assuming it.
message NavStrike {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/NavStrike"
    pattern: "funds/{fund}/views/{view}/navStrikes/{nav_strike}"
    singular: "navStrike"
    plural: "navStrikes"
  };

  // The resource name: `funds/{fund}/views/{view}/navStrikes/{nav_strike}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The view this NAV was struck in, as a view id.
  //
  // ⛔ ON THE STRIKE, AND IT IS WHAT MAKES
  // `Ratio.Period.one_answer_per_view_per_day` mean anything. A valuation point still has ONE answer — per
  // view. Two views striking the same day are two answers to two questions, and
  // neither restates the other; two answers to ONE question is the restatement
  // that theorem refuses. Without this field on the record they are
  // indistinguishable, and the id is derived from the valuation time alone.
  string view = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The valuation point — not the moment the command ran. Those differ whenever
  // a strike is taken late, which is most of the time.
  google.protobuf.Timestamp valuation_time = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Who struck it. A NAV is signed by a person; nothing here strikes itself.
  // Named to match ChangeLogEntry rather than inventing a second word.
  string actor = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many journal entries this NAV folds. The pin.
  int64 journal_position = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // SHA-256 of exactly those entries. What makes a rewritten history visible.
  string journal_digest = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as strings.
  string net_asset_value = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  string trial_balance_difference = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Why this figure cannot be read at face value, if it cannot.
  //
  // ⛔ ON THE STRIKE, NOT BESIDE IT.
  // `Ratio.Period.one_answer_per_view_per_day` refuses
  // restatement — a valuation point has one answer and the first is what
  // somebody was paid on — so a corporate action arriving afterwards CANNOT
  // correct the NAVs it should have been in. The obligation that leaves is to
  // qualify them, and a qualification a caller has to fetch separately is one
  // a caller will render the figure without.
  //
  // Empty means the figure stands on its own.
  repeated string qualification = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration in force at the last entry folded.
  string config_digest = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A corporate action, as announced.
//
// ⛔ ANNOUNCEMENT IS NOT APPLICATION, and this resource exists at the moment we
// are told rather than the moment the book moves. `Ratio.Closure` makes that
// distinction expensive: OPEN actions are the dial that dominates the cost of a
// period end, and actions-ever is not a dial at all.
//
// ⛔ AND AN ACTION IS NOT IDEMPOTENT, which nothing else on this surface can
// say. Marking twice at one price posts nothing, admitting a fact twice writes
// nothing, ingesting a file twice reads nothing — the console retries all of
// them freely. A two-for-one applied twice quadruples the position and the
// trial balance goes on tying. `Ratio.Actions.applying_twice_is_not_applying_
// once`. `applied` is therefore not a status field; it is the idempotence.
message CorporateAction {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/CorporateAction"
    pattern: "funds/{fund}/corporateActions/{corporate_action}"
    singular: "corporateAction"
    plural: "corporateActions"
  };

  // The resource name: `funds/{fund}/corporateActions/{corporate_action}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The instrument it acts on.
  string instrument = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The ratio, as the action declares it: units received for units given up.
  // A 2-for-1 is `numerator: 2, denominator: 1`; a 1-for-10 reverse split is
  // `1` and `10`. Minor units, as strings — proto3 JSON renders int64 that way.
  string numerator = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string denominator = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The same ratio the way a person says it: `2-for-1`. Rendered here rather
  // than in each caller, so two screens cannot disagree about how to say it.
  string form = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The day it takes effect. A NAV struck on or after this day should have
  // included it.
  google.type.Date ex_date = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When we were told — which is NOT when it took effect. An action announced
  // late is the whole reason `NavStrike.qualification` exists.
  google.protobuf.Timestamp announce_time = 7
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether it has gone through the book.
  //
  // Derived from the journal rather than stored beside the announcement: the
  // applied action IS an entry, so a book cannot disagree with itself about
  // whether it happened.
  bool applied = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Where in the journal it landed. Zero when it has not been applied.
  int64 journal_position = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Where the ANNOUNCEMENT sits in the journal. Zero means it does not.
  //
  // ⛔ ZERO IS NOT "UNKNOWN", IT IS "PINNED BY NOTHING". An announcement in the
  // journal is inside the prefix every later strike pins, so a replay
  // re-derives the same figure forever
  // (`Ratio.Actions.Factor.replay_is_determined_by_the_prefix`). One in a side
  // plane — where every book written before that change has them — is pinned by
  // no strike, so under the factor representation a replay reads whatever has
  // arrived since and answers differently.
  //
  // ⚠ Such a book cannot be made retroactively pinnable. The announcements were
  // not in the order, and no rewrite can put them there without changing every
  // digest after the point. Reporting the zero is the only honest option.
  int64 announce_position = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // ⭐ The NAV strikes this action was NOT in — resource names, so a caller can
  // follow them.
  //
  // This is the reverse of `NavStrike.qualification` and the reason the screen
  // is worth having: the strike knows what qualifies it, but only the action
  // knows the full extent of what it disturbed. `Ratio.Period.one_answer_per_
  // day` refuses restatement, so this list can never be emptied by fixing
  // anything — it is the permanent record of what a late arrival cost.
  repeated string qualified_nav_strikes = 10
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The result of re-deriving a strike. Not a resource — nothing stores it;
// it is computed on demand and is only meaningful about the strike it names.
message ReplayNavStrikeResponse {
  // The strike that was replayed.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The journal prefix still hashes to what the strike recorded. False means
  // history was rewritten, which an append-only journal should prevent.
  bool history_intact = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The fold produced the same figures. False means the engine is not
  // deterministic, which is the claim this product is built on.
  bool reproduced = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What the re-derivation actually produced, so a mismatch can be read rather
  // than merely reported.
  string net_asset_value = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string journal_digest = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One step of a NAV strike's plan.
//
// ⛔ EVERY FIGURE ON THIS MESSAGE IS A STRING, AND AN EMPTY ONE MEANS THERE IS
// NO FIGURE — never "0". `View.realized_gain` already carries that convention
// for the same reason, and here it is load-bearing twice over: a rendered zero
// that nothing measured reads as "instant", and a rendered zero that nothing
// estimated reads as "free". Ratio has shipped the inverse of this once —
// `fx_rate` returned a figure two orders of magnitude wrong for months because
// its only consumer discarded it.
message PlanNode {
  // Which of the two answers to "what is this fund worth" this step belongs to.
  enum Group {
    GROUP_UNSPECIFIED = 0;

    // `ratio_nav::strike` — the fold that produced the record. Grows with the
    // journal, and the proved model has no term for it at all.
    GROUP_RECORDED = 1;

    // `Projection::nav` — the same figure off maintained totals. The chart and
    // the currencies, flat in fragmentation.
    GROUP_MAINTAINED = 2;
  }

  // What the step is doing on the page.
  enum Role {
    ROLE_UNSPECIFIED = 0;

    // It runs.
    ROLE_CHOSEN = 1;

    // A plan for the same answer that costs more and is not taken.
    ROLE_REJECTED = 2;

    // Where the strike stops rather than reporting a figure it cannot stand
    // behind.
    ROLE_REFUSAL = 3;

    // ⛔ NOT `REJECTED`. A rejected step would have worked and cost more; an
    // unread one is never touched — `Ratio.Closure.factored_nav_never_reads_the_
    // lots` — and collapsing the two would lose the only claim on this screen
    // that is a theorem.
    ROLE_UNREAD = 4;
  }

  // Stable within one plan. Edges name these.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What it does, in the operator style EXPLAIN uses.
  string operator = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The one line that qualifies it — the equivalent of an index name.
  string detail = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  Group group = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  Role role = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The theorem or the function this cost comes from.
  //
  // ⛔ REQUIRED OF EVERY NODE, and the Rust builder has a test that no step
  // ships without one. A number on this screen that a reader cannot trace is the
  // thing the whole product argues against.
  string cites = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Why it costs what it costs. Rendered, not decoration.
  repeated string note = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Reads, from the proved model or from the strike's own record. EMPTY where
  // nothing costs this step.
  string estimated_reads = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // `estimated_reads` times the calibrated rate. The measured half of an
  // estimate whose other half is proved, kept apart from it on purpose.
  //
  // ⛔ A DURATION, AND NOT NAMED `estimated_nanos`. `core::0142::time-field-type`
  // flags any field whose last underscore-separated token is a time unit —
  // `nanos`, `millis`, `seconds`, `time` — and it accepts ONLY Timestamp, Date,
  // DateTime and TimeOfDay. A `google.protobuf.Duration` called `_nanos` fails
  // it just as a string does; what fixes it is the NAME. `View.nav_strike` is
  // the precedent: a Duration named for what it measures rather than for its
  // unit.
  //
  // ⭐ AND THE TYPE BUYS SOMETHING THE STRING DID NOT — real presence. Absent
  // renders as JSON `null`, so "nothing costed this step" stops relying on the
  // empty-string convention the counts still use.
  google.protobuf.Duration estimated_duration = 9
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // What an instrumented re-fold actually saw. EMPTY / null unless `analyzed`.
  string actual_rows = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Duration actual_duration = 11
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// An edge of the plan.
message PlanEdge {
  enum Kind {
    KIND_UNSPECIFIED = 0;

    // Rows moving from one step to the next.
    KIND_FLOW = 1;

    // Where those rows go instead when the strike refuses them.
    KIND_REFUSAL = 2;

    // Drawn, and carrying nothing.
    KIND_UNREAD = 3;
  }

  // ⛔ `source`/`target`, NOT `from`/`to`. `from` is on AIP-140's reserved-word
  // list because it is a Python keyword, and `//proto:ratio_aip_lint` runs with
  // every rule but one enabled. The internal model in `ratio_nav::explain`
  // spells them the same way, so no layer has to translate.
  string source = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string target = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  Kind kind = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Rows that travelled it. Empty when nothing measured them.
  string rows = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The fund's shape, as the estimate was taken over it.
//
// ⛔ READ OFF THE BOOK, NEVER TYPED IN. `/scale` offers dials because it argues
// about funds that do not exist; this explains one that does.
//
// ⛔ AND `securities` AND `lots_per` ARE SEPARATE BECAUSE THE PRODUCT IS. 500 x
// 40,000 and 10,000 x 2,000 are both twenty million open tax lots and are NOT
// the same fund — marking reads one price per SECURITY, so the two differ
// twentyfold in the term that grows with the chart. A single lot count would
// hide that, and has: HANDOFF.md records two runs captioned identically that
// describe different books.
message PlanDials {
  string securities = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string currencies = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Open lots per security. ⚠ AN AVERAGE, derived by dividing and rounding
  // down. The action term multiplies it and wants the fragmentation of the one
  // instrument a split touches, which a real book's is not uniform in.
  string lots_per = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Announced and not yet rewritten. ⛔ Not announced-ever, which is not a dial.
  string open_actions = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Rows in the chart, and rows the maintained NAV actually walks — one per
  // (dimension, currency), which is NOT the same as one per security.
  string accounts = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  string total_rows = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Open tax lots actually held. The number the scale claim is about, and the
  // one the chosen plan does not read.
  string open_lots = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// How a NAV strike is computed, and what the alternatives would have cost.
//
// ⚠ NAMED FOR THE METHOD RATHER THAN FOR ITSELF. `NavStrikePlan` reads better
// and AIP-136 refuses it: a custom method's response must be `<Rpc>Response` or
// the resource being operated on, and the resource here is `NavStrike`.
// `ReplayNavStrikeResponse` above is the same concession for the same reason.
message ExplainNavStrikeResponse {
  // The strike this explains.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string view = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  repeated PlanNode nodes = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated PlanEdge edges = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Empty when `estimate_refusal` is set.
  PlanDials dials = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Why there is no estimate, when there is none.
  //
  // ⛔ CARRIED, NOT SWALLOWED. The maintained projection folds the whole journal
  // with no cut, so it cannot supply a shape for a trade- or settlement-basis
  // view — and answering with the recorded view's shape under another name is
  // precisely the defect multi-view books exist to prevent. Same posture as
  // `ReconcileViews`, which refuses outright.
  string estimate_refusal = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the fold was re-run under instrumentation.
  //
  // ⛔ WHEN TRUE, THE ACTUALS ARE THIS MACHINE RE-DERIVING THE PREFIX NOW — not
  // what the original strike cost. Nothing was recorded at strike time, and a
  // duration presented as the strike's own would be a fabrication.
  bool analyzed = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Nanoseconds per read, and where that number came from.
  //
  // ⛔ THE PROVENANCE TRAVELS WITH THE FIGURE. Reads are proved; seconds are a
  // property of a machine on a day. A rate with no provenance is a guess wearing
  // a decimal point, and the shipped one was 250 until somebody measured it and
  // found 4,436.
  string nanos_per_read = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  string provenance = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The three costs, side by side.
  //
  // ⛔ ALL THREE, ALWAYS, EVEN WHEN THE REJECTED STEPS ARE COLLAPSED. `ratio
  // bench` "reports two curves and both must be quoted" and this is the same
  // rule: `chosen_reads` is the flattering number, and a screen showing it alone
  // would be the overclaim that command is shaped to make hard.
  //
  // ⚠ NONE OF THEM INCLUDES THE CAPITAL TERM. Counting subscriptions and
  // redemptions needs the chart roles, which the maintained projection does not
  // have — so it is excluded from every figure here rather than guessed at.
  string chosen_reads = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The same period end with its open actions applied by REWRITING the lots
  // they touch. `Ratio.Closure.the_cliff`.
  string rewrite_reads = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Folding every open tax lot instead of reading the maintained totals.
  // `Ratio.Plan.scan_cost_is_the_lots`.
  string scan_reads = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One version of a fund's configuration.
//
// Content-addressed, so the digest IS the identity: two funds running the same
// rules have the same digest, and a version cannot be edited without becoming a
// different version. That is what makes "the configuration this figure was
// computed under" a citation rather than a label.
message ConfigVersion {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/ConfigVersion"
    pattern: "funds/{fund}/configVersions/{config_version}"
    singular: "configVersion"
    plural: "configVersions"
  };

  // The resource name: `funds/{fund}/configVersions/{config_version}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // SHA-256 of the configuration bytes.
  string digest = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Where it sits in this fund's history. 1 is the first.
  int64 sequence = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // True for the version currently in force.
  bool active = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Who promoted it, and when — from what `ratio approve` recorded. Empty for a
  // version that predates the record rather than guessed at: an audit trail
  // that invents an actor is worse than one that admits a gap.
  string actor = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp approve_time = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // The proposal this came from, if it came from one.
  string subject = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The rules, rendered the way the rules screen shows them.
  repeated string rules = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One rule's fate between two versions.
message RuleChange {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ADDED = 1;
    KIND_REMOVED = 2;
    KIND_CHANGED = 3;
  }

  string rule_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  Kind kind = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How the rule read in each version, rendered. Empty on the side where it did
  // not exist. Named for the versions rather than "before"/"after", which
  // AIP-140 rejects as prepositions and which are ambiguous anyway once a diff
  // can run in either direction.
  string base_form = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string form = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListConfigVersionsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListConfigVersionsResponse {
  repeated ConfigVersion config_versions = 1;
  string next_page_token = 2;
}

message GetConfigVersionRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/ConfigVersion"
  ];
}

message DiffConfigVersionsRequest {
  // The version to diff, which is the AFTER side.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/ConfigVersion"
  ];

  // The digest to compare against. Defaults to the version immediately before
  // `name` in this fund's history, which is the comparison somebody almost
  // always wants and the one it is tedious to look up.
  string base = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DiffConfigVersionsResponse {
  string base_digest = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string digest = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Empty when the two versions hold the same rules — which happens, because a
  // digest changes on any byte and formatting is a byte.
  repeated RuleChange changes = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message Account {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Account"
    pattern: "funds/{fund}/views/{view}/accounts/{account}"
    singular: "account"
    plural: "accounts"
  };

  // What the account is, which fixes which side is normal for it.
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_ASSET = 1;
    TYPE_LIABILITY = 2;
    TYPE_EQUITY = 3;
    TYPE_REVENUE = 4;
    TYPE_EXPENSE = 5;
  }

  // The resource name: `funds/{fund}/accounts/{account}`, where the account id
  // is its dimension. The dimension is what postings carry, so it is the
  // stable id; the display name is a label a chart can revise.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The account dimension postings are keyed by.
  string dimension = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  Type type = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as strings. Debits and credits are reported separately as
  // well as netted, because a netted figure hides gross activity — an account
  // that moved ten million each way is not the same as one that never moved.
  string debit = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  string credit = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Debits minus credits. Signed, and not flipped to the account's normal
  // side: a presentation that always shows a positive number cannot show the
  // case worth seeing.
  string balance = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // True when the balance sits on the side this type calls abnormal — a
  // negative asset, a positive liability. Legal, and usually worth a look.
  bool abnormal = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  string posting_count = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The same account, one row per currency it actually holds.
  //
  // The fields above are ONE figure per account, which means they are
  // translated: an account holding dollars and euros reports their converted
  // sum. That is the right thing for a chart row and it is not the whole
  // truth, because the rate is a judgment and the denominations are a fact.
  //
  // A reader checking a figure needs the fact. `balances_by_dim` folded the
  // currency away entirely and five surfaces printed the result as a trial
  // balance, adding dollars to euros under one label; the fold now carries the
  // currency and every other surface shows the split. This is the console
  // catching up, so that the one screen a customer looks at is not the one
  // that cannot show it.
  //
  // Empty on a single-currency fund: there is nothing a split would add.
  repeated CurrencyTotal currency_totals = 10
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One account's activity in one denomination, before any translation.
//
// This is the untranslated fact underneath `Account.debit`/`credit`, so a
// reader can see what the rate did rather than take the converted figure on
// trust.
message CurrencyTotal {
  // ISO 4217, or empty for a posting that named no currency. Empty is its own
  // group and NOT the fund's currency: for conservation an untyped leg cannot
  // be assumed to be any particular denomination, and quietly labeling it USD
  // is how a mismatch becomes invisible.
  string currency_code = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as strings, in THIS currency — not converted.
  string debit = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string credit = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Debits minus credits, in this currency. Signed, like `Account.balance`.
  string balance = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What this denomination was multiplied by to reach the translated figure,
  // in hundredths. Empty for the fund's own currency, which has no rate fact —
  // a fund does not record what a dollar is worth in dollars.
  string rate = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The rate fact this translation cites, so a reader can open it from the
  // figure rather than only from the CLI. Empty for the base currency and for
  // an untyped leg — both translate at par without a fact.
  string rate_fact = 6 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fact"
  ];
  string delivery_digest = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The config digest that fact pinned — the active configuration the ingest
  // run used, not whichever is in force now.
  string config_digest = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One line of one entry, as it lands on an account.
message Posting {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Posting"
    pattern: "funds/{fund}/views/{view}/accounts/{account}/postings/{posting}"
    singular: "posting"
    plural: "postings"
  };

  // The resource name. The posting id is the entry id and the leg's position
  // within that entry — one entry may touch the same account twice, and two
  // lines that cannot be told apart cannot be cited.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  string entry_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string memo = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as a string. Signed: a debit is positive.
  string amount = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The account's balance after this line, folding from the start of the
  // journal. This is the audit trail as a running figure rather than a final
  // one — you can see where a balance became what it is.
  string running_balance = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration in force when this line was posted, which is not
  // necessarily the one active now.
  string config_digest = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListAccountsRequest {
  // A view. See `ListBreaksRequest.parent`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/View"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // `posted` for accounts that have postings on them, `abnormal` for those
  // sitting on the wrong side; empty for the whole chart. Three chips, not an
  // expression language — same reasoning as ListBreaks.
  //
  // `sheet` keeps assets, liabilities, equity, income and expense so a
  // balance sheet can foot (A = L + E + surplus). `pnl` keeps income and
  // expense. `capital` keeps partner / contribution / distribution /
  // allocation / transfer equity and commitment / undrawn equity
  // (not unrealized gain). `budget-YYYY[-MM]`
  // is household spend in a calendar window. `loan-YYYY[-MM]` is a household
  // loan roll-forward keyed by named liability. All are presentations of the
  // same chart; they do not invent accounts.
  //
  // ⛔ A MONTH OR YEAR IS A SUFFIX, NOT A SECOND FIELD. AIP-132 List requests
  // carry parent, page_size, page_token, and filter. `pnl-2026-03` is March;
  // `pnl-2026` is the year; `sheet-2026-03` is as-of that month end;
  // `capital-2026-03` is March capital activity; `budget-2026-03` is March
  // household spend; `loan-2026-03` is March loan activity with the as-of-end
  // balance (beginning = ending − (debit − credit)). Bare `pnl` / `budget` /
  // `loan` is refused — cumulative income, spend, or liability is an
  // ABOR-shaped figure wearing the wrong label. Bare `capital` is
  // inception-to-date. An entry with no date is not in any period fold.
  // Hyphens, not colons: the transcode does not percent-decode query values.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ListAccountsResponse {
  repeated Account accounts = 1;
  string next_page_token = 2;
}

message GetAccountRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Account"
  ];
}

message ListPostingsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Account"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListPostingsResponse {
  repeated Posting postings = 1;
  string next_page_token = 2;
}

message GetPostingRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Posting"
  ];
}

// One rule of the active configuration, structured enough to choose from.
message Rule {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Rule"
    pattern: "funds/{fund}/rules/{rule}"
    singular: "rule"
    plural: "rules"
  };

  // What an event of this kind needs, which fixes what a caller must supply.
  enum Kind {
    KIND_UNSPECIFIED = 0;

    // Takes an amount: the consideration.
    KIND_TRADE = 1;

    // Takes an amount: the cash received.
    KIND_DIVIDEND = 2;

    // Takes an amount (the basis the rate applies to) AND a day count.
    KIND_ACCRUAL = 3;

    // Takes the difference between what the book holds a position at and what
    // it is worth. Not invoked by recording an event — a valuation computes
    // the amount, because only it knows the carrying value.
    KIND_MARK = 4;
  }

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string rule_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  Kind kind = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string description = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The rule as the rules screen shows it, so a caller can read what it is
  // about to invoke rather than trust its name.
  string form = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The accounts it posts to, as display names, in leg order.
  repeated string accounts = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListRulesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListRulesResponse {
  repeated Rule rules = 1;
  string next_page_token = 2;
}

// One entry in the journal, and the postings the rule produced.
message Entry {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Entry"
    pattern: "funds/{fund}/entries/{entry}"
    singular: "entry"
    plural: "entries"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string entry_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string memo = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration that decided these postings.
  string config_digest = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  repeated EntryPosting postings = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message EntryPosting {
  // The account, as a resource name:
  // `funds/{fund}/views/{view}/accounts/{account}`.
  //
  // ⚠ VIEW-SCOPED, even though GetEntry is a fund-level RPC. A name that
  // omitted the view would not resolve after the jobs moved under `/books`;
  // ApplyEvent and GetEntry both name the book's default view, the same one
  // ApplyEvent's NAV quote is about. The chart itself does not depend on a
  // view; only its totals do.
  string account = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Account"
  ];

  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as a string. Signed: a debit is positive.
  string amount = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetEntryRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Entry"
  ];
}

message ListEntriesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListEntriesResponse {
  repeated Entry entries = 1;
  string next_page_token = 2;
}

message GetRuleRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Rule"
  ];
}

message ApplyEventRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];

  // Which rule of the ACTIVE configuration to apply. Not a set of postings:
  // see the comment on the method.
  string rule_id = 2 [(google.api.field_behavior) = REQUIRED];

  // The event's own identifier, carried onto the journal entry so the entry
  // can be traced back to what caused it.
  string event_id = 3 [(google.api.field_behavior) = REQUIRED];

  // A DECIMAL string as a person types it — "250000.00", not minor units.
  //
  // Parsed on the server, exactly, by splitting on the point. The browser
  // never does arithmetic on money: `parseFloat("1.005") * 100` is
  // 100.49999999999999, and a product whose whole claim is exactness must not
  // lose it in the form.
  string amount = 4 [(google.api.field_behavior) = REQUIRED];

  // Accrual rules only: how many days of the period this covers.
  string days = 5 [(google.api.field_behavior) = OPTIONAL];

  // Compute the entry and the resulting NAV, and write NOTHING. (AIP-163)
  bool validate_only = 6 [(google.api.field_behavior) = OPTIONAL];

  // The instrument this event concerns, as the entity master names it.
  //
  // ⛔ WITHOUT IT AN EVENT MOVES VALUE AND NOTHING ELSE. `ratio_project`'s walk
  // skips any posting that does not carry BOTH an instrument and a quantity, so
  // a trade recorded without them opens no tax lot and relieves none — while the
  // entry balances, the trial balance ties and the NAV moves by the right
  // amount. That is why the gap survived: nothing downstream objects, and the
  // position's unit count is simply somebody else's.
  //
  // ⚠ Only legs that declare `per_instrument` carry it; the rest are unchanged.
  string instrument = 7 [(google.api.field_behavior) = OPTIONAL];

  // Whole units moved, as a decimal string.
  //
  // ⛔ POSITIVE ON BOTH SIDES. A sale is not a purchase with a minus in front of
  // it: `Ratio.Chart.applyTemplate` takes the quantity's sign from the LEG, so a
  // purchase debits investments and adds units while the disposal leg credits
  // and removes them. Sending a negative here would add units on a sale.
  //
  // ⚠ Refused rather than rounded when it is not whole. Fractional units are a
  // real thing and this field cannot express one; carrying it as no quantity —
  // which is what the data plane does — would silently produce the lot-less
  // entry this field exists to prevent.
  string quantity = 8 [(google.api.field_behavior) = OPTIONAL];

  // The day this was dealt.
  //
  // ⛔ A CALENDAR DAY, NOT AN INSTANT, and it is what a lot's holding period is
  // established from. `Ratio.Lots.Relief`'s methods REFUSE a lot that carries
  // none rather than defaulting, because both defaults are wrong in opposite
  // directions — so an entry without this opens lots no method will classify,
  // and the gain lands in the unclassified residue.
  google.type.Date trade_date = 9 [(google.api.field_behavior) = OPTIONAL];
}

message ApplyEventResponse {
  // The entry the rule produced. Present whether or not it was written.
  Entry entry = 1;

  // True when nothing was written because `validate_only` was set.
  bool validate_only = 2;

  // The fund's NAV with this entry, and what it was without it. Both in minor
  // units, and reported as a pair rather than as a delta: a NAV is the figure
  // that matters, and a delta invites reading the difference as the answer.
  //
  // Named without "before"/"after", which AIP-140 rejects as prepositions.
  string net_asset_value = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string previous_net_asset_value = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A file received on the data plane.
message Delivery {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Delivery"
    pattern: "funds/{fund}/deliveries/{delivery}"
    singular: "delivery"
    plural: "deliveries"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // SHA-256 of the bytes, taken on arrival. The same file delivered twice is
  // recognizable rather than a second copy.
  string digest = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Where it came from — a path, an S3 key, an SFTP URL.
  string origin = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp receive_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  string byte_count = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many facts were read out of it, and how many of those cannot post yet.
  string fact_count = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  string pending_fact_count = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A fact that cannot post yet, and why.
message PendingFact {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/PendingFact"
    pattern: "funds/{fund}/pendingFacts/{pending_fact}"
    singular: "pendingFact"
    plural: "pendingFacts"
  };

  // How a reference failed to resolve. Three outcomes, not two: the remedies
  // differ, and reporting an ambiguity as "unknown" invites adding a THIRD
  // record to a master that already has one too many.
  enum Blocker {
    BLOCKER_UNSPECIFIED = 0;

    // Nothing in the master matches. Someone adds the instrument or broker.
    BLOCKER_ABSENT = 1;

    // More than one matches. The master needs narrowing or de-duplicating.
    BLOCKER_AMBIGUOUS = 2;
  }

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The row's own reference, as the counterparty knows it.
  string reference = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  string kind = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  Blocker blocker = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What blocks it, in a sentence an operator can act on — naming the claim
  // that was looked for rather than saying "unresolved".
  string detail = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The chain back to the bytes: which delivery, which row, which template.
  string delivery_digest = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  string row = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  string template_id = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListDeliveriesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListDeliveriesResponse {
  repeated Delivery deliveries = 1;
  string next_page_token = 2;
}

message ListPendingFactsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListPendingFactsResponse {
  repeated PendingFact pending_facts = 1;
  string next_page_token = 2;
}

message GetDeliveryRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Delivery"
  ];
}

message GetPendingFactRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/PendingFact"
  ];
}

// A fact the data plane has recorded — a price, an FX rate, a trade.
//
// ⛔ APPEND-ONLY. A correction is a new fact with its own provenance, never an
// edit of this one. `superseded` is derived from the log so both records stay
// readable: the stale rate is still the rate a figure struck that morning
// cited, and the later one is the rate in force now.
message Fact {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Fact"
    pattern: "funds/{fund}/facts/{fact}"
    singular: "fact"
    plural: "facts"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // `price`, `rate`, or whatever the template declared.
  string kind = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The row's own reference, as the counterparty knows it.
  string reference = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What this fact asserts, as a person reads it — "EUR at 1.08" or
  // "ACME at 251.14 on 2026-02-26".
  string assertion = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The chain back to the bytes, and the configuration the ingest run pinned.
  string delivery_digest = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  string row = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  string template_id = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // `Provenance.template`: the digest of the configuration that held the
  // mapping. A fact can always name the rules that produced it.
  string config_digest = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // True when a later fact of the same kind and subject superseded this one.
  // Derived, never stored — the log only appends.
  bool superseded = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListFactsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // `kind=price` or `kind=rate`. Empty lists every recorded fact.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ListFactsResponse {
  repeated Fact facts = 1;
  string next_page_token = 2;
}

message GetFactRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fact"
  ];
}

// What a fund holds in one instrument, in one account.
message Position {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Position"
    pattern: "funds/{fund}/views/{view}/positions/{position}"
    singular: "position"
    plural: "positions"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The account, as a resource name.
  string account = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Account"
  ];
  // Its label, so a screen does not have to join to show one. `_label` rather
  // than `_name`: AIP-122 reserves `name` for a resource name.
  string account_label = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The instrument this is held in. EMPTY for value in the account that is not
  // attributed to any instrument — which is a real row, not a missing one.
  string instrument = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string instrument_label = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whole units.
  //
  // ⚠ A MEASURE, not a conserved quantity: buying a hundred shares creates a
  // hundred here and destroys them at the counterparty, who is outside this
  // book. What checks it is reconciliation against the custodian.
  string quantity = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What the book holds it at, in minor units. Value DOES conserve — an
  // instrument partitions where it sits, not how much there is.
  string value = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many open tax lots stand behind this figure.
  //
  // ⛔ THE NUMBER THAT DOES NOT APPEAR IN A NAV, SHOWN NEXT TO ONE THAT DOES.
  // `Ratio.Closure.factored_nav_never_reads_the_lots` — a position is a chart
  // and its lots are a history, and the whole scale argument is that valuing
  // the first does not touch the second. Putting them side by side is what lets
  // a reader see that twenty thousand lots produced one line.
  int64 open_lot_count = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The valuation date this was last marked at, ABSENT if it never has been.
  //
  // ⛔ THE DIFFERENCE BETWEEN COST AND MARKET, ON THE FACE OF THE FIGURE. Two
  // positions can show the same number for opposite reasons — one because that
  // is what it is worth, the other because that is what it cost and nobody has
  // priced it. A screen that does not distinguish them is reporting an opinion
  // as a fact.
  google.type.Date mark_date = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The price fact the last mark cited. Empty if this position has never been
  // marked — then the value is cost, and there is no price to open.
  string price_fact = 9 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fact"
  ];
  string delivery_digest = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  string config_digest = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListPositionsRequest {
  // A view. See `ListBreaksRequest.parent`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/View"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListPositionsResponse {
  repeated Position positions = 1;
  string next_page_token = 2;
}

message GetPositionRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Position"
  ];
}

// One open tax lot: what was bought, when, and what it cost.
//
// ⛔ THE THING A REALIZED GAIN IS COMPUTED FROM, and the reason the lot method
// is a term of an agreement rather than a preference. A sale gives up some of
// these and not others, and which ones decides the taxable income.
message Lot {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Lot"
    pattern: "funds/{fund}/views/{view}/positions/{position}/lots/{lot}"
    singular: "lot"
    plural: "lots"
  };

  // The resource name: `funds/{fund}/positions/{position}/lots/{lot}`, where
  // the lot id is its journal position.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Acquisition order, which is the journal position of the entry that opened
  // it. ⛔ NOT A DATE: two lots acquired a year apart may be adjacent ordinals,
  // and FIFO is this field while the holding period is the one below.
  int64 sequence = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Units still open in this lot.
  string units = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What those units cost, in minor units. ⛔ COST, NOT VALUE — a lot is never
  // revalued. `//tla:valuation_check`'s `CostIsNeverRevalued`.
  string cost = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The day it was acquired, ABSENT when the entry that opened it carried no
  // trade date.
  //
  // ⛔ ABSENT RATHER THAN DEFAULTED, and the holding-period methods REFUSE such
  // a holding rather than guessing. Both defaults are wrong in opposite
  // directions: the epoch makes it long-term at the favorable rate on records
  // that do not support the claim, and today makes it short-term on a holding
  // that may have been held for years.
  google.type.Date acquired = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListLotsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Position"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListLotsResponse {
  repeated Lot lots = 1;
  string next_page_token = 2;
}

message GetLotRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Lot"
  ];
}

// A mapping template: how a counterparty's file becomes facts.
message Template {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Template"
    pattern: "funds/{fund}/templates/{template}"
    singular: "template"
    plural: "templates"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string template_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What a row of this file is: a trade, a price, an fx rate.
  string fact_kind = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The template as a person reads it — the same rendering the rules screen
  // uses, so a mapping can be read before it is trusted.
  string form = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // False for reference data — a price file, an FX file, a security master —
  // which is recorded, resolved and citable, and never touches the books.
  bool posts = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListTemplatesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListTemplatesResponse {
  repeated Template templates = 1;
  string next_page_token = 2;
}

message GetTemplateRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Template"
  ];
}

// A row the template could not map, and why. Per row, never per file.
message RejectedRow {
  string row = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string reason = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message IngestDeliveryRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];

  // A template in the configuration in force.
  string template_id = 2 [(google.api.field_behavior) = REQUIRED];

  // The file, verbatim.
  string content = 3 [(google.api.field_behavior) = REQUIRED];

  // What to call it — a filename, an S3 key, an SFTP path.
  string origin = 4 [(google.api.field_behavior) = OPTIONAL];

  // Read the file and report what it would produce, recording nothing.
  bool validate_only = 5 [(google.api.field_behavior) = OPTIONAL];
}

message IngestDeliveryResponse {
  string delivery_digest = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string row_count = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Facts this file produced, and how many of them are new — the same bytes
  // under the same template do not produce a second set.
  string fact_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string new_fact_count = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  string ready_count = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated RejectedRow rejected = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated PendingFact pending = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  bool validate_only = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One position's valuation.
message Mark {
  // The instrument, and the label the screens show.
  string instrument = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string instrument_label = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whole units held.
  string quantity = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What the book held it at, what it is worth, and the difference the mark
  // posts. All in minor units.
  string carrying = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string market = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  string movement = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The price used, and the day it was observed — never after the valuation
  // date.
  string price = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.type.Date price_date = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The fact that supplied the price, so a mark preview names its evidence.
  string price_fact = 9 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fact"
  ];
  string delivery_digest = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  string config_digest = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message MarkPositionsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];

  // The day to value at. A price observed after it is not evidence about it
  // and is not used.
  //
  // A `Date` and not a `Timestamp`: a valuation date is a calendar day, not an
  // instant, and pretending otherwise would invite a timezone into a figure
  // that does not have one.
  google.type.Date valuation_date = 2 [(google.api.field_behavior) = REQUIRED];

  // Compute the marks and post nothing. (AIP-163)
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

message MarkPositionsResponse {
  repeated Mark marks = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Positions nothing has priced on or before the date. NOT marked at zero.
  repeated Mark unpriced = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Positions whose arithmetic does not land on a whole minor unit.
  repeated string inexact = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many entries were posted. A position already at market moves by
  // nothing and posts nothing.
  string posted_count = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  string net_asset_value = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  string previous_net_asset_value = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  bool validate_only = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message AdmitFactsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  bool validate_only = 2 [(google.api.field_behavior) = OPTIONAL];
}

message AdmitFactsResponse {
  string posted_count = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Reference data — a price file, an FX file — declares no posting rules. It
  // is recorded, resolved and citable, and never touches the books. Counted
  // apart from a refusal, because it is the design rather than a fault.
  string recorded_count = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  string pending_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated string refused = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The fund's NAV with what this posted, and what it was without.
  string net_asset_value = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  string previous_net_asset_value = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  bool validate_only = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

