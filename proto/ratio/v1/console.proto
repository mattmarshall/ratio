syntax = "proto3";

// The operations console's contract — the backend-for-frontend.
//
// # Why a BFF and not the domain services directly
//
// `Chart` and `Ledger` are the domain: accounts, transactions, a trial
// balance. A fund controller on a NAV day does not think in those terms. They
// think in funds that are blocked or struck, exceptions ordered by money at
// risk, and a deadline. Shaping that in the browser would mean the console
// issuing a fan-out of domain calls and reassembling them — over a link whose
// latency it does not control, in a language where the reassembly is untyped.
//
// So this service is view-shaped on purpose. It is allowed to know what a
// screen needs; the domain services are not allowed to know a screen exists.
//
// # HTTP
//
// Every method carries a `google.api.http` rule, and the transcoder in
// `ratio-console` is generated from nothing — it is written by hand and then
// CHECKED against these annotations by `//crates/ratio-console:transcode_test`,
// which reads the descriptor set this file compiles to. A route that drifts
// from its annotation is a failing build rather than a 404 someone finds.
//
// AIP-idiomatic (aip.dev); lints clean via //proto:ratio_aip_lint. Layout is
// `ratio/v1/console.proto` so the path matches `package ratio.v1` (AIP-191).
package ratio.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.fastverk.ratio.v1";
option java_outer_classname = "ConsoleProto";

// What a fund controller works from.
service Console {
  option (google.api.default_host) = "ratio.fastverk.dev";

  // Lists the funds this operator is responsible for. (AIP-132)
  rpc ListFunds(ListFundsRequest) returns (ListFundsResponse) {
    option (google.api.http) = {get: "/v1/funds"};
  }

  // Gets one fund, with the figures that decide whether its NAV can be
  // struck. (AIP-131)
  rpc GetFund(GetFundRequest) returns (Fund) {
    option (google.api.http) = {get: "/v1/{name=funds/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists a fund's open breaks, ordered by money at risk. (AIP-132)
  rpc ListBreaks(ListBreaksRequest) returns (ListBreaksResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/breaks"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one break, with the postings behind Ratio's figure and the
  // configuration that produced it. (AIP-131)
  rpc GetBreak(GetBreakRequest) returns (Break) {
    option (google.api.http) = {get: "/v1/{name=funds/*/breaks/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists a fund's configuration versions, newest first. (AIP-132)
  rpc ListConfigVersions(ListConfigVersionsRequest)
      returns (ListConfigVersionsResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/configVersions"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one configuration version, with its rules as a person reads them.
  // (AIP-131)
  rpc GetConfigVersion(GetConfigVersionRequest) returns (ConfigVersion) {
    option (google.api.http) = {get: "/v1/{name=funds/*/configVersions/*}"};
    option (google.api.method_signature) = "name";
  }

  // What changed between two configuration versions. (AIP-136)
  //
  // GET, like the replay above: comparing two immutable, content-addressed
  // blobs is safe and idempotent, and a verb that implies mutation would be a
  // lie about a method that cannot.
  rpc DiffConfigVersions(DiffConfigVersionsRequest)
      returns (DiffConfigVersionsResponse) {
    option (google.api.http) = {get: "/v1/{name=funds/*/configVersions/*}:diff"};
    option (google.api.method_signature) = "name";
  }

  // Lists a fund's NAV strikes, newest first. (AIP-132)
  rpc ListNavStrikes(ListNavStrikesRequest) returns (ListNavStrikesResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/navStrikes"};
    option (google.api.method_signature) = "parent";
  }

  // Gets one NAV strike. (AIP-131)
  rpc GetNavStrike(GetNavStrikeRequest) returns (NavStrike) {
    option (google.api.http) = {get: "/v1/{name=funds/*/navStrikes/*}"};
    option (google.api.method_signature) = "name";
  }

  // Re-derives a strike from the journal and reports whether it reproduced.
  // (AIP-136)
  //
  // A custom method on GET rather than POST, which AIP permits for one that is
  // safe and idempotent: replaying reads a journal prefix and folds it. It
  // writes nothing, and a method that cannot change anything should not need a
  // verb that says it might.
  rpc ReplayNavStrike(ReplayNavStrikeRequest) returns (ReplayNavStrikeResponse) {
    option (google.api.http) = {get: "/v1/{name=funds/*/navStrikes/*}:replay"};
    option (google.api.method_signature) = "name";
  }

  // Gets one change-log entry — a permalink for citing a specific approval in
  // an audit, which is the whole reason the log is addressable. (AIP-131)
  rpc GetChangeLogEntry(GetChangeLogEntryRequest) returns (ChangeLogEntry) {
    option (google.api.http) = {get: "/v1/{name=funds/*/changeLogEntries/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists configuration changes, newest first. (AIP-132)
  rpc ListChangeLogEntries(ListChangeLogEntriesRequest)
      returns (ListChangeLogEntriesResponse) {
    option (google.api.http) = {get: "/v1/{parent=funds/*}/changeLogEntries"};
    option (google.api.method_signature) = "parent";
  }
}

// A fund on a valuation date.
message Fund {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Fund"
    pattern: "funds/{fund}"
    singular: "fund"
    plural: "funds"
  };

  // Where a fund is in its NAV day.
  enum State {
    STATE_UNSPECIFIED = 0;

    // Prices have not landed; there is nothing to reconcile yet.
    STATE_AWAITING_PRICES = 1;

    // Open breaks that must be resolved before the NAV can be struck.
    STATE_BLOCKED = 2;

    // Breaks remain, but all of them are explained and within tolerance.
    STATE_IN_REVIEW = 3;

    // Struck and signed off.
    STATE_STRUCK = 4;
  }

  // The resource name: `funds/{fund}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // ISO 4217.
  string currency_code = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  State state = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as a string. Never a float and never a JSON number: a figure
  // that has been exact all the way through the kernel should not become a
  // double in the last hop to a browser.
  string net_asset_value = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Debits minus credits. Zero for any book the journal accepted — it is
  // reported as a figure rather than a green tick because it is a proved
  // property of the kernel, not a check that happened to pass.
  string trial_balance_difference = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The total unresolved difference across open breaks, in minor units. Named
  // for the quantity rather than the phrase "amount at risk", which AIP-140
  // rejects for its preposition and which is vaguer anyway.
  string open_difference = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  int64 entry_count = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  int64 open_break_count = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration every figure above was produced under.
  string config_digest = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// How serious an exception is, which is what the queue is ordered by.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;

  // Explained and within tolerance.
  SEVERITY_LOW = 1;

  // Wants a decision, but does not stop the NAV.
  SEVERITY_MEDIUM = 2;

  // Blocks the NAV.
  SEVERITY_HIGH = 3;
}

// One posting behind a break's figure, as the console shows it.
//
// NOT `ratio.v1.Posting` from ledger.proto, which is the kernel's own type: a
// conserved dimension and an integer. That one is what conservation is proved
// about; this one carries the memo and the provenance a person reads. Folding
// them together would drag `dim` into a view that has no use for it and put a
// display concern into the type the proofs are about.
message BreakPosting {
  string entry_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string memo = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as a string.
  string amount = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration in force when this line was posted — which is not
  // necessarily the one active now. A period spanning a change has to show
  // which entry used which.
  string config_digest = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// An unresolved difference on a fund, as the operator works it.
//
// NAMED FOR WHAT IT IS. `ratio.v1.Exception` in recon.proto already means
// something else — a row a shadow run REFUSED to model — and `ratio.v1.Break`
// there is a line in a finished report. This is neither: it is a break that is
// still open, carrying the severity, the explanation state and the postings an
// operator needs to close it. The console labels these "exceptions" on screen
// because that is the desk's word; the contract uses the accountant's.
message Break {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/Break"
    pattern: "funds/{fund}/breaks/{break}"
    singular: "break"
    plural: "breaks"
  };

  // The resource name: `funds/{fund}/breaks/{break}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The account this concerns, by its name in the chart.
  string account = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  int64 account_dimension = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  Severity severity = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // True when a person has recorded why this difference is acceptable. An
  // unexplained difference is work; an explained one is a note.
  bool explained = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What is different, in words a fund accountant would use.
  string cause = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as strings.
  string ratio_amount = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  string reported_amount = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  string difference = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The postings that produced Ratio's figure.
  repeated BreakPosting postings = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration that produced Ratio's figure. Without it the figure is
  // not checkable, which is the only thing that makes it worth more than the
  // other one.
  string config_digest = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Whether a person or a model did something.
enum ActorKind {
  ACTOR_KIND_UNSPECIFIED = 0;

  ACTOR_KIND_PERSON = 1;

  // A model. It appears in this log only ever as the author of a DRAFT — the
  // verb that changed the books always has a person on it.
  ACTOR_KIND_MODEL = 2;
}

// Who changed the configuration, and how.
message ChangeLogEntry {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/ChangeLogEntry"
    pattern: "funds/{fund}/changeLogEntries/{change_log_entry}"
    singular: "changeLogEntry"
    plural: "changeLogEntries"
  };

  // The resource name: `funds/{fund}/changeLogEntries/{change_log_entry}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Who did it. A model appears here only as the author of a DRAFT; the verb
  // that changed the books always has a person on it.
  string actor = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  ActorKind actor_kind = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // `approved`, `drafted`, `signed_off`, `accepted`.
  string action = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What the action was about — a rule id, an account name.
  string subject = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  string detail = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration that resulted, or `proposal` for a draft.
  string config_digest = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListFundsRequest {
  // (AIP-158)
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

message ListFundsResponse {
  repeated Fund funds = 1;
  string next_page_token = 2;
}

message GetFundRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
}

message ListBreaksRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // `unexplained` or `blocking`; empty for everything. Deliberately not a
  // general filter expression (AIP-160) — the console offers three chips, and
  // an expression language nothing sends is a surface to get wrong.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ListBreaksResponse {
  repeated Break breaks = 1;
  string next_page_token = 2;
}

message GetBreakRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/FundBreak"
  ];
}

message GetChangeLogEntryRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/ChangeLogEntry"
  ];
}

// A NAV, struck at a point in time and pinned to the journal that produced it.
//
// # What makes this more than a saved number
//
// A strike records the journal POSITION it was taken at and a digest of that
// prefix. Re-deriving it folds the same entries and must produce the identical
// figure — so a replay checks two different things at once:
//
//   * the prefix still hashes the same, meaning history was not rewritten; and
//   * the fold still lands on the same number, meaning the engine is
//     deterministic.
//
// Either failing is serious and they fail differently, which is why `NavReplay`
// reports them separately rather than as one boolean. An append-only journal
// should make the first impossible; saying so is cheaper than assuming it.
message NavStrike {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/NavStrike"
    pattern: "funds/{fund}/navStrikes/{nav_strike}"
    singular: "navStrike"
    plural: "navStrikes"
  };

  // The resource name: `funds/{fund}/navStrikes/{nav_strike}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The valuation point — not the moment the command ran. Those differ whenever
  // a strike is taken late, which is most of the time.
  google.protobuf.Timestamp valuation_time = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Who struck it. A NAV is signed by a person; nothing here strikes itself.
  // Named to match ChangeLogEntry rather than inventing a second word.
  string actor = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many journal entries this NAV folds. The pin.
  int64 journal_position = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // SHA-256 of exactly those entries. What makes a rewritten history visible.
  string journal_digest = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Minor units, as strings.
  string net_asset_value = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  string trial_balance_difference = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration in force at the last entry folded.
  string config_digest = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The result of re-deriving a strike. Not a resource — nothing stores it;
// it is computed on demand and is only meaningful about the strike it names.
message ReplayNavStrikeResponse {
  // The strike that was replayed.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The journal prefix still hashes to what the strike recorded. False means
  // history was rewritten, which an append-only journal should prevent.
  bool history_intact = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The fold produced the same figures. False means the engine is not
  // deterministic, which is the claim this product is built on.
  bool reproduced = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What the re-derivation actually produced, so a mismatch can be read rather
  // than merely reported.
  string net_asset_value = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string journal_digest = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One version of a fund's configuration.
//
// Content-addressed, so the digest IS the identity: two funds running the same
// rules have the same digest, and a version cannot be edited without becoming a
// different version. That is what makes "the configuration this figure was
// computed under" a citation rather than a label.
message ConfigVersion {
  option (google.api.resource) = {
    type: "ratio.fastverk.dev/ConfigVersion"
    pattern: "funds/{fund}/configVersions/{config_version}"
    singular: "configVersion"
    plural: "configVersions"
  };

  // The resource name: `funds/{fund}/configVersions/{config_version}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // SHA-256 of the configuration bytes.
  string digest = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Where it sits in this fund's history. 1 is the first.
  int64 sequence = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // True for the version currently in force.
  bool active = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Who promoted it, and when — from what `ratio approve` recorded. Empty for a
  // version that predates the record rather than guessed at: an audit trail
  // that invents an actor is worse than one that admits a gap.
  string actor = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp approve_time = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // The proposal this came from, if it came from one.
  string subject = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The rules, rendered the way the rules screen shows them.
  repeated string rules = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One rule's fate between two versions.
message RuleChange {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ADDED = 1;
    KIND_REMOVED = 2;
    KIND_CHANGED = 3;
  }

  string rule_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  Kind kind = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How the rule read in each version, rendered. Empty on the side where it did
  // not exist. Named for the versions rather than "before"/"after", which
  // AIP-140 rejects as prepositions and which are ambiguous anyway once a diff
  // can run in either direction.
  string base_form = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string form = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListConfigVersionsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListConfigVersionsResponse {
  repeated ConfigVersion config_versions = 1;
  string next_page_token = 2;
}

message GetConfigVersionRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/ConfigVersion"
  ];
}

message DiffConfigVersionsRequest {
  // The version to diff, which is the AFTER side.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/ConfigVersion"
  ];

  // The digest to compare against. Defaults to the version immediately before
  // `name` in this fund's history, which is the comparison somebody almost
  // always wants and the one it is tedious to look up.
  string base = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DiffConfigVersionsResponse {
  string base_digest = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string digest = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Empty when the two versions hold the same rules — which happens, because a
  // digest changes on any byte and formatting is a byte.
  repeated RuleChange changes = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListNavStrikesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListNavStrikesResponse {
  repeated NavStrike nav_strikes = 1;
  string next_page_token = 2;
}

message GetNavStrikeRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/NavStrike"
  ];
}

message ReplayNavStrikeRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/NavStrike"
  ];
}

message ListChangeLogEntriesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "ratio.fastverk.dev/Fund"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListChangeLogEntriesResponse {
  repeated ChangeLogEntry change_log_entries = 1;
  string next_page_token = 2;
}
