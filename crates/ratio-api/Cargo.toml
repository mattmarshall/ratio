[package]
name = "ratio-api"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ratio-kernel = { path = "../ratio-kernel" }
# Versions match the rules_rust_prost 0.70 plugin output (tonic 0.12 / prost 0.13)
# and the //proto:prost_toolchain runtimes, so there's one tonic in the graph.
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
