[package]
name = "ratio-api"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ratio-kernel = { path = "../ratio-kernel" }
ratio-chart = { path = "../ratio-chart" }
ratio-store = { path = "../ratio-store" }
anyhow = "1"
serde_json = "1"
# Versions match the rules_rust_prost 0.70 plugin output (tonic 0.12 / prost 0.13)
# and the //proto:prost_toolchain runtimes, so there's one tonic in the graph.
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net"] }
# ⛔ THE REST SIDE RIDES TONIC'S OWN AXUM. tonic 0.12 already links axum 0.7 for
# its router, so serving JSON from the same crate costs no second HTTP stack —
# `Routes::into_axum_router()` and this router merge into one `axum::serve`.
# Default features stay OFF on purpose: `json` and `query` would pull
# serde_path_to_error and serde_urlencoded, neither of which this workspace
# locks, for two extractors that `serde_json` and a query split replace in ten
# lines. `tokio`/`http1`/`http2` are exactly what `axum::serve` needs.
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "http2"] }
# `ServiceExt::oneshot`, so the REST tests drive the router without a socket.
tower = { version = "0.4", default-features = false, features = ["util"] }
