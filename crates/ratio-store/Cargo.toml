[package]
name = "ratio-store"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ratio-chart = { path = "../ratio-chart" }
ratio-kernel = { path = "../ratio-kernel" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Content addressing. Pure Rust — no C toolchain, which keeps the hermetic
# Bazel build free of a cc dependency for a part-time build.
sha2 = "0.10"
