[package]
name = "ratio"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ratio"
path = "src/main.rs"

[dependencies]
ratio-common = { path = "../ratio-common" }
ratio-kernel = { path = "../ratio-kernel" }
ratio-api = { path = "../ratio-api" }
ratio-agent = { path = "../ratio-agent" }
ratio-chart = { path = "../ratio-chart" }
ratio-console = { path = "../ratio-console" }
ratio-ingest = { path = "../ratio-ingest" }
ratio-mcp = { path = "../ratio-mcp" }
ratio-nav = { path = "../ratio-nav" }
ratio-recon = { path = "../ratio-recon" }
ratio-rules = { path = "../ratio-rules" }
ratio-store = { path = "../ratio-store" }
ratio-tui = { path = "../ratio-tui" }
anyhow = "1"
libc = "0.2"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# The `server` subcommand: a tonic gRPC server on a tokio runtime.
tonic = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The scale screen's button: start one Fargate task, and keep the run record.
#
# ⛔ Same shape as ratio-agent's Bedrock client — default-features off, the
# rustls-based https client, and no extra runtime. `aws-config` resolves the
# function's execution-role credentials, so there is no key in the image.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-ecs = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
# The follow-up report a lead is emailed when their fold completes.
aws-sdk-sesv2 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
# ⛔ PINNED BELOW 1.9, AND NOT BY PREFERENCE. `aws-sdk-s3` pulls `crc-fast`
# through `aws-smithy-checksums`, and from 1.9 it uses `stdarch_x86_avx512` —
# a NIGHTLY library feature. This workspace is on stable 1.85 (MODULE.bazel),
# so the newer versions simply do not compile here. Declared directly because
# a constraint on a transitive dependency has nowhere else to live.
crc-fast = "~1.8"
