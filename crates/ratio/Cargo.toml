[package]
name = "ratio"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ratio"
path = "src/main.rs"

[dependencies]
ratio-common = { path = "../ratio-common" }
ratio-kernel = { path = "../ratio-kernel" }
ratio-api = { path = "../ratio-api" }
ratio-agent = { path = "../ratio-agent" }
ratio-chart = { path = "../ratio-chart" }
ratio-console = { path = "../ratio-console" }
ratio-mcp = { path = "../ratio-mcp" }
ratio-nav = { path = "../ratio-nav" }
ratio-recon = { path = "../ratio-recon" }
ratio-rules = { path = "../ratio-rules" }
ratio-store = { path = "../ratio-store" }
ratio-tui = { path = "../ratio-tui" }
anyhow = "1"
libc = "0.2"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The `server` subcommand: a tonic gRPC server on a tokio runtime.
tonic = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
